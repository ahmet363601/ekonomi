const Calc = {
  fmt(n) {
    const num = Number(n) || 0;
    return PARA + ' ' + num.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },
  toplamGelir(f = {}) {
    let d = state.gelirler;
    if (f.start) d = d.filter(g => g.tarih && g.tarih >= f.start);
    if (f.end)   d = d.filter(g => g.tarih && g.tarih <= f.end);
    return d.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
  },
  toplamGider(f = {}) {
    let d = state.giderler;
    if (f.start) d = d.filter(g => g.tarih && g.tarih >= f.start);
    if (f.end)   d = d.filter(g => g.tarih && g.tarih <= f.end);
    return d.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
  },
  bakiye(f = {}) { return this.toplamGelir(f) - this.toplamGider(f); },
  ayFilter() {
    return SalaryMonth.range(SalaryMonth.currentKey());
  },
  aktifBorcAlacak() {
    return state.borcalacaklar
      .filter(b => !b.odendiMi)
      .reduce((s, b) => {
        const fiyat = this.birimFiyat(b.birim || 'tl');
        const toplamTL = (Number(b.miktar) || 0) * fiyat;
        const odenenTL = (b.payments || []).reduce((p, pm) => p + (Number(pm.miktar) || 0) * fiyat, 0);
        return s + Math.max(0, toplamTL - odenenTL);
      }, 0);
  },
  kategoriGiderler(f = {}) {
    let d = state.giderler;
    if (f.start) d = d.filter(g => g.tarih && g.tarih >= f.start);
    if (f.end)   d = d.filter(g => g.tarih && g.tarih <= f.end);
    return d.reduce((map, g) => {
      const k = g.kategori || 'Diğer';
      map[k] = (map[k] || 0) + (Number(g.miktar) || 0);
      return map;
    }, {});
  },
aylikTrend(aySayisi = 6) {
  const currentKey = SalaryMonth.currentKey();
  const currentStart = dayjs(currentKey + '-15');
  const tumGelirler = this._allGelirler();
  const tumGiderler = this._allGiderler();

  return Array.from({ length: aySayisi }, (_, i) => {
    const monthStart = currentStart.subtract(aySayisi - 1 - i, 'month');
    const key = monthStart.format('YYYY-MM');
    const r = SalaryMonth.range(key);

    return {
      label: monthStart.format('MMM YY'),
      gelir: tumGelirler
        .filter(g => g.tarih && g.tarih >= r.start && g.tarih <= r.end)
        .reduce((s, g) => s + (Number(g.miktar) || 0), 0),
      gider: tumGiderler
        .filter(g => g.tarih && g.tarih >= r.start && g.tarih <= r.end)
        .reduce((s, g) => s + (Number(g.miktar) || 0), 0)
    };
  });
},
  aylikGiderKategori(kategori) {
    const f = this.ayFilter();
    return state.giderler
      .filter(g => g.kategori === kategori && g.tarih && g.tarih >= f.start && g.tarih <= f.end)
      .reduce((s, g) => s + (Number(g.miktar) || 0), 0);
  },

  /* ───── Altın / Birim yardımcıları ───── */
  birimFiyat(birim) {
    birim = birim || 'tl';
    if (birim === 'gram')   return Number(state.ayarlar.gramAltinFiyati) || 0;
    if (birim === 'ceyrek') return Number(state.ayarlar.ceyrekAltinFiyati) || 0;
    return 1;
  },
  birimAdi(birim) {
    return { tl: 'TL', gram: 'Gram Altın', ceyrek: 'Çeyrek Altın' }[birim || 'tl'] || 'TL';
  },
  birimKisa(birim) {
    return { tl: 'TL', gram: 'gr', ceyrek: 'çy' }[birim || 'tl'] || 'TL';
  },
  formatBirim(item) {
    const birim = item.birim || 'tl';
    const m = Number(item.miktar) || 0;
    if (birim === 'tl')     return this.fmt(m);
    if (birim === 'gram')   return m.toLocaleString('tr-TR', {maximumFractionDigits: 2}) + ' gr';
    if (birim === 'ceyrek') return m.toLocaleString('tr-TR', {maximumFractionDigits: 2}) + ' çeyrek';
    return this.fmt(m);
  },
  tlKarsiligi(item) {
    return (Number(item.miktar) || 0) * this.birimFiyat(item.birim || 'tl');
  },
  /* Alacak/Borç birim bazlı özet */
  borcAlacakOzet(tip) {
    const aktif = state.borcalacaklar.filter(b => !b.odendiMi && (!tip || b.tip === tip));
    const o = { tl: 0, gram: 0, ceyrek: 0, toplamTL: 0 };

    aktif.forEach(b => {
      const birim = b.birim || 'tl';
      const fiyat = this.birimFiyat(birim);
      const miktar = Number(b.miktar) || 0;
      const odenen = (b.payments || []).reduce((s, p) => s + (Number(p.miktar) || 0), 0);
      const kalan = Math.max(0, miktar - odenen);

      if (birim === 'gram')        o.gram += kalan;
      else if (birim === 'ceyrek') o.ceyrek += kalan;
      else                          o.tl += kalan;

      o.toplamTL += kalan * fiyat;
    });

    return o;
  },
sonIslemler() {
  return [
    ...state.gelirler.map(g => ({ ...g, _tip: 'gelir' })),
    ...state.giderler.map(g => ({ ...g, _tip: 'gider' })),
    ...state.borcalacaklar.filter(b => !b.odendiMi).map(b => ({ ...b, _tip: b.tip }))
  ].sort((a, b) => {
    // 1️⃣ Önce tarihe göre (en yeni tarih üstte)
    const dateCmp = (b.tarih || '').localeCompare(a.tarih || '');
    if (dateCmp !== 0) return dateCmp;

    // 2️⃣ Aynı tarihte: en son eklenen üstte
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
},


  anomaliTespit() {
    const buAy = SalaryMonth.currentKey();
    const gecenAy = SalaryMonth.previousKey();
    const ikiAy = dayjs(buAy + '-15').subtract(2, 'month').format('YYYY-MM');
    const ucAy = dayjs(buAy + '-15').subtract(3, 'month').format('YYYY-MM');
    const ay = (key) => { const r = SalaryMonth.range(key); return this._kategoriGiderlerTum({ start: r.start, end: r.end }); };
    const bu = ay(buAy), g1 = ay(gecenAy), g2 = ay(ikiAy), g3 = ay(ucAy);
    const bulgular = [];
    Object.entries(bu).forEach(([kat, val]) => {
      if (val < 100) return;
      const gecmis = [g1[kat] || 0, g2[kat] || 0, g3[kat] || 0].filter(v => v > 0);
      if (gecmis.length < 2) return;
      const ort = gecmis.reduce((s, v) => s + v, 0) / gecmis.length;
      if (ort > 0 && val > ort * 1.3) {
        const yuzde = Math.round(((val - ort) / ort) * 100);
        bulgular.push({ kategori: kat, bu: val, ortalama: ort, artisYuzde: yuzde });
      }
    });
    bulgular.sort((a, b) => b.artisYuzde - a.artisYuzde);
    return bulgular;
  },


  /* ═══════════════════════════════════════════════════════
     FAZ 2 — GÖRSEL GENİŞLEME HESAPLAMALARI
     ═══════════════════════════════════════════════════════ */


  /* 3. Cash Flow Waterfall */
  waterfallData(range) {
    const gelir = this._toplamGelirTum(range);
    const gider = this._toplamGiderTum(range);
    const net = gelir - gider;

    const steps = [
      { label: 'Sıfır', start: 0, end: 0, display: 0, type: 'total' },
      { label: 'Gelir', start: 0, end: gelir, display: gelir, type: 'increase' },
      { label: 'Gider', start: Math.max(0, net), end: gelir, display: -gider, type: 'decrease' },
      { label: 'Net', start: 0, end: net, display: net, type: 'result' }
    ];

    return { steps, gelir, gider, net };
  },

  /* 4. Kategori Yarışı — 6 aylık kategori trendleri */
  kategoriTrend(aySayisi = 6) {
    const currentStart = dayjs(SalaryMonth.currentKey() + '-15');
    const data = [];

    for (let i = aySayisi - 1; i >= 0; i--) {
      const monthStart = currentStart.subtract(i, 'month');
      const key = monthStart.format('YYYY-MM');
      const r = SalaryMonth.range(key);
      const kats = this._kategoriGiderlerTum({ start: r.start, end: r.end });
      data.push({ label: monthStart.format('MMM YY'), ...kats });
    }

    const allKats = new Set();
    data.forEach(r => Object.keys(r).forEach(k => { if (k !== 'label') allKats.add(k); }));

    const toplamlar = {};
    allKats.forEach(k => {
      toplamlar[k] = data.reduce((s, d) => s + (Number(d[k]) || 0), 0);
    });
    const siraliKats = [...allKats].sort((a, b) => toplamlar[b] - toplamlar[a]).slice(0, 6);

    return { data, kategoriler: siraliKats };
  },
  /* ═══════════════════════════════════════════════════════
     RAPORLAR — Belirli tarih aralığına göre trend (yeni)
     ═══════════════════════════════════════════════════════ */
aylikTrendBetween(startDate, endDate, maxMonths = 12) {
  const tumGelirler = this._allGelirler();
  const tumGiderler = this._allGiderler();

  // Maaş dönemi anahtarları
  const startKey = SalaryMonth.keyOf(startDate);
  const endKey   = SalaryMonth.keyOf(endDate);
  const months = [];
  let cur = dayjs(startKey + '-15');
  const end = dayjs(endKey + '-15');
  while (cur.isBefore(end) || cur.isSame(end, 'month')) {
    months.push(cur.format('YYYY-MM'));
    cur = cur.add(1, 'month');
  }

  return months.slice(-maxMonths).map(key => {
    const r = SalaryMonth.range(key);
    // Seçilen aralığa kırp
    const sStart = r.start < startDate ? startDate : r.start;
    const sEnd   = r.end > endDate   ? endDate   : r.end;
    return {
      label: SalaryMonth.shortLabel(key),   // "Ekim 2026"
      gelir: tumGelirler.filter(g => g.tarih >= sStart && g.tarih <= sEnd)
                          .reduce((s, g) => s + (Number(g.miktar) || 0), 0),
      gider: tumGiderler.filter(g => g.tarih >= sStart && g.tarih <= sEnd)
                          .reduce((s, g) => s + (Number(g.miktar) || 0), 0)
    };
  });
},                           // 👈 VİRGÜL EKLENDİ

kategoriTrendBetween(startDate, endDate, maxMonths = 12, topN = 6) {
    const tumGiderler = this._allGiderler();
    const startKey = SalaryMonth.keyOf(startDate);
    const endKey   = SalaryMonth.keyOf(endDate);

    const months = [];
    let cur = dayjs(startKey + '-15');
    const end = dayjs(endKey + '-15');
    while (cur.isBefore(end) || cur.isSame(end, 'month')) {
      months.push(cur.format('YYYY-MM'));
      cur = cur.add(1, 'month');
    }

    const limited = months.slice(-maxMonths);
    const data = limited.map(key => {
      const r = SalaryMonth.range(key);
      const sStart = r.start < startDate ? startDate : r.start;
      const sEnd   = r.end   > endDate   ? endDate   : r.end;
      const kats = {};
      tumGiderler
        .filter(g => g.tarih >= sStart && g.tarih <= sEnd)
        .forEach(g => {
          const k = g.kategori || 'Diğer';
          kats[k] = (kats[k] || 0) + (Number(g.miktar) || 0);
        });
      return { label: SalaryMonth.shortLabel(key), ...kats };
    });

    const allKats = new Set();
    data.forEach(r => Object.keys(r).forEach(k => { if (k !== 'label') allKats.add(k); }));
    const toplamlar = {};
    allKats.forEach(k => {
      toplamlar[k] = data.reduce((s, d) => s + (Number(d[k]) || 0), 0);
    });
    const siraliKats = [...allKats].sort((a, b) => toplamlar[b] - toplamlar[a]).slice(0, topN);
    return { data, kategoriler: siraliKats };
  },
  /* 5. Dönem Karşılaştırma */
  donemKarsilastir(key1, key2) {
    const r1 = SalaryMonth.range(key1);
    const r2 = SalaryMonth.range(key2);

    const olustur = (r) => {
      const gelir = this._toplamGelirTum({ start: r.start, end: r.end });
      const gider = this._toplamGiderTum({ start: r.start, end: r.end });
      const kats = this._kategoriGiderlerTum({ start: r.start, end: r.end });
      const islem = this._allGelirler().filter(g => g.tarih >= r.start && g.tarih <= r.end).length +
                    this._allGiderler().filter(g => g.tarih >= r.start && g.tarih <= r.end).length;
      return {
        gelir, gider, kats, islem,
        net: gelir - gider,
        tasarrufOrani: gelir > 0 ? (gelir - gider) / gelir : 0
      };
    };

    // ✅ EKLENDİ: return ifadesi ve kapanış
    return {
      key1, key2,
      label1: SalaryMonth.shortLabel(key1),
      label2: SalaryMonth.shortLabel(key2),
      data1: olustur(r1),
      data2: olustur(r2)
    };
  },
  /* ⛽ AKARYAKIT İSTATİSTİKLERİ — LPG odaklı, Benzin basit toplam */
  fuelStats(range) {
    let all = this._allGiderler().filter(g => {
      const k = (g.kategori || '').toLowerCase();
      return (k === 'araç yakıt' || k === 'akaryakıt') && g.fuel;
    });
    if (range && range.start) all = all.filter(g => g.tarih >= range.start);
    if (range && range.end)   all = all.filter(g => g.tarih <= range.end);
    all.sort((a, b) => {
      if (a.tarih !== b.tarih) return a.tarih.localeCompare(b.tarih);
      return (a.createdAt || '').localeCompare(b.createdAt || '');
    });

    /* ─── Kayıtları normalize et ─── */
    const normalized = all.map(i => {
      const f = i.fuel || {};
      const tip = f.tip || 'benzin';
      let bL = 0, bBF = 0, bTL = 0;
      let lL = 0, lBF = 0, lTL = 0;

      if (tip === 'her-ikisi') {
        bL  = Number(f.benzin?.litre) || 0;
        bBF = Number(f.benzin?.birimFiyat) || 0;
        bTL = Number(f.benzin?.toplam) || (bL * bBF);
        lL  = Number(f.lpg?.litre) || 0;
        lBF = Number(f.lpg?.birimFiyat) || 0;
        lTL = Number(f.lpg?.toplam) || (lL * lBF);
      } else if (tip === 'lpg') {
        lL  = Number(f.lpg?.litre) || Number(f.litre) || 0;
        lBF = Number(f.lpg?.birimFiyat) || Number(f.birimFiyat) || 0;
        lTL = Number(f.lpg?.toplam) || Number(i.miktar) || (lL * lBF);
      } else {
        bL  = Number(f.benzin?.litre) || Number(f.litre) || 0;
        bBF = Number(f.benzin?.birimFiyat) || Number(f.birimFiyat) || 0;
        bTL = Number(f.benzin?.toplam) || Number(i.miktar) || (bL * bBF);
      }

      return {
        ...i,
        _tip: tip,
        _benzin: { litre: bL, birimFiyat: bBF, toplam: bTL },
        _lpg:    { litre: lL, birimFiyat: lBF, toplam: lTL },
        _toplamLitre: bL + lL,
        _toplamTL: bTL + lTL,
        _km: Number(f.km) || 0
      };
    });

    /* ════════════════════════════════════════════════════════════
       LPG — TAM KAPSAMLI İSTATİSTİK (ÖNCELİKLİ)
       Tüketim, sadece ARDIŞIK LPG dolumları arasındaki KM ile hesaplanır.
       ════════════════════════════════════════════════════════════ */
    const lpgItems = normalized.filter(i => i._lpg.litre > 0);
    const lpgTotalLitre = lpgItems.reduce((s, i) => s + i._lpg.litre, 0);
    const lpgTotalTL    = lpgItems.reduce((s, i) => s + i._lpg.toplam, 0);
    const lpgAvgFiyat   = lpgTotalLitre > 0 ? lpgTotalTL / lpgTotalLitre : 0;

    const lpgWithKm = lpgItems.filter(i => i._km > 0)
      .sort((a, b) => {
        if (a.tarih !== b.tarih) return a.tarih.localeCompare(b.tarih);
        return (a.createdAt || '').localeCompare(b.createdAt || '');
      });

    const consumptionRecords = [];
    for (let i = 1; i < lpgWithKm.length; i++) {
      const diff = lpgWithKm[i]._km - lpgWithKm[i-1]._km;
      if (diff > 0) {
        const l100 = (lpgWithKm[i]._lpg.litre * 100) / diff;
        const tlKm = lpgWithKm[i]._lpg.toplam / diff;
        lpgWithKm[i]._lpgMesafe = diff;
        lpgWithKm[i]._lpgL100 = l100;
        lpgWithKm[i]._lpgTlKm = tlKm;
        consumptionRecords.push({
          item: lpgWithKm[i], mesafe: diff, l100, tlKm,
          tl: lpgWithKm[i]._lpg.toplam
        });
      }
    }

    const lpgTotalKm = consumptionRecords.reduce((s, r) => s + r.mesafe, 0);
    const lpgLitreForCalc = consumptionRecords.reduce((s, r) => s + r.item._lpg.litre, 0);
    const lpgAvgL100 = lpgTotalKm > 0 ? (lpgLitreForCalc * 100) / lpgTotalKm : 0;
    /* ✅ DÜZELTME: Sadece ölçülen TL / ölçülen km (ilk dolum TL'si hariç) */
    const lpgTLForCalc = consumptionRecords.reduce((s, r) => s + r.item._lpg.toplam, 0);
    const lpgAvgTlPerKm = lpgTotalKm > 0 ? lpgTLForCalc / lpgTotalKm : 0;

    const l100Arr = consumptionRecords.map(r => r.l100);
    const tlKmArr = consumptionRecords.map(r => r.tlKm);

    const _median = (arr) => {
      if (!arr.length) return 0;
      const s = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(s.length / 2);
      return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    };
    const _stdDev = (arr) => {
      if (arr.length < 2) return 0;
      const m = arr.reduce((s, v) => s + v, 0) / arr.length;
      return Math.sqrt(arr.reduce((s, x) => s + Math.pow(x - m, 2), 0) / arr.length);
    };
    const _pct = (arr, p) => {
      if (!arr.length) return 0;
      const s = [...arr].sort((a, b) => a - b);
      const idx = (p / 100) * (s.length - 1);
      const lo = Math.floor(idx), hi = Math.ceil(idx);
      return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (idx - lo);
    };

    const lpgStats = {
      min: l100Arr.length ? Math.min(...l100Arr) : 0,
      max: l100Arr.length ? Math.max(...l100Arr) : 0,
      median: _median(l100Arr),
      stdDev: _stdDev(l100Arr),
      p25: _pct(l100Arr, 25),
      p75: _pct(l100Arr, 75),
      p90: _pct(l100Arr, 90),
      count: l100Arr.length
    };
    const tlKmStats = {
      min: tlKmArr.length ? Math.min(...tlKmArr) : 0,
      max: tlKmArr.length ? Math.max(...tlKmArr) : 0,
      median: _median(tlKmArr)
    };

    let dolumAraligi = null;
    if (lpgItems.length >= 2) {
      const tarihler = lpgItems.map(i => dayjs(i.tarih)).sort((a, b) => a.valueOf() - b.valueOf());
      const farklar = [];
      for (let i = 1; i < tarihler.length; i++) farklar.push(tarihler[i].diff(tarihler[i-1], 'day'));
      dolumAraligi = {
        ortalama: farklar.reduce((s, v) => s + v, 0) / farklar.length,
        min: Math.min(...farklar),
        max: Math.max(...farklar),
        medyan: _median(farklar)
      };
    }

    const enEkonomik = consumptionRecords.length
      ? consumptionRecords.reduce((a, b) => a.l100 < b.l100 ? a : b).item
      : null;
    const enPahali = consumptionRecords.length
      ? consumptionRecords.reduce((a, b) => a.l100 > b.l100 ? a : b).item
      : null;

    let trend = null;
    if (l100Arr.length >= 2) {
      const son = l100Arr[l100Arr.length - 1];
      const onceki = l100Arr[l100Arr.length - 2];
      const fark = son - onceki;
      trend = {
        yon: fark > 0.001 ? 'up' : (fark < -0.001 ? 'down' : 'same'),
        fark, yuzde: onceki > 0 ? (fark / onceki) * 100 : 0, son, onceki
      };
    }

    let lpgFiyatTrend = null;
    const lFiyatArr = lpgItems.filter(i => i._lpg.birimFiyat > 0)
      .sort((a, b) => a.tarih.localeCompare(b.tarih));
    if (lFiyatArr.length >= 2) {
      const ilk = lFiyatArr[0]._lpg.birimFiyat;
      const son = lFiyatArr[lFiyatArr.length - 1]._lpg.birimFiyat;
      lpgFiyatTrend = {
        ilk, son, fark: son - ilk,
        yuzde: ilk > 0 ? ((son - ilk) / ilk) * 100 : 0
      };
    }

    /* ✅ DÜZELTME: Aylık blok — LPG dolum sayısı ayrı, tüketim sadece ölçülenlerden */
    const byMonth = {};
    normalized.forEach(i => {
      const k = SalaryMonth.keyOf(i.tarih);
      if (!byMonth[k]) byMonth[k] = {
        lpgLitre: 0, lpgTL: 0, lpgCount: 0,
        consumptionLitre: 0, consumptionTL: 0,
        benzinLitre: 0, benzinTL: 0, benzinCount: 0,
        km: 0, count: 0
      };
      byMonth[k].lpgLitre    += i._lpg.litre;
      byMonth[k].lpgTL       += i._lpg.toplam;
      byMonth[k].benzinLitre += i._benzin.litre;
      byMonth[k].benzinTL    += i._benzin.toplam;
      if (i._lpg.litre > 0)    byMonth[k].lpgCount    += 1;
      if (i._benzin.litre > 0) byMonth[k].benzinCount += 1;
      if (i._lpgL100) {
        byMonth[k].consumptionLitre += i._lpg.litre;
        byMonth[k].consumptionTL    += i._lpg.toplam;
        byMonth[k].km               += i._lpgMesafe || 0;
      }
      byMonth[k].count += 1;
    });
    const monthly = Object.entries(byMonth).map(([k, v]) => {
      const avgL100 = v.km > 0 ? (v.consumptionLitre * 100) / v.km : 0;
      const tlPerKm = v.km > 0 ? v.consumptionTL / v.km : 0;
      return { key: k, label: SalaryMonth.shortLabel(k), ...v, avgL100, tlPerKm };
    }).sort((a, b) => a.key.localeCompare(b.key));

    const son6 = monthly.slice(-6);
    const son3 = monthly.slice(-3);
    const projeksiyon = {
      aylikTL:     son6.length ? son6.reduce((s, m) => s + m.lpgTL, 0) / son6.length : 0,
      aylikLitre:  son6.length ? son6.reduce((s, m) => s + m.lpgLitre, 0) / son6.length : 0,
      aylikKm:     son6.length ? son6.reduce((s, m) => s + m.km, 0) / son6.length : 0,
      aylikTL_son3:    son3.length ? son3.reduce((s, m) => s + m.lpgTL, 0) / son3.length : 0,
      aylikLitre_son3: son3.length ? son3.reduce((s, m) => s + m.lpgLitre, 0) / son3.length : 0
    };

    /* ════════════════════════════════════════════════════════════
       BENZİN — Sadece toplamlar (KM/tüketim YOK)
       ════════════════════════════════════════════════════════════ */
    const benzinItems = normalized.filter(i => i._benzin.litre > 0);
    const benzinTotalLitre = benzinItems.reduce((s, i) => s + i._benzin.litre, 0);
    const benzinTotalTL    = benzinItems.reduce((s, i) => s + i._benzin.toplam, 0);
    const benzinAvgFiyat   = benzinTotalLitre > 0 ? benzinTotalTL / benzinTotalLitre : 0;

    let benzinFiyatTrend = null;
    const bFiyatArr = benzinItems.filter(i => i._benzin.birimFiyat > 0)
      .sort((a, b) => a.tarih.localeCompare(b.tarih));
    if (bFiyatArr.length >= 2) {
      const ilk = bFiyatArr[0]._benzin.birimFiyat;
      const son = bFiyatArr[bFiyatArr.length - 1]._benzin.birimFiyat;
      benzinFiyatTrend = {
        ilk, son, fark: son - ilk,
        yuzde: ilk > 0 ? ((son - ilk) / ilk) * 100 : 0
      };
    }

    return {
      count: normalized.length,
      items: normalized,
      lpg: {
        count: lpgItems.length,
        totalLitre: lpgTotalLitre,
        totalTL: lpgTotalTL,
        totalKm: lpgTotalKm,
        avgL100: lpgAvgL100,
        avgTlPerKm: lpgAvgTlPerKm,
        avgFiyat: lpgAvgFiyat,
        stats: lpgStats,
        tlKmStats,
        dolumAraligi,
        enEkonomik,
        enPahali,
        trend,
        fiyatTrend: lpgFiyatTrend,
        projeksiyon,
        monthly,
        withKmCount: lpgWithKm.length,
        l100Arr,
        consumptionRecords,
        items: lpgItems
      },
      benzin: {
        count: benzinItems.length,
        totalLitre: benzinTotalLitre,
        totalTL: benzinTotalTL,
        avgFiyat: benzinAvgFiyat,
        fiyatTrend: benzinFiyatTrend,
        items: benzinItems
      }
    };
  },

  /* ═══════════════════════════════════════════════════════
     TÜM VERİ (Aktif + Arşiv) — Rapor ve Analiz için
     ═══════════════════════════════════════════════════════ */
_allGelirler() {
  const archived = Object.values(state.archives)
    .flatMap(a => Array.isArray(a.gelirler) ? a.gelirler : []);
  const all = [...state.gelirler, ...archived];
  const seen = new Set();
  return all.filter(g => {
    if (!g || !g.id) return true;
    if (seen.has(g.id)) return false;
    seen.add(g.id);
    return true;
  });
},
_allGiderler() {
  const archived = Object.values(state.archives)
    .flatMap(a => Array.isArray(a.giderler) ? a.giderler : []);
  const all = [...state.giderler, ...archived];
  const seen = new Set();
  return all.filter(g => {
    if (!g || !g.id) return true;
    if (seen.has(g.id)) return false;
    seen.add(g.id);
    return true;
  });
},
  _toplamGelirTum(f = {}) {
    let d = this._allGelirler();
    if (f.start) d = d.filter(g => g.tarih && g.tarih >= f.start);
    if (f.end)   d = d.filter(g => g.tarih && g.tarih <= f.end);
    return d.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
  },
  _toplamGiderTum(f = {}) {
    let d = this._allGiderler();
    if (f.start) d = d.filter(g => g.tarih && g.tarih >= f.start);
    if (f.end)   d = d.filter(g => g.tarih && g.tarih <= f.end);
    return d.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
  },
  _kategoriGiderlerTum(f = {}) {
    let d = this._allGiderler();
    if (f.start) d = d.filter(g => g.tarih && g.tarih >= f.start);
    if (f.end)   d = d.filter(g => g.tarih && g.tarih <= f.end);
    return d.reduce((map, g) => {
      const k = g.kategori || 'Diğer';
      map[k] = (map[k] || 0) + (Number(g.miktar) || 0);
      return map;
    }, {});
  },
  /* 🆕 FAZ 3 — Vadesi Yaklaşan Borçlar */
  vadeleriGelenBorclar(gunEsik = 7) {
    const bugun = dayjs().startOf('day');
    return state.borcalacaklar
      .filter(b => !b.odendiMi && b.vadeTarihi)
      .map(b => {
        const kalanGun = dayjs(b.vadeTarihi).startOf('day').diff(bugun, 'day');
        return {
          ...b,
          kalanGun,
          gecti: kalanGun < 0,
          bugun: kalanGun === 0
        };
      })
      .filter(b => b.kalanGun <= gunEsik)
      .sort((a, b) => a.kalanGun - b.kalanGun);
  }
};                 // ← Artık doğru: `}` + `};`

  /* ═══════════════════════════════════════════════════════════════
   YARDIMCI: Son yakıt kaydından güncel KM (aktif + arşiv)
   ═══════════════════════════════════════════════════════════════ */
function _getLastFuelKm() {
  const fuelRecords = Calc._allGiderler()
    .filter(g => {
      const k = (g.kategori || '').toLowerCase();
      return (k === 'araç yakıt' || k === 'akaryakıt') && g.fuel && Number(g.fuel.km) > 0;
    })
    .sort((a, b) => {
      if (a.tarih !== b.tarih) return b.tarih.localeCompare(a.tarih);
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
  return fuelRecords.length > 0 ? Number(fuelRecords[0].fuel.km) : 0;
}
  
/* ═══════════════════════════════════════════════════════════════
   ARAÇ HATIRLATICI — muayene / sigorta / kasko / bakım
   ═══════════════════════════════════════════════════════════════ */
const Vehicle = {
  /* ───── Tarih bazlı hatırlatıcılar (30g sarı / 15g kırmızı) ───── */
  getUpcoming(daysAhead = 45) {
    const today = dayjs().startOf('day');
    const out = [];
    (state.araclar || []).forEach(v => {
      const push = (label, dateStr, icon) => {
        if (!dateStr) return;
        const days = dayjs(dateStr).startOf('day').diff(today, 'day');
        if (days <= daysAhead && days >= -30) {
          let seviye, renk, bg, emoji;
          if (days < 0)        { seviye = 'gecti';      renk = 'var(--danger)';  bg = 'var(--danger-light)';  emoji = '🔥'; }
          else if (days <= 15) { seviye = 'acil';       renk = 'var(--danger)';  bg = 'var(--danger-light)';  emoji = '🚨'; }
          else if (days <= 30) { seviye = 'yaklasiyor'; renk = 'var(--warning)'; bg = 'var(--warning-light)'; emoji = '⚠️'; }
          else                 { seviye = 'iyi';        renk = 'var(--text2)';   bg = 'var(--surface)';       emoji = '✅'; }

          out.push({
            vid: v.id, plaka: v.plaka || '', label, dateStr, icon,
            days, gecti: days < 0, bugun: days === 0,
            seviye, renk, bg, emoji
          });
        }
      };
      push('Muayene',          v.muayeneBitis, 'fa-clipboard-check');
      push('Trafik Sigortası', v.sigorta,      'fa-file-shield');
      push('Kasko',            v.kasko,        'fa-shield-halved');
    });
    return out.sort((a, b) => a.days - b.days);
  },

  /* ───── KM bazlı yağ bakımı (1000 km sarı / 500 km kırmızı) ───── */
  getKmAktif() {
    const currentKm = _getLastFuelKm();
    if (currentKm === 0) return [];

    const out = [];
    (state.araclar || []).forEach(v => {
      const sonKm = Number(v.yagBakimKm);
      const aralik = Number(v.yagBakimAralikKm) || 10000;
      if (!sonKm || sonKm <= 0) return;

      const hedefKm = sonKm + aralik;
      const kalanKm = hedefKm - currentKm;
      const ilerleme = Math.max(0, Math.min(100, ((currentKm - sonKm) / aralik) * 100));

      let seviye, renk, bg, emoji, bildirimMetni;
      if (kalanKm < 0) {
        seviye = 'gecti'; renk = 'var(--danger)'; bg = 'var(--danger-light)';
        emoji = '🔥'; bildirimMetni = `BAKIM GEÇTİ! (${Math.abs(kalanKm).toLocaleString('tr-TR')} km)`;
      } else if (kalanKm <= 500) {
        seviye = 'acil'; renk = 'var(--danger)'; bg = 'var(--danger-light)';
        emoji = '🚨'; bildirimMetni = `ACİL! ${kalanKm.toLocaleString('tr-TR')} km kaldı`;
      } else if (kalanKm <= 1000) {
        seviye = 'yaklasiyor'; renk = 'var(--warning)'; bg = 'var(--warning-light)';
        emoji = '⚠️'; bildirimMetni = `${kalanKm.toLocaleString('tr-TR')} km kaldı`;
      } else {
        seviye = 'iyi'; renk = 'var(--accent)'; bg = 'var(--accent-light)';
        emoji = '✅'; bildirimMetni = `${kalanKm.toLocaleString('tr-TR')} km kaldı`;
      }

      out.push({
        vid: v.id, plaka: v.plaka || '', marka: v.marka || '', model: v.model || '',
        sonBakimKm: sonKm, hedefKm, currentKm, kalanKm, ilerleme, aralik,
        seviye, renk, bg, emoji, bildirimMetni
      });
    });
    return out.sort((a, b) => a.kalanKm - b.kalanKm);
  },

  /* ───── Bakım yapıldı — kayıt ekle + sayaç sıfırla ───── */
  async bakimYap(vehicleId, detay) {
    const v = state.araclar.find(a => a.id === vehicleId);
    if (!v) return false;

    const currentKm = _getLastFuelKm();
    if (currentKm === 0) return false;

    const aralik = Number(v.yagBakimAralikKm) || 10000;
    const kayit = {
      id: Date.now() + Math.random(),
      tarih: detay.tarih || dayjs().format('YYYY-MM-DD'),
      km: currentKm,
      yer: detay.yer || '',
      degisiklikler: detay.degisiklikler || '',
      maliyet: parseFloat(detay.maliyet) || 0,
      notlar: detay.notlar || '',
      sonrakiBakimKm: currentKm + aralik,
      createdAt: new Date().toISOString()
    };

    if (!v.bakimGecmisi) v.bakimGecmisi = [];
    v.bakimGecmisi.push(kayit);
    v.yagBakimKm = currentKm;   // Sayaç sıfırla

    await saveAraclar();
    await addLog('arac_bakim', `${v.plaka} yağ bakımı — ${currentKm.toLocaleString('tr-TR')} km`);
    return kayit;
  },

  /* ───── Bakım geçmişi ───── */
  getBakimGecmisi(vehicleId) {
    const v = state.araclar.find(a => a.id === vehicleId);
    return (v?.bakimGecmisi || []).sort((a, b) => (b.tarih || '').localeCompare(a.tarih || ''));
  }
};
const CRUD = {

      }

  async islemGuncelle(id, tip, guncelleme) {

    arr[idx] = { ...arr[idx], ...guncelleme };
    const after = arr[idx];
    await (tip === 'gelir' ? saveGelirler() : saveGiderler());

    const changes = [];
    if (Number(before.miktar) !== Number(after.miktar)) changes.push(`Miktar: ${Calc.fmt(before.miktar)} → ${Calc.fmt(after.miktar)}`);
    if (before.kategori !== after.kategori)             changes.push(`Kategori: ${before.kategori} → ${after.kategori}`);
    if (before.tarih !== after.tarih)                   changes.push(`Tarih: ${before.tarih} → ${after.tarih}`);
    if (before.aciklama !== after.aciklama)             changes.push('Açıklama değiştirildi');

    await addLog(`${tip}_guncelle`, changes.join(' · ') || 'Değişiklik yok', {
      entityId: id, entityType: tip,
      oldValue: before.miktar, newValue: after.miktar,

  },

  async islemSil(id, tip) {
    /* Silmeden ÖNCE yakala — sonra state'ten düşecek */
    const silinecek = (tip === 'gelir' ? state.gelirler : state.giderler).find(i => i.id == id);

    if (tip === 'gelir') { state.gelirler = state.gelirler.filter(g => g.id != id); await saveGelirler(); }
    else                 { state.giderler = state.giderler.filter(g => g.id != id); await saveGiderler(); }

    await addLog(`${tip}_sil`,
      silinecek ? `${Calc.fmt(silinecek.miktar)} · ${silinecek.kategori}` : `ID:${id}`,
      { entityId: id, entityType: tip, amount: silinecek?.miktar, category: silinecek?.kategori });
    await createAutoBackup();
  },

  async borcEkle(tip, kisiAdi, miktar, birim, tarih, aciklama, vadeTarihi) {
    birim = birim || 'tl';
    const item = { id: Date.now() + Math.random(), tip, kisiAdi, miktar: parseFloat(miktar), birim, tarih, aciklama: aciklama || '', vadeTarihi: vadeTarihi || null, payments: [], odendiMi: false, createdAt: new Date().toISOString() };
    state.borcalacaklar.push(item);
    await saveBorclar();
    await addLog(`borc_ekle_${tip}`,
      `${kisiAdi} · ${Calc.formatBirim(item)}${aciklama ? ' — ' + aciklama.substring(0, 40) : ''}`,
      { entityId: item.id, entityType: tip, person: kisiAdi, amount: miktar, unit: birim, tlValue: Calc.tlKarsiligi(item) });    await createAutoBackup();
    return item;
  },

  async borcSil(id) {
    /* Silmeden ÖNCE yakala */
    const silinen = state.borcalacaklar.find(b => b.id == id);

    state.borcalacaklar = state.borcalacaklar.filter(b => b.id != id);
    await saveBorclar();

    await addLog('borc_sil',
      silinen ? `${silinen.kisiAdi} · ${Calc.formatBirim(silinen)}` : `ID:${id}`,
      { entityId: id, person: silinen?.kisiAdi, amount: silinen?.miktar, unit: silinen?.birim });
    await createAutoBackup();
  },

  async borcOdendi(id) {
    const item = state.borcalacaklar.find(b => b.id == id);
    if (!item) return false;
    item.odendiMi = true;
    item.odemeTarihi = new Date().toISOString();   // ← YENİ: arşiv sıralaması için
    await saveBorclar();
    await addLog('borc_tam_odendi',
      `${item.kisiAdi} · ${Calc.formatBirim(item)}`,
      { entityId: id, person: item.kisiAdi, amount: item.miktar, unit: item.birim, tlValue: Calc.tlKarsiligi(item) });    await createAutoBackup();
    return true;
  },

  async araOdemeEkle(borcId, miktar, tarih, aciklama) {
    const item = state.borcalacaklar.find(b => b.id == borcId);
    if (!item) return false;
    if (!item.payments) item.payments = [];
    item.payments.push({ id: Date.now() + Math.random(), miktar: parseFloat(miktar), tarih, aciklama: aciklama || '' });
    const odenen = item.payments.reduce((s, p) => s + p.miktar, 0);
    if (odenen >= item.miktar) {
      item.odendiMi = true;
      item.odemeTarihi = new Date().toISOString();   // ← YENİ
    }
    await saveBorclar();
    const totalPaid = item.payments.reduce((s, p) => s + p.miktar, 0);
    await addLog('ara_odeme',
      `${item.kisiAdi} · ${Calc.fmt(miktar)} ödendi (toplam: ${Calc.fmt(totalPaid)} / ${Calc.fmt(item.miktar)})`,
      { entityId: borcId, person: item.kisiAdi, amount: miktar, date: tarih, totalPaid, totalAmount: item.miktar });    await createAutoBackup();
    return true;
  },

  async kategoriEkle(tip, ad) {
    if (!ad) return false;
    const norm = String(ad).trim();
    if (!norm) return false;
    if (state.kategoriler[tip].some(k => k.toLowerCase() === norm.toLowerCase())) return false;
    state.kategoriler[tip].push(norm);
    await saveKategoriler();
    await addLog('kategori_ekle', `${tip} · ${norm}`);
    return true;
  },

  async kategoriSil(tip, ad) {
    // Korumalı kategoriler — asla silinemez
    const KORUMALI = ['Araç Yakıt', 'Akaryakıt', 'Diğer'];
    if (KORUMALI.includes(ad)) {
      Swal.fire({ icon: 'info', title: 'Korumalı Kategori',
        text: `"${ad}" kategorisi silinemez (sistem kategorisi).`,
        timer: 2200, showConfirmButton: false });
      return;
    }

    const kullanim = (tip === 'gelir' ? state.gelirler : state.giderler)
      .filter(i => i.kategori === ad).length;

    const html = kullanim > 0
      ? `<strong>${UI.escHtml(ad)}</strong> kategorisinde <strong>${kullanim}</strong> işlem var.<br>
         Silerseniz bu işlemler "kategorisiz" görünecek.<br>Yine de silinsin mi?`
      : `<strong>${UI.escHtml(ad)}</strong> kategorisi silinecek. Onaylıyor musunuz?`;

    const r = await Swal.fire({
      icon: 'warning',
      title: 'Kategoriyi Sil',
      html,
      showCancelButton: true,
      confirmButtonText: 'Sil',
      cancelButtonText: 'İptal',
      confirmButtonColor: '#DC2626'
    });
    if (!r.isConfirmed) return;

    state.kategoriler[tip] = state.kategoriler[tip].filter(k => k !== ad);
    await saveKategoriler();
    await addLog('kategori_sil', `${tip} · ${ad}${kullanim > 0 ? ` (${kullanim} işlem etkilendi)` : ''}`);
    showToast(`🗑️ "${ad}" silindi`);
  },

  async limitEkle(kategori, limit) {
    if (!limit || isNaN(parseFloat(limit))) return;
    state.limitler[kategori] = parseFloat(limit);
    await saveLimitler();
  },

  async limitSil(kategori) {
    delete state.limitler[kategori];
    await saveLimitler();
    await addLog('limit_sil', kategori);
  },
  async manualArchive(monthKey) {
    if (!monthKey) monthKey = SalaryMonth.previousKey();

    if (state.archives[monthKey]) {
      Swal.fire({ icon: 'warning', title: 'Uyarı', text: `Bu dönem zaten arşivlenmiş!` });
      return false;
    }

    const range  = SalaryMonth.range(monthKey);
    const aGelir = state.gelirler.filter(g => g.tarih >= range.start && g.tarih <= range.end);
    const aGider = state.giderler.filter(g => g.tarih >= range.start && g.tarih <= range.end);

    if (!aGelir.length && !aGider.length) {
      Swal.fire({ icon: 'info', title: 'Bilgi', text: `Bu dönemde kayıt yok.` });
      return false;
    }

    const aLoglar = state.logs.filter(l => {
      const d = dayjs(l.timestamp).format('YYYY-MM-DD');
      return d >= range.start && d <= range.end;
    });

    state.archives[monthKey] = {
      gelirler: aGelir,
      giderler: aGider,
      loglar:   aLoglar,
      salaryMonthRange: range,
      year: SalaryMonth.yearOf(monthKey),
      archivedAt: new Date().toISOString(),
      schemaVersion: 3
    };

    try {
      await saveArchives();
    } catch (saveErr) {
      console.error('[manualArchive] Arşiv kaydı başarısız:', saveErr);
      Swal.fire({
        icon: 'error',
        title: 'Arşiv Kaydedilemedi',
        html: `<p>Bu dönem arşive yazılamadı.</p>
               <p style="font-size:12px;color:#94a3b8;margin-top:6px;">Veri kaybı yok. Sayfayı yenileyip tekrar deneyin.</p>`,
        confirmButtonText: 'Tamam'
      });
      return false;
    }

    state.gelirler = state.gelirler.filter(g => !(g.tarih >= range.start && g.tarih <= range.end));
    state.giderler = state.giderler.filter(g => !(g.tarih >= range.start && g.tarih <= range.end));
    state.logs     = state.logs.filter(l => {
      const d = dayjs(l.timestamp).format('YYYY-MM-DD');
      return !(d >= range.start && d <= range.end);
    });

    try {
      await saveGelirler();
      await saveGiderler();
      await saveLogs();
    } catch (listErr) {
      console.error('[manualArchive] Ana liste kaydı başarısız:', listErr);
    }

    /* 🆕 Arşiv PDF'i üret ve arşive kaydet — GLOBAL buildArchivePDF'i çağır */
    try {
      Swal.fire({
        title: '📄 Arşiv PDF oluşturuluyor...',
        html: 'Bu birkaç saniye sürebilir',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      // ⬇️ TEK DEĞİŞİKLİK — nested fonksiyon SİLİNDİ, global olan Promise.race ile çağrılıyor
      const timeoutP = new Promise(resolve => setTimeout(() => resolve(null), 15000));
      const pdfDataUrl = await Promise.race([
        buildArchivePDF(monthKey),
        timeoutP
      ]);

      Swal.close();

      if (pdfDataUrl) {
        state.archives[monthKey].pdfDataUrl = pdfDataUrl;
        state.archives[monthKey].pdfGeneratedAt = new Date().toISOString();
        await saveArchives();
      }
    } catch (errPdf) {
      Swal.close();
      console.warn('[manuel_archiv] PDF üretim hatası (devam ediliyor):', errPdf);
    }

    const arsivLogObj = {
      id: Date.now() + Math.random(),
      timestamp: new Date().toISOString(),
      action: 'manuel_arsiv',
      category: 'arsiv',
      severity: 'info',
      label: 'Ay Arşivlendi',
      details: `${SalaryMonth.label(monthKey)} · ${aGelir.length} gelir + ${aGider.length} gider + ${aLoglar.length} log`,
      meta: { month: monthKey, salaryMonth: true, range, year: SalaryMonth.yearOf(monthKey),
              gelirCount: aGelir.length, giderCount: aGider.length, logCount: aLoglar.length },
      page: 'arsiv'
    };

    state.logs.unshift(arsivLogObj);
    if (state.logs.length > 500) state.logs = state.logs.slice(0, 500);

    if (!state.archives[monthKey].loglar) state.archives[monthKey].loglar = [];
    state.archives[monthKey].loglar.push(arsivLogObj);

    await saveLogs();
    await saveArchives();

    await createAutoBackup();

    if (!this._batchMode) {
      Swal.fire({
        icon: 'success',
        title: '✅ Arşivlendi',
        html: `...`,
        timer: 3600,
        showConfirmButton: false
      });
    }
    return true;
  },

  getIslemDetay(id, tip) {
    if (tip === 'gelir')  return state.gelirler.find(i => i.id == id);
    if (tip === 'gider')  return state.giderler.find(i => i.id == id);
    return state.borcalacaklar.find(i => i.id == id);
  }
};

const Charts = {
  instances: {},
  palette: ['#2563EB','#059669','#D97706','#DC2626','#7C3AED','#0891B2','#EA580C','#DB2777'],

  destroy(key) {
    if (this.instances[key]) {
      try { this.instances[key].destroy(); } catch(e) {}
      delete this.instances[key];
    }
  },

  donut(canvasId, data) {
    this.destroy(canvasId);
    const el = document.getElementById(canvasId);
    if (!el || !Object.keys(data).length) return;
    this.instances[canvasId] = new Chart(el.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(data),
          datasets: [{
          data: Object.values(data),
          backgroundColor: Object.keys(data).map((_, i) => this.palette[i % this.palette.length]),
          borderWidth: 0,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '68%',
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 10, family: 'DM Sans' }, padding: 12, usePointStyle: true, pointStyleWidth: 8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${Calc.fmt(ctx.raw)}` } }
        }
      }
    });
  },

  bar(canvasId, data) {
    this.destroy(canvasId);
    const el = document.getElementById(canvasId);
    if (!el) return;
    this.instances[canvasId] = new Chart(el.getContext('2d'), {
      type: 'bar',
      data: {

        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 10, family: 'DM Sans' }, usePointStyle: true } },

        scales: {
          y: { ticks: { callback: v => PARA + ' ' + v.toLocaleString('tr-TR'), font: { size: 10 } }, grid: { color: 'rgba(148,163,184,.12)' } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        }
      }
    });
  },

  /* 🆕 FAZ 2 — Waterfall (Cash Flow) */
  waterfall(canvasId, steps) {
    this.destroy(canvasId);
    const el = document.getElementById(canvasId);
    if (!el) return;

    const labels = steps.map(s => s.label);
    const data = steps.map(s => [s.start, s.end]);
    const colors = steps.map(s => {
      if (s.type === 'increase') return 'rgba(5,150,105,.85)';
      if (s.type === 'decrease') return 'rgba(220,38,38,.85)';
      if (s.type === 'result')   return s.display >= 0 ? 'rgba(37,99,235,.85)' : 'rgba(220,38,38,.85)';
      return 'rgba(148,163,184,.4)';
    });

    this.instances[canvasId] = new Chart(el.getContext('2d'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data,
          backgroundColor: colors,
          borderRadius: 6,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const s = steps[ctx.dataIndex];

        scales: {
          y: {
            ticks: { callback: v => v >= 1000 ? (v/1000).toFixed(0) + 'k TL' : 'TL ' + v, font: { size: 10 } },

          x: { ticks: { font: { size: 10 } }, grid: { display: false } }

      }

      options: {

/* ─────────────────────────────────────────────
   UI HELPERS
───────────────────────────────────────────── */
const UI = {
  empty(msg = 'Henüz kayıt yok') {
    return `<div class="empty-state"><i class="fas fa-inbox"></i><p>${msg}</p></div>`;
  },

  escHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  },

  jsEscape(str) {
    if (str == null) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '\\r');
  },

  txItem(item, clickCb) {
    const isGelir   = item._tip === 'gelir';
    const isGider   = item._tip === 'gider';
    const isAlacak  = item._tip === 'alacak';
    const isBorc    = item._tip === 'borc';
    const isTx      = isGelir || isGider;

    let iconCls, iconFa, amtCls, prefix, label;
    if (isGelir)       { iconCls='gelir';  iconFa='fa-arrow-up';            amtCls='pos';   prefix='+'; label=item.kategori; }
    else if (isGider)  { iconCls='gider';  iconFa='fa-arrow-down';          amtCls='neg';   prefix='-'; label=item.kategori; }
    else if (isAlacak) { iconCls='alacak'; iconFa='fa-hand-holding-dollar'; amtCls='pos';   prefix=''; label=item.kisiAdi; }
    else               { iconCls='borc';   iconFa='fa-hand-holding-usd';    amtCls='amber'; prefix=''; label=item.kisiAdi; }

    const date = item.tarih ? dayjs(item.tarih).format('DD MMM') : '';
    const desc = item.aciklama ? ' · ' + this.escHtml(item.aciklama.substring(0, 22)) : '';
    const click = clickCb ? ` onclick="${clickCb}"` : '';

    return `<div class="tx-item${clickCb ? ' tx-item-clickable' : ''}" data-id="${item.id}"${click}>
            ${(isAlacak || isBorc)
        ? `<div class="tx-icon ${iconCls}"><i class="fas ${iconFa}"></i></div>`
        : (() => {
            const meta = kategoriMeta(isGelir ? 'gelir' : 'gider', label);
            return `<div class="tx-icon" style="background:${meta.bg};color:${meta.color};"><i class="fas ${meta.icon}"></i></div>`;
          })()
      }
      <div class="tx-info">
        <div class="tx-title">${this.escHtml(label)}</div>
        <div class="tx-date">${date}${desc}</div>
      </div>
      <div class="tx-amount ${amtCls}">${prefix}${(() => {
        if ((isAlacak || isBorc) && item.birim && item.birim !== 'tl') {
          const m = Number(item.miktar) || 0;
          const fiyat = Calc.birimFiyat(item.birim);
          return `${m.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${Calc.birimKisa(item.birim)}<div style="font-size:9.5px;color:var(--text3);font-weight:500;">≈ ${Calc.fmt(m*fiyat)}</div>`;
        }
        return Calc.fmt(item.miktar);
      })()}</div>
    </div>`;
  },

  paginate(items, page, perPage = 8) {
    const total = Math.max(1, Math.ceil(items.length / perPage));
    const pg    = Math.min(Math.max(1, page), total);
    return { items: items.slice((pg-1)*perPage, pg*perPage), page: pg, total, hasNext: pg<total, hasPrev: pg>1 };
  },

  tipBadge(t) {
    const map = { gelir:'badge-success GELİR', gider:'badge-danger GİDER', alacak:'badge-success ALACAK', borc:'badge-amber BORÇ' };
    const v = (map[t] || 'badge-blue BİLİNMEYEN').split(' ');
    return `<span class="badge ${v[0]}">${v[1]}</span>`;
  },

  updatePagination(pgInfo, prevBtn, nextBtn, page, total, hasPrev, hasNext) {
    if (pgInfo)  pgInfo.textContent  = `${page} / ${total}`;
    if (prevBtn) prevBtn.disabled    = !hasPrev;
    if (nextBtn) nextBtn.disabled    = !hasNext;
  },

  updateChips(container, activeValue) {
    if (!container) return;
    container.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', c.dataset.val === activeValue);
    });
  },

  /* 🆕 Log satırı HTML üretici — canlı modal + arşiv ortak */
  logItem(l, onclick) {
    const def = LOG_ACTIONS[l.action] || { cat:'diger', sev:'info', icon:'fa-info-circle', label: l.action };
    const cat = LOG_META[def.cat] || LOG_META.diger;
    const label = l.label || def.label;
    const clickAttr = onclick ? ` onclick="${onclick}"` : '';
    return `<div class="log-item"${clickAttr} style="border-left:3px solid ${cat.color};${onclick ? 'cursor:pointer;' : ''}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <i class="fas ${def.icon}" style="color:${cat.color};font-size:12px;"></i>
        <span class="log-action" style="margin-bottom:0;">${this.escHtml(label)}</span>
        <span class="badge" style="background:${cat.bg};color:${cat.color};font-size:9px;padding:2px 6px;margin-left:auto;">${cat.label}</span>
      </div>
      ${l.details ? `<div class="log-details" style="margin-left:20px;">${this.escHtml(l.details)}</div>` : ''}
      <div class="log-time" style="margin-left:20px;"><i class="fas fa-clock"></i> ${dayjs(l.timestamp).format('DD MMM YYYY HH:mm:ss')}</div>
    </div>`;

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.setAttribute('aria-live', 'polite');
  t.textContent = msg;
  document.body.appendChild(t);
  t.addEventListener('animationend', () => t.remove());
}

const Notifications = {
  async add(data) {
    const notification = {
      id: Date.now() + Math.random(),
      createdAt: new Date().toISOString(),
      read: false,
      readAt: null,
      type: data.type || 'info',
      title: data.title || 'Bildirim',
      description: data.description || '',
      details: data.details || '',
      priority: data.priority || 'normal',
      source: data.source || null,
      sourceId: data.sourceId || null,
      dedupKey: data.dedupKey || null,
      action: data.action || null
    };

    /* 🔁 DEDUP: aynı dedupKey varsa güncelle */
    if (notification.dedupKey) {
      const existing = state.notifications.find(n =>
        n.dedupKey === notification.dedupKey
      );
      if (existing) {
        /* 🛡️ Sadece içerik değiştiyse güncelle + okunmamış yap.
           Aksi halde kullanıcı her modal açtığında okundu bildirimleri
           tekrar okunmamış olarak görürdü. */
        const contentChanged =
          existing.description !== notification.description ||
          existing.details !== notification.details ||
          existing.priority !== notification.priority;

        if (contentChanged) {
          existing.title = notification.title;
          existing.description = notification.description;
          existing.details = notification.details;
          existing.priority = notification.priority;
          existing.action = notification.action;
          existing.updatedAt = new Date().toISOString();
          existing.read = false;
          existing.readAt = null;
          await saveNotifications();
          Notifications.updateBadge();
        }
        return existing;
      }
    }

    state.notifications.unshift(notification);
    if (state.notifications.length > 200) {
      state.notifications = state.notifications.slice(0, 200);
    }
    await saveNotifications();
    Notifications.updateBadge();
    return notification;
  },

  async markRead(id) {
    const n = state.notifications.find(x => x.id == id);
    if (n && !n.read) {
      n.read = true;
      n.readAt = new Date().toISOString();
      await saveNotifications();
      Notifications.updateBadge();
    }
  },

  async markAllRead() {
    let changed = false;
    state.notifications.forEach(n => {
      if (!n.read) { n.read = true; n.readAt = new Date().toISOString(); changed = true; }
    });
    if (changed) {
      await saveNotifications();
      Notifications.updateBadge();
    }
    return changed;
  },

  async remove(id) {
    state.notifications = state.notifications.filter(n => n.id != id);
    await saveNotifications();
    Notifications.updateBadge();
  },

  async clearRead() {
    state.notifications = state.notifications.filter(n => !n.read);
    await saveNotifications();
    Notifications.updateBadge();
  },

  getUnreadCount() {
    return state.notifications.filter(n => !n.read).length;
  },

  updateBadge() {
    const btn = document.getElementById('notifBtn');
    if (!btn) return;
    let badge = btn.querySelector('.notif-badge');
    const count = Notifications.getUnreadCount();

    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'notif-badge';
      btn.appendChild(badge);
    }

    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.style.display = 'flex';
      btn.classList.add('has-notif');
    } else {
      badge.style.display = 'none';
      btn.classList.remove('has-notif');
    }
  },

            title: `${r.label} · ${r.plaka}`,

            priority: priority,

    /* 2️⃣ ARAÇ KM / YAĞ BAKIM UYARILARI */

            details: `**${k.plaka}** aracınız **${k.currentKm.toLocaleString('tr-TR')} km**'de.\n` +

              `• Son bakım: ${k.sonBakimKm.toLocaleString('tr-TR')} km\n` +

              `• Durum: ${durumText}\n\n` +

    try {

      for (const b of vadeler) {

            `**Vade tarihi:** ${dayjs(b.vadeTarihi).format('DD MMMM YYYY')}\n` +
            `**Miktar:** ${Calc.formatBirim(b)}\n` +
            `**Durum:** ${durumText}\n\n` +
            `**Ne yapmalısınız?**\n` +
            `• Karşı tarafla iletişime geçin\n` +
            `• Ödeme yapıldıysa "Borç/Alacak" sayfasından "Ara Ödeme" ekleyin\n` +
            `• Tamamen ödendiyse "Tam Ödendi" butonuyla kapatın`,
            priority: priority,
            source: 'debt',
            sourceId: b.id,
            dedupKey: `debt_${b.id}`,
            action: { type: 'goto', target: 'borcalacak' }
          });
        }
    } catch (e) { console.warn('[Notif] debt:', e); }

    /* 5️⃣ ARŞİV GECİKMESİ */
    try {
      if (SalaryMonth.isOverdue()) {

        await Notifications.add({
          type: 'archive',
          title: 'Arşiv Gecikmiş',

            `**Ne yapmalısınız?**\n` +
            `• Arşiv sayfasına gidin\n` +
            `• "${SalaryMonth.shortLabel(prevKey)} Dönemini Arşivle" butonuna tıklayın\n` +
            `• PDF raporu otomatik oluşturulur`,
          priority: 'normal',
          source: 'archive',
          sourceId: prevKey,
          dedupKey: `archive_${prevKey}`,
          action: { type: 'goto', target: 'arsiv' }
        });
      }
    } catch (e) { console.warn('[Notif] archive:', e); }
  }

    _calculateMonthlyInsight() {
    const curKey  = SalaryMonth.currentKey();
    const prevKey = SalaryMonth.previousKey();
    const curR    = SalaryMonth.range(curKey);
    const prevR   = SalaryMonth.range(prevKey);

    // ─── En çok artan kategori ───
    const buKats   = Calc._kategoriGiderlerTum({ start: curR.start,  end: curR.end });
    const prevKats = Calc._kategoriGiderlerTum({ start: prevR.start, end: prevR.end });

    let topIncrease = null;
    Object.entries(buKats).forEach(([kat, bu]) => {
      const prev = prevKats[kat] || 0;
      if (prev >= 100 && bu > prev) {
        const pct = ((bu - prev) / prev) * 100;
        if (!topIncrease || pct > topIncrease.pct) {
          topIncrease = { kat, bu, prev, pct };
        }
      }
    });

    // ─── Ay sonu gider tahmini ───
    const today   = dayjs().startOf('day');
    const startD  = dayjs(curR.start).startOf('day');
    const endD    = dayjs(curR.end).startOf('day');

    let forecast = null;
    if (!today.isBefore(startD) && !today.isAfter(endD)) {
      const daysPassed = today.diff(startD, 'day') + 1;
      const totalDays  = endD.diff(startD, 'day') + 1;
      const daysLeft   = Math.max(0, totalDays - daysPassed);
      const currentGider = Calc.toplamGider({
        start: curR.start,
        end:   today.format('YYYY-MM-DD')
      });
      const dailyAvg       = currentGider / Math.max(1, daysPassed);
      const projectedGider = dailyAvg * totalDays;
      const progressPct    = Math.min(100, Math.round((daysPassed / totalDays) * 100));

      forecast = { currentGider, projectedGider, dailyAvg, daysLeft, progressPct };
    }

    if (!topIncrease && !forecast) return null;
    return { topIncrease, forecast };
  },

  
  async renderDashboard() {
    const ayF    = Calc.ayFilter();
    const curKey = SalaryMonth.currentKey();

    const bakiye = Calc._toplamGelirTum() - Calc._toplamGiderTum();   // ✅ arşiv dahil
    const gelirT = Calc._toplamGelirTum();                              // ✅ arşiv dahil

  /* 🆕 KATEGORİ AYLIK ÖZET GÖSTER */
_updateKategoriAylikOzet() {
  const el = document.getElementById('kategoriAylikOzet');
  if (!el) return;

  const sel = document.getElementById('islemKategori');
  const tip = document.getElementById('islemTipHidden')?.value || this._islemTip;
  const kategori = sel?.value;

  /* Akaryakıt / Araç Yakıt için gösterme (kendi paneli var) */
  const isFuelKat = kategori === 'Araç Yakıt' || kategori === 'Akaryakıt';
  if (!kategori || tip !== 'gider' || isFuelKat) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }

  const toplam = Calc.aylikGiderKategori(kategori);
  const limit  = state.limitler[kategori];
  const asim   = limit && toplam > limit;

    <div style="display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--text3);margin-top:6px;">

      <div class="progress-bar" style="width:${yuzde}%;background:${asim ? 'var(--danger)' : 'var(--warning)'};"></div>

  el.innerHTML = `
    <div style="padding:10px 12px;background:${asim ? 'var(--danger-light)' : 'var(--primary-light)'};

},

  _setFuelTip(tip) {
    this._fuelTipCurrent = tip;

    document.querySelectorAll('#fuelTypeChips .fuel-chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tip === tip);
    });

    const benzinSection = document.getElementById('fuelBenzinSection');
    const lpgSection    = document.getElementById('fuelLpgSection');

    if (benzinSection) benzinSection.style.display = (tip === 'benzin' || tip === 'her-ikisi') ? '' : 'none';
    if (lpgSection)    lpgSection.style.display    = (tip === 'lpg'    || tip === 'her-ikisi') ? '' : 'none';

    this._updateFuelPreview();
  },

  _editKategoriChange() {
    const kat = document.getElementById('eKat')?.value;
    const fields = document.getElementById('eFuelFields');
    if (fields) fields.style.display = (kat === 'Araç Yakıt' || kat === 'Akaryakıt') ? 'block' : 'none';
  },

  _findPrevFuelRecord(excludeId, beforeDate) {
    const all = Calc._allGiderler()
      .filter(g => {
        const k = (g.kategori || '').toLowerCase();
        return (k === 'araç yakıt' || k === 'akaryakıt') && g.fuel && Number(g.fuel.km) > 0;
      })
      .filter(g => !excludeId || g.id !== excludeId)
      .sort((a, b) => {
        if (a.tarih !== b.tarih) return a.tarih.localeCompare(b.tarih);
        return (a.createdAt || '').localeCompare(b.createdAt || '');
      });

    if (!beforeDate) return all[all.length - 1] || null;
    const eligible = all.filter(g => g.tarih <= beforeDate);
    return eligible[eligible.length - 1] || null;
  },
    /* ✅ Yeni: Belirli yakıt tipine göre önceki KM */
  _findPrevFuelRecordSameType(excludeId, beforeDate, fuelType) {
    const all = Calc._allGiderler()
      .filter(g => {
        const k = (g.kategori || '').toLowerCase();
        return (k === 'araç yakıt' || k === 'akaryakıt') && g.fuel && Number(g.fuel.km) > 0;
      })
      .filter(g => {
        if (excludeId && g.id === excludeId) return false;
        const t = g.fuel.tip || 'benzin';
        if (fuelType === 'lpg')     return t === 'lpg'    || t === 'her-ikisi';
        if (fuelType === 'benzin')  return t === 'benzin' || t === 'her-ikisi';
        return true;
      })
      .sort((a, b) => {
        if (a.tarih !== b.tarih) return a.tarih.localeCompare(b.tarih);
        return (a.createdAt || '').localeCompare(b.createdAt || '');
      });

    if (!beforeDate) return all[all.length - 1] || null;
    const eligible = all.filter(g => g.tarih <= beforeDate);
    return eligible[eligible.length - 1] || null;
  },

  /* 🆕 Son akaryakıt KM'sini placeholder'a yaz */
  _updateFuelKmPlaceholder() {
    const kmEl = document.getElementById('fuelKm');
    if (!kmEl) return;
    const last = this._findPrevFuelRecord(null, null);
    const lastKm = Number(last?.fuel?.km) || 0;
    if (lastKm > 0) {
      kmEl.placeholder = `Son KM: ${lastKm.toLocaleString('tr-TR')} km`;
    } else {
      kmEl.placeholder = 'İlk kayıt — mevcut km girin';
    }
  },

  _updateFuelPreview() {
    const tip = this._fuelTipCurrent || 'benzin';

    const kmVal      = parseFloat(document.getElementById('fuelKm')?.value);
    const bLitreVal  = parseFloat(document.getElementById('fuelBenzinLitre')?.value);
    const bFiyatVal  = parseFloat(document.getElementById('fuelBenzinFiyat')?.value);
    const lLitreVal  = parseFloat(document.getElementById('fuelLpgLitre')?.value);
    const lFiyatVal  = parseFloat(document.getElementById('fuelLpgFiyat')?.value);
    const tarih      = document.getElementById('islemTarih')?.value || dayjs().format('YYYY-MM-DD');

    const bTL = (tip === 'benzin' || tip === 'her-ikisi') ? ((bLitreVal || 0) * (bFiyatVal || 0)) : 0;
    const lTL = (tip === 'lpg'    || tip === 'her-ikisi') ? ((lLitreVal || 0) * (lFiyatVal || 0)) : 0;
    const grandTotal = bTL + lTL;

    const btlEl = document.getElementById('fuelBenzinTL');
    const ltlEl = document.getElementById('fuelLpgTL');
    const gtEl  = document.getElementById('fuelGrandTotal');
    if (btlEl) btlEl.textContent = 'TL ' + bTL.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (ltlEl) ltlEl.textContent = 'TL ' + lTL.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (gtEl)  gtEl.textContent  = 'TL ' + grandTotal.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const preview = document.getElementById('fuelPreview');
    if (!preview) return;
    if (!kmVal || kmVal <= 0) { preview.classList.remove('visible'); preview.innerHTML = ''; return; }

    const parts = [];

    /* ✅ Her yakıt için KENDİ tipinden önceki km ile tüketim */
    if ((tip === 'benzin' || tip === 'her-ikisi') && bLitreVal > 0) {
      const prevB = this._findPrevFuelRecordSameType(null, tarih, 'benzin');
      const prevBKm = prevB?.fuel?.km;
      if (prevBKm && kmVal > prevBKm) {
        const mesafe = kmVal - prevBKm;
        parts.push(`<div class="fuel-preview-row"><span>⛽ Benzin (${prevBKm.toLocaleString('tr-TR')} → ${kmVal.toLocaleString('tr-TR')} km)</span><strong>${((bLitreVal * 100) / mesafe).toFixed(2)} L/100km</strong></div>`);
      } else if (prevBKm) {
        parts.push(`<div class="fuel-hint">⚠️ Benzin KM (${prevBKm.toLocaleString('tr-TR')}) ≥ girilen KM. Benzin tüketim hesabı yapılmadı.</div>`);
      } else {
        parts.push(`<div class="fuel-hint">ℹ️ İlk benzin dolumu — sonraki benzin dolumunda tüketim başlar.</div>`);
      }
    }

    if ((tip === 'lpg' || tip === 'her-ikisi') && lLitreVal > 0) {
      const prevL = this._findPrevFuelRecordSameType(null, tarih, 'lpg');
      const prevLKm = prevL?.fuel?.km;
      if (prevLKm && kmVal > prevLKm) {
        const mesafe = kmVal - prevLKm;
        parts.push(`<div class="fuel-preview-row"><span>💧 LPG (${prevLKm.toLocaleString('tr-TR')} → ${kmVal.toLocaleString('tr-TR')} km)</span><strong>${((lLitreVal * 100) / mesafe).toFixed(2)} L/100km</strong></div>`);
      } else if (prevLKm) {
        parts.push(`<div class="fuel-hint">⚠️ LPG KM (${prevLKm.toLocaleString('tr-TR')}) ≥ girilen KM. LPG tüketim hesabı yapılmadı.</div>`);
      } else {
        parts.push(`<div class="fuel-hint">ℹ️ İlk LPG dolumu — sonraki LPG dolumunda tüketim başlar.</div>`);
      }
    }

    preview.innerHTML = parts.join('');
    preview.classList.add('visible');
  },
  setRecentTab(t) { this._recentTab = t; this._recentPage = 1; UI.updateChips(document.getElementById('recentTabs'), t); this.renderRecentList(); },
  prevRecentPage() { if (this._recentPage > 1) { this._recentPage--; this.renderRecentList(); } },
  nextRecentPage() { this._recentPage++; this.renderRecentList(); },

  async renderRecentList() {
    let all = Calc.sonIslemler();
    if (this._recentTab === 'gelir') all = all.filter(i => i._tip === 'gelir');
    else if (this._recentTab === 'gider') all = all.filter(i => i._tip === 'gider');

    const { items, page, total, hasPrev, hasNext } = UI.paginate(all, this._recentPage, 6);

    if (el) el.innerHTML = items.length ? items.map(i => UI.txItem(i, `App.showTransactionDetail(${i.id},'${i._tip}')`)).join('') : UI.empty();

    UI.updatePagination(
      document.getElementById('pgInfo'), document.getElementById('prevPg'), document.getElementById('nextPg'),
      page, total, hasPrev, hasNext
    );
  },

  async submitIslem() {
    const kategori = document.getElementById('islemKategori')?.value;
    const tarih    = document.getElementById('islemTarih')?.value;
    const aciklama = document.getElementById('islemAciklama')?.value || '';
    const tip      = document.getElementById('islemTipHidden')?.value || this._islemTip;
    const isFuel = tip === 'gider' && (kategori === 'Araç Yakıt' || kategori === 'Akaryakıt');
    
    if (!tarih) { Swal.fire({ icon: 'warning', title: 'Tarih Gerekli!', timer: 1800, showConfirmButton: false }); return; }

    let miktar, extra = {};

    if (isFuel) {
      const fuelTip   = this._fuelTipCurrent || 'benzin';
      const kmVal     = parseFloat(document.getElementById('fuelKm')?.value);
      const bLitre    = parseFloat(document.getElementById('fuelBenzinLitre')?.value) || 0;
      const bFiyat    = parseFloat(document.getElementById('fuelBenzinFiyat')?.value) || 0;
      const lLitre    = parseFloat(document.getElementById('fuelLpgLitre')?.value) || 0;
      const lFiyat    = parseFloat(document.getElementById('fuelLpgFiyat')?.value) || 0;

      if (!kmVal || kmVal <= 0) { Swal.fire({ icon: 'warning', title: 'KM zorunlu!', text: 'Akaryakıt kaydı için güncel KM girin.', timer: 2000, showConfirmButton: false }); return; }
            /* 🛡️ KM DOĞRULAMA: Yeni KM, aynı tarihten önceki en son kayıttan KÜÇÜK olamaz */
      const prevFuelRecord = this._findPrevFuelRecord(null, tarih);
      if (prevFuelRecord && Number(prevFuelRecord.fuel?.km) > 0) {
        const prevKm = Number(prevFuelRecord.fuel.km);
        if (kmVal <= prevKm) {
          Swal.fire({
            icon: 'error',
            title: '⚠️ KM Mantık Hatası',
            html: `<div style="text-align:left;font-size:13px;line-height:1.6;">
              <p>Girdiğiniz KM: <strong style="color:var(--danger);font-size:15px;">${kmVal.toLocaleString('tr-TR')} km</strong></p>
              <p>Önceki kayıt: <strong>${prevKm.toLocaleString('tr-TR')} km</strong> (${dayjs(prevFuelRecord.tarih).format('DD MMM YYYY')})</p>
              <hr style="margin:10px 0;border:none;border-top:1px solid var(--border);">
              <p style="color:var(--text3);">Araç KM sayacı sadece <strong>artabilir</strong>, azalamaz. Lütfen doğru KM girin.</p>
            </div>`,
            confirmButtonText: 'Anladım',
            width: Math.min(420, window.innerWidth - 24)
          });
          return;
        }
      }

      const benzinTL = (fuelTip === 'benzin' || fuelTip === 'her-ikisi') ? bLitre * bFiyat : 0;
      const lpgTL    = (fuelTip === 'lpg'    || fuelTip === 'her-ikisi') ? lLitre * lFiyat : 0;
      miktar = benzinTL + lpgTL;

      if (miktar <= 0) { Swal.fire({ icon: 'warning', title: 'Tutar 0!', text: 'En az bir yakıt için litre ve fiyat girin.', timer: 2000, showConfirmButton: false }); return; }

      const prevAll = this._findPrevFuelRecord(null, tarih);
      const prevKmAll = prevAll?.fuel?.km;
      const mesafeAll = (prevKmAll && kmVal > prevKmAll) ? (kmVal - prevKmAll) : null;

      const fuel = {
        km: kmVal,
        mesafe: mesafeAll,
        oncekiKm: prevKmAll || null,
        tip: fuelTip,
        toplamTL: miktar,
        toplamLitre: 0,
        tlPerKm: null
      };

      /* ✅ Her yakıt için KENDİ tipinden önceki KM */
      if (fuelTip === 'benzin' || fuelTip === 'her-ikisi') {
        const prevB = this._findPrevFuelRecordSameType(null, tarih, 'benzin');
        const prevBKm = prevB?.fuel?.km;
        const bMesafe = (prevBKm && kmVal > prevBKm) ? (kmVal - prevBKm) : null;
        fuel.benzin = {
          litre: bLitre,
          birimFiyat: bFiyat,
          toplam: benzinTL,
          oncekiKm: prevBKm || null,
          mesafe: bMesafe,
          l100km: (bMesafe && bLitre) ? ((bLitre * 100) / bMesafe) : null
        };
        fuel.toplamLitre += bLitre;
      }
      if (fuelTip === 'lpg' || fuelTip === 'her-ikisi') {
        const prevL = this._findPrevFuelRecordSameType(null, tarih, 'lpg');
        const prevLKm = prevL?.fuel?.km;
        const lMesafe = (prevLKm && kmVal > prevLKm) ? (kmVal - prevLKm) : null;
        fuel.lpg = {
          litre: lLitre,
          birimFiyat: lFiyat,
          toplam: lpgTL,
          oncekiKm: prevLKm || null,
          mesafe: lMesafe,
          l100km: (lMesafe && lLitre) ? ((lLitre * 100) / lMesafe) : null
        };
        fuel.toplamLitre += lLitre;
      }

            // tlPerKm sadece TEK yakıt tipinde anlamlı
      if (fuelTip === 'lpg' && fuel.lpg?.mesafe && lpgTL > 0) {
        fuel.tlPerKm = lpgTL / fuel.lpg.mesafe;
      } else if (fuelTip === 'benzin' && fuel.benzin?.mesafe && benzinTL > 0) {
        fuel.tlPerKm = benzinTL / fuel.benzin.mesafe;
      }
      fuel.litre = fuel.toplamLitre;
      fuel.birimFiyat = fuel.toplamLitre > 0 ? miktar / fuel.toplamLitre : 0;
      fuel.lPer100km = mesafeAll && fuel.toplamLitre ? ((fuel.toplamLitre * 100) / mesafeAll) : null;

      extra.fuel = fuel;
    } else {
      miktar = parseFloat(document.getElementById('islemMiktar')?.value);
      if (!miktar || miktar <= 0) { Swal.fire({ icon: 'warning', title: 'Geçersiz Miktar!', text: 'Lütfen 0\'dan büyük bir miktar girin.', timer: 2000, showConfirmButton: false }); return; }
    }

        try {
      await CRUD.islemEkle(tip, miktar, kategori, tarih, aciklama, extra);
    } catch (err) {
      console.error('[submitIslem]', err);
      Swal.fire({ icon: 'error', title: 'Kayıt Başarısız',
        text: 'Veri yazılamadı. Sayfayı yenileyip tekrar deneyin.' });
      return;
    }

    /* Formu temizle */

    /* Formu temizle */
    ['islemMiktar','islemAciklama','fuelKm','fuelBenzinLitre','fuelBenzinFiyat','fuelLpgLitre','fuelLpgFiyat'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    const tarihEl = document.getElementById('islemTarih');
    if (tarihEl) tarihEl.value = dayjs().format('YYYY-MM-DD');
    const fp = document.getElementById('fuelPreview');
    if (fp) { fp.innerHTML = ''; fp.classList.remove('visible'); }
    const btlEl = document.getElementById('fuelBenzinTL'); if (btlEl) btlEl.textContent = 'TL 0,00';
    const ltlEl = document.getElementById('fuelLpgTL');    if (ltlEl) ltlEl.textContent = 'TL 0,00';
    const gtEl  = document.getElementById('fuelGrandTotal'); if (gtEl) gtEl.textContent = 'TL 0,00';

    const label = isFuel ? '⛽ Akaryakıt' : (tip === 'gelir' ? '✅ Gelir' : '💸 Gider');
    showToast(`${label} kaydedildi: ${Calc.fmt(miktar)}`);
    await this.renderIslemList();
    if (this.currentPage === 'dashboard') await this.renderRecentList();
    this._updateKategoriAylikOzet();
    this._updateFuelKmPlaceholder();
  },


  async editIslem(id, tip) {
    const item = (tip === 'gelir' ? state.gelirler : state.giderler).find(i => i.id == id);
    if (!item) return;

    const isFuel = (item.kategori === 'Araç Yakıt' || item.kategori === 'Akaryakıt') && item.fuel;
    const fuelTip = item.fuel?.tip || 'benzin';
    const fuelBenzinLitre = item.fuel?.benzin?.litre || (fuelTip === 'benzin' ? item.fuel?.litre : '') || '';
    const fuelBenzinFiyat = item.fuel?.benzin?.birimFiyat || (fuelTip === 'benzin' ? item.fuel?.birimFiyat : '') || '';
    const fuelLpgLitre    = item.fuel?.lpg?.litre || (fuelTip === 'lpg' ? item.fuel?.litre : '') || '';
    const fuelLpgFiyat    = item.fuel?.lpg?.birimFiyat || (fuelTip === 'lpg' ? item.fuel?.birimFiyat : '') || '';

    const katsHtml = state.kategoriler[tip].map(k => `<option${k === item.kategori ? ' selected' : ''}>${UI.escHtml(k)}</option>`).join('');

    const fuelFieldsHtml = `
      <div id="eFuelFields" style="margin-top:10px;padding:12px;background:#FEF3C7;border-radius:8px;display:${isFuel ? 'block' : 'none'};">
        <div style="font-size:11px;font-weight:700;color:#92400E;margin-bottom:8px;">⛽ Akaryakıt Detayları</div>

        <label style="font-size:11px;color:#78350F;font-weight:600;">Yakıt Tipi</label>
        <select id="eFuelTip" class="swal2-select" style="margin:4px 0 10px 0;width:100%;">
          <option value="benzin" ${fuelTip === 'benzin' ? 'selected' : ''}>Sadece Benzin</option>
          <option value="lpg" ${fuelTip === 'lpg' ? 'selected' : ''}>Sadece LPG</option>
          <option value="her-ikisi" ${fuelTip === 'her-ikisi' ? 'selected' : ''}>Benzin + LPG</option>
        </select>

        <label style="font-size:11px;color:#78350F;font-weight:600;">Güncel KM</label>
        <input type="number" id="eFuelKm" value="${item.fuel?.km || ''}" class="swal2-input" style="margin:4px 0 10px 0;width:100%;">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <div>
            <label style="font-size:11px;color:#78350F;font-weight:600;">Benzin Litre</label>
            <input type="number" id="eFuelBenzinLitre" step="0.01" value="${fuelBenzinLitre}" class="swal2-input" style="margin:2px 0;width:100%;">
          </div>
          <div>
            <label style="font-size:11px;color:#78350F;font-weight:600;">Benzin TL/L</label>
            <input type="number" id="eFuelBenzinFiyat" step="0.01" value="${fuelBenzinFiyat}" class="swal2-input" style="margin:2px 0;width:100%;">
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;">
          <div>
            <label style="font-size:11px;color:#78350F;font-weight:600;">LPG Litre</label>
            <input type="number" id="eFuelLpgLitre" step="0.01" value="${fuelLpgLitre}" class="swal2-input" style="margin:2px 0;width:100%;">
          </div>
          <div>
            <label style="font-size:11px;color:#78350F;font-weight:600;">LPG TL/L</label>
            <input type="number" id="eFuelLpgFiyat" step="0.01" value="${fuelLpgFiyat}" class="swal2-input" style="margin:2px 0;width:100%;">
          </div>
        </div>
      </div>`;

    const { value } = await Swal.fire({
      title: tip === 'gelir' ? '✏️ Geliri Düzenle' : '✏️ Gideri Düzenle',
      html: `<div style="text-align:left;">
        <label style="font-size:12px;font-weight:600;color:#475569;">Miktar (${PARA})</label>
        <input type="number" id="eMiktar" value="${item.miktar}" step="0.01" class="swal2-input" ${isFuel ? 'disabled' : ''}>
        <label style="font-size:12px;font-weight:600;color:#475569;">Kategori</label>
        <select id="eKat" class="swal2-select" onchange="App._editKategoriChange()">${katsHtml}</select>
        ${fuelFieldsHtml}
        <label style="font-size:12px;font-weight:600;color:#475569;">Tarih</label>
        <input type="date" id="eTarih" value="${item.tarih}" class="swal2-input">
        <label style="font-size:12px;font-weight:600;color:#475569;">Açıklama</label>
        <textarea id="eAciklama" class="swal2-textarea" style="height:64px;">${UI.escHtml(item.aciklama || '')}</textarea>
      </div>`,
      confirmButtonText: 'Güncelle',
      showCancelButton: true,
      cancelButtonText: 'İptal',
      width: Math.min(520, window.innerWidth - 24),
      preConfirm: () => {
        const data = {
          kategori: document.getElementById('eKat').value,
          tarih:    document.getElementById('eTarih').value,
          aciklama: document.getElementById('eAciklama').value
        };

        if (data.kategori === 'Araç Yakıt' || data.kategori === 'Akaryakıt') {
          const fuelTip   = document.getElementById('eFuelTip')?.value || 'benzin';
          const kmVal     = parseFloat(document.getElementById('eFuelKm')?.value);
                    /* 🛡️ KM DOĞRULAMA (düzenleme) — kendini hariç tut */
          if (kmVal > 0) {
            const prevRec = App._findPrevFuelRecord(id, data.tarih);
            if (prevRec && Number(prevRec.fuel?.km) > 0 && kmVal <= Number(prevRec.fuel.km)) {
              Swal.showValidationMessage(
                `⚠️ KM ${kmVal.toLocaleString('tr-TR')} km, önceki kayıttan (${Number(prevRec.fuel.km).toLocaleString('tr-TR')} km) küçük olamaz`
              );
              return false;
            }
          }
          const bLitre    = parseFloat(document.getElementById('eFuelBenzinLitre')?.value) || 0;
          const bFiyat    = parseFloat(document.getElementById('eFuelBenzinFiyat')?.value) || 0;
          const lLitre    = parseFloat(document.getElementById('eFuelLpgLitre')?.value) || 0;
          const lFiyat    = parseFloat(document.getElementById('eFuelLpgFiyat')?.value) || 0;

          const benzinTL = (fuelTip === 'benzin' || fuelTip === 'her-ikisi') ? bLitre * bFiyat : 0;
          const lpgTL    = (fuelTip === 'lpg'    || fuelTip === 'her-ikisi') ? lLitre * lFiyat : 0;
          data.miktar = benzinTL + lpgTL;

          if (kmVal && kmVal > 0) {
            const prevAll = App._findPrevFuelRecord(id, data.tarih);
            const prevKmAll = prevAll?.fuel?.km;
            const mesafeAll = (prevKmAll && kmVal > prevKmAll) ? (kmVal - prevKmAll) : null;

            const fuel = {
              km: kmVal, mesafe: mesafeAll, oncekiKm: prevKmAll || null,
              tip: fuelTip,
              toplamTL: data.miktar,
              toplamLitre: 0,
              tlPerKm: null  // aşağıda hesaplanacak
            };
            /* ✅ Her yakıt için KENDİ tipinden önceki KM */
            if (fuelTip === 'benzin' || fuelTip === 'her-ikisi') {
              const prevB = App._findPrevFuelRecordSameType(id, data.tarih, 'benzin');
              const prevBKm = prevB?.fuel?.km;
              const bMesafe = (prevBKm && kmVal > prevBKm) ? (kmVal - prevBKm) : null;
              fuel.benzin = {
                litre: bLitre, birimFiyat: bFiyat, toplam: benzinTL,
                oncekiKm: prevBKm || null, mesafe: bMesafe,
                l100km: (bMesafe && bLitre) ? ((bLitre * 100) / bMesafe) : null
              };
              fuel.toplamLitre += bLitre;
            }
            if (fuelTip === 'lpg' || fuelTip === 'her-ikisi') {
              const prevL = App._findPrevFuelRecordSameType(id, data.tarih, 'lpg');
              const prevLKm = prevL?.fuel?.km;
              const lMesafe = (prevLKm && kmVal > prevLKm) ? (kmVal - prevLKm) : null;
              fuel.lpg = {
                litre: lLitre, birimFiyat: lFiyat, toplam: lpgTL,
                oncekiKm: prevLKm || null, mesafe: lMesafe,
                l100km: (lMesafe && lLitre) ? ((lLitre * 100) / lMesafe) : null
              };
              fuel.toplamLitre += lLitre;
            }
            fuel.litre = fuel.toplamLitre;
            fuel.birimFiyat = fuel.toplamLitre > 0 ? data.miktar / fuel.toplamLitre : 0;
            fuel.lPer100km = mesafeAll && fuel.toplamLitre ? ((fuel.toplamLitre * 100) / mesafeAll) : null;
                        // tlPerKm: sadece tek yakıt tipinde anlamlı
            if (fuelTip === 'lpg' && fuel.lpg?.mesafe && lpgTL > 0) {
              fuel.tlPerKm = lpgTL / fuel.lpg.mesafe;
            } else if (fuelTip === 'benzin' && fuel.benzin?.mesafe && benzinTL > 0) {
              fuel.tlPerKm = benzinTL / fuel.benzin.mesafe;
            }
            data.fuel = fuel;
          }
        } else {
          data.miktar = parseFloat(document.getElementById('eMiktar').value);
          data.fuel = null;
        }
        return data;
      }
    });

    if (value && value.miktar > 0) {
      await CRUD.islemGuncelle(id, tip, value);
      showToast('✅ Güncellendi!');
      await this.renderIslemList();
      if (this.currentPage === 'dashboard') await this.renderRecentList();
    }
  },

  async deleteIslem(id, tip) {
    const r = await Swal.fire({ icon:'warning', title:'Silmek istediğinize emin misiniz?', showCancelButton:true, confirmButtonColor:'#DC2626', confirmButtonText:'Evet, Sil', cancelButtonText:'İptal' });
    if (r.isConfirmed) {
      await CRUD.islemSil(id, tip);
      showToast('🗑️ Silindi');
      await this.renderIslemList();
      if (this.currentPage === 'dashboard') await this.renderRecentList();
      if (this.currentPage === 'islemler') {
        this._updateKategoriAylikOzet();   // 🆕
        this._updateFuelKmPlaceholder();    // 🆕 Son KM değişmiş olabilir
      }
    }
  },
