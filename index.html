    async _showBorcDetail(id) {
    const b = state.borcalacaklar.find(x => x.id == id);
    if (!b) { showToast('⚠️ Kayıt bulunamadı'); return; }

    const birim      = b.birim || 'tl';
    const fiyat      = Calc.birimFiyat(birim);
    const toplamTL   = (Number(b.miktar) || 0) * fiyat;
    const isAl       = b.tip === 'alacak';
    const birimKisa  = Calc.birimKisa(birim);
    const paid       = (b.payments || []).reduce((s, p) => s + (Number(p.miktar) || 0), 0);
    const kalanBirim = Math.max(0, (Number(b.miktar) || 0) - paid);
    const kalanTL    = kalanBirim * fiyat;
    const percent    = (Number(b.miktar) || 0) > 0 ? Math.min(100, Math.round((paid / Number(b.miktar)) * 100)) : 0;

    const payRows = (b.payments || []).map(p => {
      const pmBirim = Number(p.miktar) || 0;
      const pmTL    = pmBirim * fiyat;
      const pmStr   = birim === 'tl'
        ? Calc.fmt(pmTL)
        : `${pmBirim.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${birimKisa} <span style="color:var(--text3);">≈ ${Calc.fmt(pmTL)}</span>`;
      return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px;">
        <span>${dayjs(p.tarih || b.tarih).format('DD MMM')} ${p.aciklama ? '· ' + UI.escHtml(p.aciklama) : ''}</span>
        <span style="color:var(--accent);font-weight:700;">+${pmStr}</span>
      </div>`;
    }).join('');

    const miktarGosterim = birim === 'tl'
      ? Calc.fmt(toplamTL)
      : `${Calc.formatBirim(b)}<div style="font-size:10px;color:var(--text3);margin-top:2px;">≈ ${Calc.fmt(toplamTL)}</div>`;

    const kalanGosterim = birim === 'tl'
      ? Calc.fmt(kalanTL)
      : `${kalanBirim.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${birimKisa}<div style="font-size:10px;color:var(--text3);margin-top:2px;">≈ ${Calc.fmt(kalanTL)}</div>`;

    const result = await Swal.fire({
      title: (isAl ? '🟢 Alacak Detayı' : '🔴 Borç Detayı'),
      html: `<div style="text-align:left;">
        <div class="archive-stat-card" style="text-align:center;margin-bottom:12px;padding:14px;">
          <div class="archive-stat-label">Kişi</div>
          <div style="font-family:'Plus Jakarta Sans';font-size:18px;font-weight:800;">${UI.escHtml(b.kisiAdi)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px;">${isAl ? '🟢 Alacak' : '🔴 Borç'}</div>
        </div>

        <div class="archive-detail-stats">
          <div class="archive-stat-card">
            <div class="archive-stat-label">Toplam</div>
            <div class="archive-stat-value ${isAl ? 'green' : 'red'}">${miktarGosterim}</div>
          </div>
          <div class="archive-stat-card">
            <div class="archive-stat-label">Kalan</div>
            <div class="archive-stat-value ${kalanBirim > 0 ? 'amber' : 'green'}">${kalanBirim > 0 ? kalanGosterim : '✓ Ödendi'}</div>
          </div>
          <div class="archive-stat-card">
            <div class="archive-stat-label">Ödenme</div>
            <div class="archive-stat-value blue">%${percent}</div>
          </div>
        </div>

        <div class="progress-track" style="margin:6px 0;">
          <div class="progress-bar" style="width:${percent}%;background:${isAl ? 'var(--accent)' : 'var(--warning)'};"></div>
        </div>

        <div class="card-sm" style="margin-bottom:8px;">
          <div class="archive-stat-label">Oluşturulma</div>
          <div style="font-size:12px;margin-top:3px;">${dayjs(b.tarih).format('DD MMMM YYYY')}</div>
        </div>

        ${b.vadeTarihi ? `<div class="card-sm" style="margin-bottom:8px;border-color:var(--warning);">
          <div class="archive-stat-label" style="color:var(--warning);">📅 Vade Tarihi</div>
          <div style="font-size:12px;margin-top:3px;font-weight:700;">${dayjs(b.vadeTarihi).format('DD MMMM YYYY')}</div>
        </div>` : ''}

        ${b.aciklama ? `<div class="card-sm" style="margin-bottom:10px;">
          <div class="archive-stat-label">Açıklama</div>
          <div style="font-size:13px;margin-top:4px;">${UI.escHtml(b.aciklama)}</div>
        </div>` : ''}

        ${payRows ? `<div style="font-size:12px;font-weight:700;margin:12px 0 6px;">Ödeme Geçmişi (${(b.payments || []).length})</div>${payRows}` : ''}
      </div>`,
      showDenyButton: !b.odendiMi,
      showCancelButton: true,
      confirmButtonText: 'Kapat',
      denyButtonText: '💸 Ara Ödeme',
      cancelButtonText: '🗑️ Sil',
      denyButtonColor: 'var(--warning)',
      cancelButtonColor: 'var(--danger)',
      width: Math.min(480, window.innerWidth - 24)
    });

    if (result.isDenied) {
      await this.araOdeme(id);
    } else if (result.dismiss === Swal.DismissReason.cancel) {
      await this.silBorc(id);
    }
  },
  
  async deleteArchive(key) {
    const archive = state.archives[key];
    if (!archive) { showToast('⚠️ Arşiv bulunamadı'); return; }

    const range      = archive.salaryMonthRange || SalaryMonth.range(key);
    const aGelirler  = Array.isArray(archive.gelirler) ? archive.gelirler : [];
    const aGiderler  = Array.isArray(archive.giderler) ? archive.giderler : [];
    const aLoglar    = Array.isArray(archive.loglar)   ? archive.loglar   : [];

    const result = await Swal.fire({
      icon: 'warning',
      title: '🗑️ Arşivi Sil',
      html: `<div style="text-align:left;">
        <div style="padding:12px;background:var(--surface2);border-radius:10px;margin-bottom:12px;">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Arşiv</div>
          <div style="font-family:'Plus Jakarta Sans';font-size:15px;font-weight:800;">${SalaryMonth.shortLabel(key)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">${range.start} → ${range.end}</div>
        </div>
        <p><strong>${aGelirler.length}</strong> gelir · <strong>${aGiderler.length}</strong> gider · <strong>${aLoglar.length}</strong> log içeriyor.</p>
        <p style="font-size:12px;color:#94a3b8;margin-top:10px;">Ne yapmak istersiniz?</p>
      </div>`,
      showDenyButton: true,
      showCancelButton: true,
      confirmButtonText: '🗑️ Kalıcı Sil',
      denyButtonText:    '↩️ Ana Listeye Geri Yükle',
      cancelButtonText:  'İptal',
      confirmButtonColor: '#DC2626',
      denyButtonColor:    '#D97706',
      width: Math.min(520, window.innerWidth - 24)
    });

    /* İptal → hiçbir şey yapma */
    if (result.isDismissed) return;

    const isRestore = result.isDenied;
    let geriYuklenenGelir = 0;
    let geriYuklenenGider = 0;
    let geriYuklenenLog   = 0;

    /* ═══════════════════════════════════════
       GERİ YÜKLEME — ID çakışması korumalı
       ═══════════════════════════════════════ */
    if (isRestore) {
      const gIds = new Set(state.gelirler.map(g => g.id));
      const dIds = new Set(state.giderler.map(g => g.id));
      const lIds = new Set(state.logs.map(l => l.id));

      aGelirler.forEach(g => {
        if (!gIds.has(g.id)) { state.gelirler.push(g); geriYuklenenGelir++; }
      });
      aGiderler.forEach(g => {
        if (!dIds.has(g.id)) { state.giderler.push(g); geriYuklenenGider++; }
      });
      aLoglar.forEach(l => {
        if (!lIds.has(l.id)) { state.logs.push(l); geriYuklenenLog++; }
      });

      state.logs.sort((a, b) => b.timestamp > a.timestamp ? 1 : -1);

      /* Sadece geri yükleme durumunda ana store'ları yaz.
         Kalıcı silmede bu üçü zaten değişmedi — gereksiz IO. */
      await saveGelirler();
      await saveGiderler();
      await saveLogs();
    }

    /* ═══════════════════════════════════════
       ARŞİVİ KALDIR (her iki durumda da)
       ═══════════════════════════════════════ */
    delete state.archives[key];
    await saveArchives();

    /* Log kaydı — addLog zaten saveLogs() çağırıyor */
    await addLog(isRestore ? 'arsiv_geri_yukle' : 'arsiv_sil',
      SalaryMonth.label(key),
      { month: key,
        gelirCount: aGelirler.length,
        giderCount: aGiderler.length,
        logCount:   aLoglar.length });

    await createAutoBackup();

    /* ═══════════════════════════════════════
       KULLANICI GERİ BİLDİRİMİ
       ═══════════════════════════════════════ */
    if (isRestore) {
      const eklenen = geriYuklenenGelir + geriYuklenenGider;
      const toplam  = aGelirler.length + aGiderler.length;
      const atlanan = toplam - eklenen;
      const ekBilgi = atlanan > 0
        ? ` (${atlanan} kayıt zaten mevcuttu)`
        : '';
      showToast(`↩️ ${eklenen} işlem geri yüklendi${ekBilgi}`);
    } else {
      showToast('🗑️ Arşiv kalıcı olarak silindi');
    }

    await this.renderArsiv();
  },

  setBorcFilter(f) { this._borcFilter = f; UI.updateChips(document.getElementById('borcTabs'), f); this.renderBorcList(); },

  async renderBorcList() {

  const dc = (b.tarih || '').localeCompare(a.tarih || '');
  return dc !== 0 ? dc : (b.createdAt || '').localeCompare(a.createdAt || '');
});
    if      (this._borcFilter === 'alacak') all = all.filter(b => b.tip==='alacak' && !b.odendiMi);
    else if (this._borcFilter === 'borc')   all = all.filter(b => b.tip==='borc'   && !b.odendiMi);
    else if (this._borcFilter === 'odendi') all = all.filter(b => b.odendiMi);
    else                                    all = all.filter(b => !b.odendiMi);

    const el = document.getElementById('borcList');
    if (!el) return;
    if (!all.length) { el.innerHTML = UI.empty('Kayıt yok'); return; }

    el.innerHTML = all.map(b => {
      const birim      = b.birim || 'tl';
      const birimFiyat = Calc.birimFiyat(birim);
      const birimKisa  = Calc.birimKisa(birim);
      const toplamBirim = Number(b.miktar) || 0;
      const paidBirim   = (b.payments||[]).reduce((s,p)=>s + (Number(p.miktar)||0), 0);
      const kalanBirim  = Math.max(0, toplamBirim - paidBirim);
      const percent     = toplamBirim > 0 ? Math.min(100, Math.round((paidBirim/toplamBirim)*100)) : 0;
      const isAl        = b.tip === 'alacak';
      const barColor    = isAl ? 'var(--accent)' : 'var(--warning)';

      const toplamTL = toplamBirim * birimFiyat;
      const kalanTL  = kalanBirim * birimFiyat;
      const paidTL   = paidBirim * birimFiyat;

      const toplamGosterim = birim === 'tl'
        ? Calc.fmt(toplamTL)
        : `${toplamBirim.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${birimKisa}`;
      const toplamAltGosterim = birim === 'tl' ? '' : `≈ ${Calc.fmt(toplamTL)}`;

      const kalanGosterim = kalanBirim > 0
        ? (birim === 'tl'
            ? `Kalan: ${Calc.fmt(kalanTL)}`
            : `Kalan: ${kalanBirim.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${birimKisa} ≈ ${Calc.fmt(kalanTL)}`)
        : '✓ Tamamlandı';

      const odemeGosterim = birim === 'tl'
        ? `${Calc.fmt(paidTL)} / ${Calc.fmt(toplamTL)}`
        : `${paidBirim.toLocaleString('tr-TR',{maximumFractionDigits:2})} / ${toplamBirim.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${birimKisa}`;

      const payRows = (b.payments||[]).map(p => {
        const pmBirim = Number(p.miktar) || 0;
        const pmTL = pmBirim * birimFiyat;
        const pmStr = birim === 'tl'
          ? Calc.fmt(pmTL)
          : `${pmBirim.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${birimKisa} <span style="color:var(--text3);">≈ ${Calc.fmt(pmTL)}</span>`;
        return `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);padding:5px 0;border-bottom:1px solid var(--border);">
          <span>${dayjs(p.tarih||b.tarih).format('DD MMM')} ${p.aciklama?'· '+UI.escHtml(p.aciklama):''}</span>
          <span style="color:var(--accent);font-weight:700;">+${pmStr}</span>
        </div>`;
      }).join('');

      const birimBilgi = birim === 'tl'
        ? ''
        : `<div style="font-size:10px;color:var(--text3);margin-top:2px;">(${birimFiyat.toLocaleString('tr-TR')} TL/${birimKisa})</div>`;

      return `<div class="card" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            ${UI.tipBadge(b.tip)}
            <div style="font-family:'Plus Jakarta Sans';font-size:16px;font-weight:800;margin-top:6px;">${UI.escHtml(b.kisiAdi)}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px;">${dayjs(b.tarih).format('DD MMMM YYYY')}${b.aciklama?' · '+UI.escHtml(b.aciklama):''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-family:'Plus Jakarta Sans';font-size:${birim==='tl'?'20px':'16px'};font-weight:900;color:${isAl?'var(--accent)':'var(--danger)'};">${toplamGosterim}</div>
            ${toplamAltGosterim ? `<div style="font-size:10.5px;color:var(--text3);margin-top:1px;">${toplamAltGosterim}</div>` : ''}

  async submitBorc() {
    const tip      = document.getElementById('borcTip')?.value;
    const kisi     = document.getElementById('borcKisi')?.value?.trim();
    const birim    = document.getElementById('borcBirim')?.value || 'tl';
    const miktar   = parseFloat(document.getElementById('borcMiktar')?.value);
    const tarih    = document.getElementById('borcTarih')?.value;
    const aciklama = document.getElementById('borcAciklama')?.value || '';
    const vadeTarihi = document.getElementById('borcVade')?.value || null;
    if (!kisi)           { Swal.fire({ icon:'warning', title:'Kişi adı gerekli!', timer:1800, showConfirmButton:false }); return; }
    if (!miktar||miktar<=0) { Swal.fire({ icon:'warning', title:'Geçersiz miktar!', timer:1800, showConfirmButton:false }); return; }
    await CRUD.borcEkle(tip, kisi, miktar, birim, tarih, aciklama, vadeTarihi);
    document.getElementById('borcKisi').value = '';
    document.getElementById('borcMiktar').value = '';
    document.getElementById('borcAciklama').value = '';
    const vadeEl = document.getElementById('borcVade');
    if (vadeEl) vadeEl.value = '';

    const gosterim = birim === 'tl'
      ? Calc.fmt(miktar)
      : `${miktar.toLocaleString('tr-TR',{maximumFractionDigits:2})} ${Calc.birimKisa(birim)} ≈ ${Calc.fmt(miktar * Calc.birimFiyat(birim))}`;
    showToast(`${tip==='alacak'?'📥 Alacak':'📤 Borç'} eklendi: ${kisi} — ${gosterim}`);

    // Özet kartlarını da yenile
    await this.renderBorcalacak();
  },

async araOdeme(id) {
    const item = state.borcalacaklar.find(b => b.id == id);
    if (!item) return;
    const birim = item.birim || 'tl';
    const birimKisa = Calc.birimKisa(birim);
    const birimFiyat = Calc.birimFiyat(birim);
    const etiket = birim === 'tl' ? 'Miktar (TL)' : `Miktar (${Calc.birimAdi(birim)})`;
    const hint = birim === 'tl' ? '' : `<div style="font-size:11px;color:#94a3b8;margin-top:4px;">1 ${birimKisa} = ${Calc.fmt(birimFiyat)}</div>`;

    const { value } = await Swal.fire({
      title: '💸 Ara Ödeme Ekle',
      html: `<div style="text-align:left;">
        <label style="font-size:12px;font-weight:600;color:#475569;">${etiket}</label>

      confirmButtonText: 'Ödeme Ekle',
      showCancelButton: true,
      cancelButtonText: 'İptal',
      preConfirm: () => ({
        miktar:   parseFloat(document.getElementById('oPay').value),
        tarih:    document.getElementById('oTarih').value,
        aciklama: document.getElementById('oNot').value
      })
    });

    if (!value || !(value.miktar > 0)) return;

    // ✅ DOĞRU ÇAĞRI: araOdemeEkle
    await CRUD.araOdemeEkle(id, value.miktar, value.tarih, value.aciklama);

    if (this.currentPage === 'dashboard') await this.renderRecentList();
},

      await CRUD.borcOdendi(id);

      if (this.currentPage === 'dashboard') await this.renderRecentList();
      if (this.currentPage === 'arsiv') await this.renderArsiv();

    if (r.isConfirmed) {
      await CRUD.borcSil(id);
      showToast('🗑️ Kayıt silindi');
      await this.renderBorcList();
      if (this.currentPage === 'dashboard') await this.renderRecentList();
    }
  },

          <div class="archive-stat-label">✅ Tamamlanma Tarihi</div>
          <div style="font-size:12px;margin-top:3px;color:var(--accent);font-weight:700;">${odemeTarihi}</div>
        </div>

        ${b.aciklama ? `<div class="card-sm" style="margin-bottom:10px;">
          <div class="archive-stat-label">Açıklama</div>
          <div style="font-size:13px;margin-top:4px;">${UI.escHtml(b.aciklama)}</div>
        </div>` : ''}

        ${payRows ? `<div style="font-size:12px;font-weight:700;margin:12px 0 6px;">Ödeme Geçmişi</div>${payRows}` : ''}
      </div>`,
      showDenyButton: true,
      showCancelButton: true,
      confirmButtonText: 'Kapat',
      denyButtonText: '↩️ Geri Al',
      cancelButtonText: '🗑️ Kalıcı Sil',
      denyButtonColor: '#f59e0b',
      cancelButtonColor: '#dc2626',
      width: Math.min(500, window.innerWidth - 24)
    });

    if (result.isDenied) {
      await this.geriAlTamamlananBorc(id);
    } else if (result.isDismissed && result.dismiss === Swal.DismissReason.cancel) {
      await this.kaliciSilTamamlananBorc(id);
    }
  },

  async geriAlTamamlananBorc(id) {
    const b = state.borcalacaklar.find(x => x.id == id);
    if (!b) return;

    b.odendiMi = false;
    delete b.odemeTarihi;

    // Eğer ödemeler toplamı borcu karşılıyorsa, son ödemeyi geri al
    const totalPaid = (b.payments || []).reduce((s, p) => s + (Number(p.miktar) || 0), 0);
    if (totalPaid >= b.miktar && b.payments && b.payments.length > 0) {
      b.payments = b.payments.slice(0, -1);
    }

    await saveBorclar();
    await addLog('borc_geri_alindi', b.kisiAdi);
    await createAutoBackup();

    showToast('↩️ Kayıt tekrar aktif olarak işaretlendi');
    await this.renderArsiv();
  },

  async kaliciSilTamamlananBorc(id) {
    const b = state.borcalacaklar.find(x => x.id == id);
    if (!b) return;

    const onay = await Swal.fire({
      icon: 'warning',
      title: 'Kalıcı olarak silinsin mi?',
      html: `<p><strong>${UI.escHtml(b.kisiAdi)}</strong> kaydı tamamen silinecek.</p>
             <p style="font-size:12px;color:#94a3b8;margin-top:6px;">Bu işlem geri alınamaz.</p>`,
      showCancelButton: true,
      confirmButtonText: 'Evet, Sil',
      confirmButtonColor: '#dc2626',
      cancelButtonText: 'İptal'
    });

    if (!onay.isConfirmed) return;

    state.borcalacaklar = state.borcalacaklar.filter(x => x.id != id);
    await saveBorclar();
    await addLog('borc_sil_kalici', b.kisiAdi);
    await createAutoBackup();

    showToast('🗑️ Kayıt kalıcı olarak silindi');
    await this.renderArsiv();
  },
  /* ═══════════════════════════════════════════════════════════════
     ⛽ AKARYAKIT GEÇMİŞ MODAL — Modern, Paginated, Export
     ═══════════════════════════════════════════════════════════════ */
  _fuelFilter: { q: '', range: 'tum', tip: 'tum' },
  _fuelPage: 1,
  _fuelChartId: null,
  _fuelSearchTimer: null,

  async openFuelHistoryModal() {
    const stats = Calc.fuelStats();
    if (stats.count === 0) {
      showToast('ℹ️ Henüz akaryakıt kaydı yok');
      return;
    }

    this._fuelChartId = 'fuelHistoryChart_' + Date.now();
    this._fuelPage = 1;
    if (!this._fuelFilter) this._fuelFilter = { q: '', range: 'tum', tip: 'tum' };

    const filtered = this._filterFuelItems(stats.items, this._fuelFilter);
    const paginated = this._paginateFuel(filtered, this._fuelPage);

    await Swal.fire({
      title: '⛽ Akaryakıt Geçmişi',
      html: `<div style="text-align:left;max-height:75vh;overflow-y:auto;padding-right:4px;">
        ${this._buildFuelSummaryHTML(stats)}

        ${this._buildLpgDetailedHTML(stats)}

        ${this._buildBenzinSimpleHTML(stats)}

        <div style="margin-bottom:10px;">
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:6px;letter-spacing:.4px;">📈 LPG Tüketim Trendi</div>
          <div style="height:200px;position:relative;">
            <canvas id="${this._fuelChartId}"></canvas>
          </div>
        </div>

        ${this._buildFuelMonthlyHTML(stats)}

        <!-- Filtreler -->
        <div style="margin-bottom:10px;padding-top:12px;border-top:1px solid var(--border);">
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:6px;letter-spacing:.4px;">🔍 Filtrele</div>
          <div class="fuel-filter-chips" style="margin-bottom:6px;">
            ${[['tum','Tümü'],['ay','Son 1 Ay'],['3ay','Son 3 Ay'],['6ay','Son 6 Ay'],['yil','Son 1 Yıl']].map(([k, v]) =>
              `<span class="fuel-filter-chip ${this._fuelFilter.range === k ? 'active' : ''}" data-range="${k}" onclick="App._setFuelFilterRange('${k}')">${v}</span>`
            ).join('')}
          </div>
          <div class="fuel-filter-chips" style="margin-bottom:8px;">
            ${[['tum','Tüm Kayıtlar'],['lpg','💧 LPG'],['benzin','⛽ Benzin'],['her-ikisi','⛽+💧 Her İkisi']].map(([k, v]) =>
              `<span class="fuel-filter-chip ${this._fuelFilter.tip === k ? 'active' : ''}" data-tip="${k}" onclick="App._setFuelFilterTip('${k}')">${v}</span>`
            ).join('')}
          </div>
          <div class="search-box" style="margin-bottom:0;">
            <i class="fas fa-search"></i>
            <input type="text" id="fuelFilterSearch" class="form-input" placeholder="Açıklama veya tarihte ara…" value="${UI.escHtml(this._fuelFilter.q)}" oninput="App._setFuelFilterQuery(this.value)">
          </div>
        </div>

        <!-- Kayıtlar -->
        <div>
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:6px;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;">
            <span>⛽ Dolum Kayıtları</span>
            <span id="fuelRecordsCount" style="font-size:9px;color:var(--text3);font-weight:600;text-transform:none;">${filtered.length} / ${stats.count}</span>
          </div>
          <div id="fuelRecordsList">
            ${this._buildFuelRecordsHTML(paginated.items)}
          </div>
          <div id="fuelPagination">
            ${this._buildFuelPaginationHTML(paginated)}
          </div>
        </div>
      </div>`,
      width: Math.min(760, window.innerWidth - 16),
      confirmButtonText: 'Kapat',
      showCloseButton: true,
      customClass: { popup: 'fuel-history-popup' },
      didOpen: () => {
        requestAnimationFrame(() => {
          try { this._renderFuelTrendChart(filtered); } catch (e) { console.warn('[FuelHistory] Chart:', e); }
        });
      },
      willClose: () => {
        if (Charts.instances[this._fuelChartId]) {
          try { Charts.destroy(this._fuelChartId); } catch (_) {}
        }
        this._fuelChartId = null;
      }
    });
  },
  _renderFuelTrendChart(items) {
    if (!this._fuelChartId) return;

    /* LPG dolumları arası ardışık hesapla */
    const lpgWithKm = items
      .filter(i => i._lpg.litre > 0 && i._km > 0)
      .sort((a, b) => {
        if (a.tarih !== b.tarih) return a.tarih.localeCompare(b.tarih);
        return (a.createdAt || '').localeCompare(b.createdAt || '');
      });

    const chartData = [];
    for (let i = 1; i < lpgWithKm.length; i++) {
      const diff = lpgWithKm[i]._km - lpgWithKm[i-1]._km;
      if (diff > 0) {
        chartData.push({
          date: lpgWithKm[i].tarih,
          l100: (lpgWithKm[i]._lpg.litre * 100) / diff,
          tlKm: lpgWithKm[i]._lpg.toplam / diff
        });
      }
    }

    if (chartData.length < 2) {
      Charts.destroy(this._fuelChartId);
      return;
    }

    Charts.destroy(this._fuelChartId);
    const el = document.getElementById(this._fuelChartId);
    if (!el) return;

    Charts.instances[this._fuelChartId] = new Chart(el.getContext('2d'), {
      type: 'line',
      data: {
        labels: chartData.map(c => dayjs(c.date).format('DD MMM')),
        datasets: [
          {
            label: 'LPG L/100km',
            data: chartData.map(c => c.l100),
            borderColor: '#0891B2',
            backgroundColor: 'rgba(8,145,178,.10)',
            tension: 0.35, fill: true, borderWidth: 2.5,
            pointRadius: 4, pointBackgroundColor: '#0891B2',
            yAxisID: 'y'
          },
          {
            label: 'LPG TL/km',
            data: chartData.map(c => c.tlKm),
            borderColor: '#D97706',
            backgroundColor: 'rgba(217,119,6,.08)',
            tension: 0.35, fill: false, borderWidth: 2,
            pointRadius: 3, pointBackgroundColor: '#D97706',
            borderDash: [4, 4],
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 10 }, usePointStyle: true, padding: 8 } },
          tooltip: {
            callbacks: {
              label: ctx => ctx.dataset.yAxisID === 'y'
                ? ` ${ctx.dataset.label}: ${Number(ctx.raw).toFixed(2)}`
                : ` ${ctx.dataset.label}: ${Number(ctx.raw).toFixed(3)}`
            }
          }
        },
        scales: {
          y:  { position: 'left', title: { display: true, text: 'L/100km', font: { size: 9 } }, ticks: { font: { size: 9 } }, grid: { color: 'rgba(148,163,184,.12)' } },
          y1: { position: 'right', title: { display: true, text: 'TL/km', font: { size: 9 } }, ticks: { font: { size: 9 } }, grid: { display: false } },
          x:  { ticks: { font: { size: 9 } }, grid: { display: false } }
        }
      }
    });
  },
  _filterFuelItems(items, filter) {
    let f = items.slice();
    if (filter.range !== 'tum') {
      const now = dayjs();
      let cutoff;
      if (filter.range === 'ay')       cutoff = now.subtract(30, 'day');
      else if (filter.range === '3ay') cutoff = now.subtract(90, 'day');
      else if (filter.range === '6ay') cutoff = now.subtract(180, 'day');
      else if (filter.range === 'yil') cutoff = now.subtract(365, 'day');
      if (cutoff) f = f.filter(i => dayjs(i.tarih).isAfter(cutoff));
    }
    if (filter.tip && filter.tip !== 'tum') {
      if (filter.tip === 'benzin')         f = f.filter(i => i._benzin.litre > 0);
      else if (filter.tip === 'lpg')       f = f.filter(i => i._lpg.litre > 0);
      else if (filter.tip === 'her-ikisi') f = f.filter(i => i._tip === 'her-ikisi');
    }
    if (filter.q) {
      const q = filter.q.toLowerCase();
      f = f.filter(i =>
        (i.aciklama || '').toLowerCase().includes(q) ||
        (i.tarih || '').includes(q)
      );
    }
    return f;
  },

  _paginateFuel(items, page, perPage = 10) {
    const sorted = [...items].sort((a, b) => {
      if (a.tarih !== b.tarih) return (b.tarih || '').localeCompare(a.tarih || '');
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
    const total = Math.max(1, Math.ceil(sorted.length / perPage));
    const pg = Math.min(Math.max(1, page), total);
    return {
      items: sorted.slice((pg - 1) * perPage, pg * perPage),
      page: pg, total, hasPrev: pg > 1, hasNext: pg < total,
      totalCount: sorted.length
    };
  },

  _buildFuelPaginationHTML(pgInfo) {
    if (pgInfo.total <= 1) return '';
    return `<div class="fuel-pagination">
      <button type="button" class="fuel-pg-btn" ${!pgInfo.hasPrev ? 'disabled' : ''} onclick="App._setFuelPage(${pgInfo.page - 1})">
        <i class="fas fa-chevron-left"></i>
      </button>
      <span class="fuel-pg-info">${pgInfo.page} / ${pgInfo.total}</span>
      <button type="button" class="fuel-pg-btn" ${!pgInfo.hasNext ? 'disabled' : ''} onclick="App._setFuelPage(${pgInfo.page + 1})">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>`;
  },

  _setFuelPage(page) {
    this._fuelPage = page;
    this._refreshFuelHistoryList();
  },

  _setFuelFilterRange(k) {
    if (!this._fuelFilter) this._fuelFilter = { q: '', range: 'tum', tip: 'tum' };
    this._fuelFilter.range = k;
    this._fuelPage = 1;
    document.querySelectorAll('.fuel-filter-chip[data-range]').forEach(c => c.classList.toggle('active', c.dataset.range === k));
    this._refreshFuelHistoryList();
  },

  _setFuelFilterTip(k) {
    if (!this._fuelFilter) this._fuelFilter = { q: '', range: 'tum', tip: 'tum' };
    this._fuelFilter.tip = k;
    this._fuelPage = 1;
    document.querySelectorAll('.fuel-filter-chip[data-tip]').forEach(c => c.classList.toggle('active', c.dataset.tip === k));
    this._refreshFuelHistoryList();
  },

  _setFuelFilterQuery(q) {
    if (!this._fuelFilter) this._fuelFilter = { q: '', range: 'tum', tip: 'tum' };
    this._fuelFilter.q = q;
    this._fuelPage = 1;
    clearTimeout(this._fuelSearchTimer);
    this._fuelSearchTimer = setTimeout(() => this._refreshFuelHistoryList(), 300);
  },

  _refreshFuelHistoryList() {
    const stats = Calc.fuelStats();
    const filtered = this._filterFuelItems(stats.items, this._fuelFilter);
    const paginated = this._paginateFuel(filtered, this._fuelPage);

    const listEl = document.getElementById('fuelRecordsList');
    if (listEl) listEl.innerHTML = this._buildFuelRecordsHTML(paginated.items);

    const paginationEl = document.getElementById('fuelPagination');
    if (paginationEl) paginationEl.innerHTML = this._buildFuelPaginationHTML(paginated);

    const countEl = document.getElementById('fuelRecordsCount');
    if (countEl) countEl.textContent = `${filtered.length} / ${stats.count}`;

    requestAnimationFrame(() => {
      try { this._renderFuelTrendChart(filtered); } catch (e) { console.warn('[FuelHistory] Chart refresh:', e); }
    });
  },
  _buildFuelRecordsHTML(items) {
    if (!items.length) {
      return '<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;"><i class="fas fa-inbox" style="font-size:24px;opacity:.4;display:block;margin-bottom:6px;"></i>Kayıt yok</div>';
    }
    return items.map(i => {
      const tipBadges = [];
      if (i._lpg.litre > 0)    tipBadges.push('<span style="background:var(--info-light);color:var(--info);padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;">💧 LPG</span>');
      if (i._benzin.litre > 0) tipBadges.push('<span style="background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;">⛽ BENZİN</span>');

      const metrics = [];
      if (i._km > 0) metrics.push(`<span class="fuel-record-metric">🛣️ <strong>${i._km.toLocaleString('tr-TR')}</strong> km</span>`);
      if (i._lpg.litre > 0) metrics.push(`<span class="fuel-record-metric" style="color:var(--info);">💧 <strong>${i._lpg.litre.toFixed(1)}</strong> L</span>`);
      if (i._lpgL100) metrics.push(`<span class="fuel-record-metric" style="color:var(--warning);font-weight:700;">${i._lpgL100.toFixed(2)} L/100km</span>`);
      if (i._benzin.litre > 0) metrics.push(`<span class="fuel-record-metric" style="color:var(--primary);">⛽ <strong>${i._benzin.litre.toFixed(1)}</strong> L</span>`);

      return `<div class="fuel-record-row" onclick="App._openFuelRecordDetail(${i.id})">
        <div>
          <div class="fuel-record-date">${dayjs(i.tarih).format('DD MMM YY')}</div>
          <div style="display:flex;gap:3px;margin-top:2px;flex-wrap:wrap;">${tipBadges.join('')}</div>
        </div>
        <div class="fuel-record-main">
          <div class="fuel-record-amount"><strong>${Calc.fmt(i._toplamTL)}</strong></div>
          <div class="fuel-record-metrics">${metrics.join('')}</div>
        </div>
        <i class="fas fa-chevron-right" style="color:var(--text3);font-size:10px;"></i>
      </div>`;
    }).join('');
  },


  _buildFuelMonthlyHTML(s) {
    if (!s.lpg.monthly.length) return '';
    const rows = s.lpg.monthly.slice(-6).map(m => `
      <div style="display:grid;grid-template-columns:auto 1fr auto auto auto auto;gap:6px;padding:8px 10px;font-size:10.5px;border-bottom:1px dashed var(--border);align-items:center;">
        <span style="font-weight:700;color:var(--text);min-width:65px;">${m.label}</span>
        <span style="color:var(--text3);font-size:9.5px;">${m.lpgCount} dolum</span>
        <span style="color:var(--info);font-weight:800;text-align:right;">${m.lpgLitre.toFixed(1)} L</span>
        <span style="color:var(--danger);font-weight:700;text-align:right;">${Calc.fmt(m.lpgTL)}</span>
        <span style="color:var(--text2);text-align:right;font-size:9.5px;">${m.km.toLocaleString('tr-TR')} km</span>
        <span style="color:${m.avgL100 > 0 ? 'var(--warning)' : 'var(--text3)'};text-align:right;font-size:9.5px;font-weight:700;">${m.avgL100 > 0 ? m.avgL100.toFixed(2) : '—'}</span>
      </div>
    `).join('');
    return `<div style="margin-bottom:10px;">
      <div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:6px;letter-spacing:.4px;">📅 Aylık LPG Özeti</div>
      <div style="background:var(--surface2);border-radius:10px;overflow:hidden;">
        <div style="display:grid;grid-template-columns:auto 1fr auto auto auto auto;gap:6px;padding:6px 10px;font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700;background:var(--surface);border-bottom:1px solid var(--border);">
          <span>Dönem</span><span></span><span style="text-align:right;">Litre</span><span style="text-align:right;">Tutar</span><span style="text-align:right;">KM</span><span style="text-align:right;">L/100</span>
        </div>
        ${rows}
      </div>
    </div>`;
  },
  /* ═══ LPG DETAYLI PANEL (Büyük, kapsamlı) ═══ */
  _buildLpgDetailedHTML(s) {
    const l = s.lpg;
    if (l.count === 0) return '';

    const trendIcon = l.trend ? (l.trend.yon === 'up' ? '↑' : l.trend.yon === 'down' ? '↓' : '≈') : '—';
    const trendColor = l.trend
      ? (l.trend.yon === 'up' ? 'var(--danger)' : l.trend.yon === 'down' ? 'var(--accent)' : 'var(--text3)')
      : 'var(--text3)';
    const trendText = l.trend ? `${trendIcon} %${Math.abs(l.trend.yuzde).toFixed(1)}` : '—';

    return `
      <div style="border-left:4px solid var(--info);background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:32px;height:32px;border-radius:8px;background:var(--info);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;">
              <i class="fas fa-fire-flame-simple"></i>
            </div>
            <div>
              <div style="font-size:14px;font-weight:800;color:var(--info);letter-spacing:-.2px;">LPG · Ana Yakıt</div>
              <div style="font-size:10px;color:var(--info);opacity:.8;">Detaylı Tüketim İstatistikleri</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700;">Dolum</div>
            <div style="font-size:16px;font-weight:800;color:var(--text);">${l.count}</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div class="fuel-modal-stat">
            <div class="fuel-modal-stat-label">Toplam Litre</div>
            <div class="fuel-modal-stat-value cyan" style="font-size:16px;">${l.totalLitre.toFixed(2)} L</div>
          </div>
          <div class="fuel-modal-stat">
            <div class="fuel-modal-stat-label">Toplam Tutar</div>
            <div class="fuel-modal-stat-value red" style="font-size:16px;">${Calc.fmt(l.totalTL)}</div>
          </div>
          <div class="fuel-modal-stat">
            <div class="fuel-modal-stat-label">Tüketim Hesabına Giren KM</div>
            <div class="fuel-modal-stat-value blue" style="font-size:16px;">${l.totalKm.toLocaleString('tr-TR')} km</div>
          </div>
          <div class="fuel-modal-stat">
            <div class="fuel-modal-stat-label">Ort. Tüketim</div>
            <div class="fuel-modal-stat-value amber" style="font-size:16px;">${l.avgL100 > 0 ? l.avgL100.toFixed(2) : '—'} <span style="font-size:10px;">L/100km</span></div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;">
          <div class="fuel-modal-stat">
            <div class="fuel-modal-stat-label">Ort. TL/km</div>
            <div class="fuel-modal-stat-value" style="font-size:13px;color:var(--info);">${l.avgTlPerKm > 0 ? l.avgTlPerKm.toFixed(3) : '—'}</div>
          </div>
          <div class="fuel-modal-stat">
            <div class="fuel-modal-stat-label">Ort. Fiyat</div>
            <div class="fuel-modal-stat-value" style="font-size:13px;color:var(--warning);">${l.avgFiyat.toFixed(2)} TL/L</div>
          </div>
          <div class="fuel-modal-stat">
            <div class="fuel-modal-stat-label">Trend</div>
            <div class="fuel-modal-stat-value" style="font-size:13px;color:${trendColor};">${trendText}</div>
          </div>
        </div>

        ${l.dolumAraligi ? `
          <div style="background:var(--surface);border-radius:8px;padding:8px 10px;margin-bottom:8px;border:1px solid var(--border);">

  quickFilter(t) {
    const now = dayjs();
    const salaryRange = SalaryMonth.range(SalaryMonth.currentKey());
    const map = {
      bugun: [now.format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      hafta: [now.subtract(7,'day').format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      ay:    [salaryRange.start, salaryRange.end],
      '3ay': [now.subtract(3,'month').format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      '6ay': [now.subtract(6,'month').format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      yil:   [now.startOf('year').format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      tum: (() => {
        const dates = [
          ...state.gelirler.map(g => g.tarih),
          ...state.giderler.map(g => g.tarih),
          ...Object.values(state.archives).flatMap(a => [
            ...(Array.isArray(a.gelirler) ? a.gelirler : []).map(x => x.tarih),
            ...(Array.isArray(a.giderler) ? a.giderler : []).map(x => x.tarih)
          ])
        ].filter(Boolean).sort();
        return [dates[0] || '2000-01-01', dayjs().format('YYYY-MM-DD')];
      })()
    };
    if (map[t]) {
      const rStart = document.getElementById('rStart');
      const rEnd   = document.getElementById('rEnd');
      if (rStart) rStart.value = map[t][0];
      if (rEnd)   rEnd.value   = map[t][1];
      this.applyRapor();
    }
  },

  async applyRapor() {
    const start  = document.getElementById('rStart')?.value || this._raporStart;
    const end    = document.getElementById('rEnd')?.value   || this._raporEnd;
    this._raporStart = start; this._raporEnd = end;
    const f      = { start, end };
    const gelir  = Calc._toplamGelirTum(f);
    const gider  = Calc._toplamGiderTum(f);
    const bakiye = gelir - gider;
    const katG   = Calc._kategoriGiderlerTum(f);
    const topKat = Object.entries(katG).sort((a,b)=>b[1]-a[1])[0];
    const gunFark= Math.max(1, dayjs(end).diff(dayjs(start),'day') + 1);
    const avgGun = gider / gunFark;
    const tasarrufOrani = gelir > 0 ? ((gelir - gider) / gelir) * 100 : 0;

    // ─── Kategori analiz ───
    const katGiderAnaliz = Object.entries(katG)
      .sort((a,b)=>b[1]-a[1])
      .map(([kat, tutar]) => ({
        kat, tutar,
        yuzde: gider > 0 ? (tutar / gider) * 100 : 0
      }));

    const katGelir = Calc._allGelirler()
      .filter(g => g.tarih >= start && g.tarih <= end)
      .reduce((m, g) => {
        const k = g.kategori || 'Diğer';
        m[k] = (m[k] || 0) + (Number(g.miktar) || 0);
        return m;
      }, {});
    const katGelirAnaliz = Object.entries(katGelir)
      .sort((a,b)=>b[1]-a[1])
      .map(([kat, tutar]) => ({
        kat, tutar,
        yuzde: gelir > 0 ? (tutar / gelir) * 100 : 0
      }));

    // ─── Ay bazlı ───
    const allGelirler = Calc._allGelirler().filter(g => g.tarih >= start && g.tarih <= end);
    const allGiderler = Calc._allGiderler().filter(g => g.tarih >= start && g.tarih <= end);
    const ayBazli = {};

  /* ⛽ Akaryakıt PDF Rapor */
  async exportFuelPDF() {
    if (typeof window.jspdf === 'undefined') {
      showToast('❌ PDF motoru yüklenemedi');
      return;
    }

    const stats = Calc.fuelStats();
    if (stats.count === 0) { showToast('ℹ️ Kayıt yok'); return; }

    Swal.fire({ title: '📄 PDF hazırlanıyor…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      const M = 15;

      const hasUni = await _loadPdfFonts(doc);
      const FONT = hasUni ? 'Roboto' : 'helvetica';

      const l = stats.lpg;
      const b = stats.benzin;

      /* KAPAK — LPG cyan */
      doc.setFillColor(8, 145, 178);
      doc.rect(0, 0, W, 42, 'F');
      doc.setFillColor(14, 116, 144);
      doc.rect(0, 20, W, 22, 'F');

      doc.setFont(FONT, 'bold');
      doc.setFontSize(22);
      doc.setTextColor(255, 255, 255);
      _txt(doc, 'AKARYAKIT RAPORU', M, 16, null, hasUni);

      doc.setFont(FONT, 'normal');
      doc.setFontSize(11);
      doc.setTextColor(207, 250, 254);
      _txt(doc, 'LPG Odaklı Tüketim & İstatistik Analizi', M, 26, null, hasUni);

      doc.setFontSize(9);
      doc.setTextColor(207, 250, 254);
      _txt(doc, dayjs().format('DD MMMM YYYY · HH:mm'), W - M, 34, { align: 'right' }, hasUni);

      let y = 52;

      /* ÜST ÖZET — 4 kart */
      const cw = (W - 2 * M - 9) / 4;
      _kart(doc, M,               y, cw, 22, { label: 'Toplam Dolum', value: String(stats.count),                        accent: [8,145,178] }, hasUni, FONT);
      _kart(doc, M + cw + 3,      y, cw, 22, { label: 'LPG Litre',    value: l.totalLitre.toFixed(2) + ' L',             accent: [8,145,178] }, hasUni, FONT);
      _kart(doc, M + (cw+3)*2,    y, cw, 22, { label: 'LPG Tutar',    value: Calc.fmt(l.totalTL),                        accent: [185,28,28] }, hasUni, FONT);
      _kart(doc, M + (cw+3)*3,    y, cw, 22, { label: 'LPG L/100km',  value: l.avgL100 > 0 ? l.avgL100.toFixed(2) : '—', accent: [217,119,6] }, hasUni, FONT);
      y += 30;

      /* LPG DETAYLI */
      if (l.count > 0) {
        if (y > H - 60) { doc.addPage(); y = 20; }
        _baslik(doc, 'LPG — DETAYLI TÜKETİM İSTATİSTİKLERİ', y, hasUni, FONT);
        y += 10;

        const lcw = (W - 2 * M - 9) / 4;
        _kart(doc, M,               y, lcw, 20, { label: 'Ölçülen KM',    value: l.totalKm.toLocaleString('tr-TR') + ' km',          accent: [37,99,235] }, hasUni, FONT);
        _kart(doc, M + lcw + 3,     y, lcw, 20, { label: 'Ort. L/100km',  value: l.avgL100 > 0 ? l.avgL100.toFixed(2) : '—',         accent: [217,119,6] }, hasUni, FONT);
        _kart(doc, M + (lcw+3)*2,   y, lcw, 20, { label: 'Ort. TL/km',    value: l.avgTlPerKm > 0 ? l.avgTlPerKm.toFixed(3) : '—',   accent: [8,145,178] }, hasUni, FONT);
        _kart(doc, M + (lcw+3)*3,   y, lcw, 20, { label: 'Ort. TL/L',     value: l.avgFiyat.toFixed(2),                              accent: [146,64,14] }, hasUni, FONT);
        y += 26;

        if (l.stats.count > 0) {
          if (y > H - 40) { doc.addPage(); y = 20; }
          _baslik(doc, 'TÜKETİM DAĞILIMI · ' + l.stats.count + ' ÖLÇÜM (L/100km)', y, hasUni, FONT);
          y += 10;

          doc.setFillColor(248, 250, 252);
          doc.rect(M, y - 4, W - 2 * M, 6, 'F');
          doc.setFont(FONT, 'bold');
          doc.setFontSize(7.5);
          doc.setTextColor(100, 116, 139);
          const colW = (W - 2 * M) / 6;
          _txt(doc, 'MIN',    M + colW * 0 + 4, y, null, hasUni);
          _txt(doc, 'P25',    M + colW * 1 + 4, y, null, hasUni);
          _txt(doc, 'MEDYAN', M + colW * 2 + 4, y, null, hasUni);
          _txt(doc, 'P75',    M + colW * 3 + 4, y, null, hasUni);
          _txt(doc, 'P90',    M + colW * 4 + 4, y, null, hasUni);
          _txt(doc, 'MAX',    M + colW * 5 + 4, y, null, hasUni);
          y += 5;

          doc.setFont(FONT, 'normal');
          doc.setFontSize(10);
          doc.setTextColor(15, 23, 42);
          _txt(doc, l.stats.min.toFixed(2),    M + colW * 0 + 4, y + 2, null, hasUni);
          _txt(doc, l.stats.p25.toFixed(2),    M + colW * 1 + 4, y + 2, null, hasUni);
          _txt(doc, l.stats.median.toFixed(2), M + colW * 2 + 4, y + 2, null, hasUni);
          _txt(doc, l.stats.p75.toFixed(2),    M + colW * 3 + 4, y + 2, null, hasUni);
          _txt(doc, l.stats.p90.toFixed(2),    M + colW * 4 + 4, y + 2, null, hasUni);
          _txt(doc, l.stats.max.toFixed(2),    M + colW * 5 + 4, y + 2, null, hasUni);
          y += 7;

          doc.setFont(FONT, 'normal');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          _txt(doc, `Standart Sapma: ${l.stats.stdDev.toFixed(3)} L/100km`, M, y + 2, null, hasUni);
          y += 10;
        }

        if (l.dolumAraligi) {
          if (y > H - 25) { doc.addPage(); y = 20; }
          doc.setFont(FONT, 'bold');
          doc.setFontSize(9.5);
          doc.setTextColor(15, 23, 42);
          _txt(doc, `Dolum Aralığı:  Ort. ${l.dolumAraligi.ortalama.toFixed(0)} gün  ·  Min ${l.dolumAraligi.min}  ·  Max ${l.dolumAraligi.max}  ·  Medyan ${l.dolumAraligi.medyan.toFixed(0)} gün`, M + 2, y + 2, null, hasUni);
          y += 8;
        }

        if (l.fiyatTrend) {
          if (y > H - 25) { doc.addPage(); y = 20; }
          const renkTrend = l.fiyatTrend.yuzde > 0 ? [220, 38, 38] : [5, 150, 105];
          const ok = l.fiyatTrend.yuzde > 0 ? '↑' : '↓';
          doc.setFont(FONT, 'bold');
          doc.setFontSize(9.5);
          doc.setTextColor(...renkTrend);
          _txt(doc, `LPG Fiyat Trendi:  ${l.fiyatTrend.ilk.toFixed(2)} → ${l.fiyatTrend.son.toFixed(2)} TL/L  (${ok} %${Math.abs(l.fiyatTrend.yuzde).toFixed(1)})`, M + 2, y + 2, null, hasUni);
          y += 8;
        }

        if (l.enEkonomik && l.enPahali) {
          if (y > H - 25) { doc.addPage(); y = 20; }
          doc.setFont(FONT, 'bold');
          doc.setFontSize(9.5);
          doc.setTextColor(5, 150, 105);
          _txt(doc, `En Verimli:  ${(l.enEkonomik._lpgL100 || 0).toFixed(2)} L/100km  (${dayjs(l.enEkonomik.tarih).format('DD MMM YYYY')})`, M + 2, y + 2, null, hasUni);
          y += 6;
          doc.setTextColor(220, 38, 38);
          _txt(doc, `En Yüksek:   ${(l.enPahali._lpgL100 || 0).toFixed(2)} L/100km  (${dayjs(l.enPahali.tarih).format('DD MMM YYYY')})`, M + 2, y + 2, null, hasUni);
          y += 8;
        }

        if (l.trend) {
          if (y > H - 25) { doc.addPage(); y = 20; }
          const renkT = l.trend.yon === 'up' ? [220, 38, 38] : (l.trend.yon === 'down' ? [5, 150, 105] : [100, 116, 139]);
          const okT = l.trend.yon === 'up' ? '↑' : (l.trend.yon === 'down' ? '↓' : '≈');
          doc.setFont(FONT, 'bold');
          doc.setFontSize(9.5);
          doc.setTextColor(...renkT);
          _txt(doc, `Son Tüketim Trendi:  ${l.trend.onceki.toFixed(2)} → ${l.trend.son.toFixed(2)} L/100km  (${okT} %${Math.abs(l.trend.yuzde).toFixed(1)})`, M + 2, y + 2, null, hasUni);
          y += 8;

        if (l.projeksiyon.aylikTL > 0) {
          if (y > H - 30) { doc.addPage(); y = 20; }
          doc.setFont(FONT, 'normal');
          doc.setFontSize(9);
          doc.setTextColor(100, 116, 139);
          _txt(doc, 'Aylık Projeksiyon (son 6 ay ortalaması)', M + 2, y + 2, null, hasUni);

          doc.setFont(FONT, 'bold');
          doc.setFontSize(10);
          doc.setTextColor(15, 23, 42);
          _txt(doc, `${Calc.fmt(l.projeksiyon.aylikTL)}  ·  ${l.projeksiyon.aylikLitre.toFixed(1)} L  ·  ${l.projeksiyon.aylikKm.toLocaleString('tr-TR')} km`, M + 2, y + 2, null, hasUni);
          y += 10;
        }
      }

      /* BENZİN — Sadece toplamlar */
      if (b.count > 0) {
        if (y > H - 40) { doc.addPage(); y = 20; }
        y += 4;
        _baslik(doc, 'BENZİN — TOPLAM TUTARLAR (KM HESABI YOK)', y, hasUni, FONT);

        doc.setFont(FONT, 'normal');
        doc.setFontSize(10);

        y += 6;

        if (b.fiyatTrend) {
          const renkTrend = b.fiyatTrend.yuzde > 0 ? [220, 38, 38] : [5, 150, 105];
          const ok = b.fiyatTrend.yuzde > 0 ? '↑' : '↓';
          doc.setFont(FONT, 'bold');
          doc.setFontSize(9);
          doc.setTextColor(...renkTrend);
          _txt(doc, `Fiyat Trendi:  ${b.fiyatTrend.ilk.toFixed(2)} → ${b.fiyatTrend.son.toFixed(2)} TL/L  (${ok} %${Math.abs(b.fiyatTrend.yuzde).toFixed(1)})`, M + 2, y + 2, null, hasUni);
          y += 6;
        }

        doc.setFont(FONT, 'italic');
        doc.setFontSize(8);
        doc.setTextColor(148, 163, 184);
        _txt(doc, 'Not: Benzin için KM/tüketim hesabı yapılmaz. Sadece litre ve TL toplamı tutulur.', M + 2, y + 2, null, hasUni);
        y += 10;
      }

      /* AYLIK LPG ÖZET */
      if (l.monthly.length > 0) {
        if (y > H - 60) { doc.addPage(); y = 20; }
        _baslik(doc, 'AYLIK LPG ÖZETİ', y, hasUni, FONT);
        y += 10;

        doc.setFillColor(248, 250, 252);
        doc.rect(M, y - 4, W - 2 * M, 6, 'F');
        doc.setFont(FONT, 'bold');
        doc.setFontSize(7.5);
        doc.setTextColor(100, 116, 139);
        _txt(doc, 'DÖNEM',   M + 3,   y, null, hasUni);
        _txt(doc, 'DOLUM',   M + 50,  y, null, hasUni);
        _txt(doc, 'LİTRE',   M + 70,  y, null, hasUni);
        _txt(doc, 'TUTAR',   M + 105, y, null, hasUni);
        _txt(doc, 'KM',      M + 140, y, null, hasUni);
        _txt(doc, 'L/100',   M + 165, y, null, hasUni);
        y += 5;

        l.monthly.slice(-12).forEach((m, idx) => {
          if (y > H - 20) { doc.addPage(); y = 20; }
          if (idx % 2 === 0) {
            doc.setFillColor(252, 253, 255);
            doc.rect(M, y - 4, W - 2 * M, 6.5, 'F');
          }
          doc.setFont(FONT, 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(15, 23, 42);
          _txt(doc, m.label, M + 3, y, null, hasUni);
          _txt(doc, String(m.lpgCount || 0), M + 52, y, null, hasUni);
          _txt(doc, m.lpgLitre.toFixed(1) + ' L', M + 70, y, null, hasUni);
          _txt(doc, Calc.fmt(m.lpgTL), M + 105, y, null, hasUni);
          _txt(doc, m.km.toLocaleString('tr-TR') + ' km', M + 140, y, null, hasUni);
          _txt(doc, m.avgL100 > 0 ? m.avgL100.toFixed(2) : '—', M + 165, y, null, hasUni);
          y += 6.5;
        });
        y += 8;
      }

      /* SON DOLUMLAR */
      if (stats.items.length > 0) {
        if (y > H - 60) { doc.addPage(); y = 20; }
        _baslik(doc, 'SON DOLUMLAR', y, hasUni, FONT);
        y += 10;

        doc.setFillColor(248, 250, 252);
        doc.rect(M, y - 4, W - 2 * M, 6, 'F');
        doc.setFont(FONT, 'bold');
        doc.setFontSize(7.5);
        doc.setTextColor(100, 116, 139);
        _txt(doc, 'TARİH',  M + 3,   y, null, hasUni);
        _txt(doc, 'KM',     M + 30,  y, null, hasUni);
        _txt(doc, 'YAKIT',  M + 70,  y, null, hasUni);
        _txt(doc, 'L/100',  M + 130, y, null, hasUni);
        _txt(doc, 'TUTAR',  W - M - 3, y, { align: 'right' }, hasUni);
        y += 5;

        stats.items.slice(-25).reverse().forEach((i, idx) => {
          if (y > H - 20) { doc.addPage(); y = 20; }
          if (idx % 2 === 0) {
            doc.setFillColor(252, 253, 255);
            doc.rect(M, y - 4, W - 2 * M, 7, 'F');
          }

          doc.setFont(FONT, 'bold');
          doc.setFontSize(8.5);
          doc.setTextColor(15, 23, 42);
          _txt(doc, dayjs(i.tarih).format('DD MMM YY'), M + 3, y, null, hasUni);

          doc.setFont(FONT, 'normal');
          doc.setTextColor(71, 85, 105);
          _txt(doc, i._km.toLocaleString('tr-TR') + ' km', M + 30, y, null, hasUni);

          const fuelParts = [];
          if (i._lpg.litre > 0)    fuelParts.push(`L:${i._lpg.litre.toFixed(1)}L`);
          if (i._benzin.litre > 0) fuelParts.push(`B:${i._benzin.litre.toFixed(1)}L`);
          doc.setTextColor(8, 145, 178);
          _txt(doc, fuelParts.join(' · '), M + 70, y, null, hasUni);

          doc.setTextColor(217, 119, 6);
          _txt(doc, i._lpgL100 ? i._lpgL100.toFixed(2) : '—', M + 130, y, null, hasUni);

          doc.setFont(FONT, 'bold');
          doc.setTextColor(185, 28, 28);
          _txt(doc, Calc.fmt(i._toplamTL), W - M - 3, y, { align: 'right' }, hasUni);
          y += 7;
        });
      }

      const total = doc.internal.getNumberOfPages();
      for (let i = 1; i <= total; i++) {
        doc.setPage(i);
        _footer(doc, i, total, hasUni, FONT);
      }

      doc.save(`ebhamani_akaryakit_${dayjs().format('YYYY-MM-DD_HHmm')}.pdf`);
      Swal.close();
      showToast('📄 PDF indirildi!');
    } catch (err) {
      console.error('[FuelPDF]', err);
      Swal.close();
      Swal.fire({ icon: 'error', title: 'PDF Hatası', text: err.message || 'Rapor oluşturulamadı' });
    }
  },

  /* ⛽ Akaryakıt Trend PNG */
  async exportFuelChartPNG() {
    try {
      showToast('📊 PNG hazırlanıyor...');
      const stats = Calc.fuelStats();
      if (stats.count === 0) { showToast('ℹ️ Kayıt yok'); return; }

      const l = stats.lpg;
      const b = stats.benzin;

      const W = 1200;
      let H = 400;  // dynamic later
      
      // ─── Helper'lar ───
      const _roundRect = (ctx, x, y, w, h, r, fill) => {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
      };
      
      // Estimate height
      const hasChart = Charts.instances[this._fuelChartId] || Charts.instances['fuelAnalysisChart'];
      H += 100; // summary card area
      H += 300; // detail card
      if (b.count > 0) H += 140;
      if (hasChart) H += 420;
      if (l.monthly.length > 0) H += 100 + Math.min(12, l.monthly.length) * 30;
      H += 80; // footer
      
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      
      const txt = (text, x, y, size, color, weight, align) => {
        ctx.font = `${weight || 400} ${size}px Inter, -apple-system, Arial, sans-serif`;
        ctx.fillStyle = color || '#0B1527';
        ctx.textAlign = align || 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(String(text || ''), x, y);
      };
      
      // ─── BG ───
      ctx.fillStyle = '#F7F8FA';
      ctx.fillRect(0, 0, W, H);
      
      // ─── HEADER ───
      const headerGrad = ctx.createLinearGradient(0, 0, W, 150);
      headerGrad.addColorStop(0, '#0891B2');
      headerGrad.addColorStop(1, '#0E7490');
      ctx.fillStyle = headerGrad;
      ctx.fillRect(0, 0, W, 150);
      
      txt('AKARYAKIT ANALİZİ', 60, 40, 36, '#FFFFFF', 800);
      txt('LPG Odaklı Tüketim & İstatistik Raporu', 60, 90, 18, '#CFEFFB', 500);
      txt(dayjs().format('DD MMMM YYYY · HH:mm'), W - 60, 90, 16, '#CFEFFB', 500, 'right');
      
      let y = 190;
      
      // ─── SUMMARY CARDS ───
      const cardW = (W - 120 - 30) / 4;
      const cardH = 100;
      const drawCard = (x, yy, label, value, accent) => {
        _roundRect(ctx, x, yy, cardW, cardH, 12, '#FFFFFF');
        ctx.fillStyle = accent;
        ctx.fillRect(x, yy, cardW, 6);
        txt(label, x + 20, yy + 25, 12, '#7B8A9E', 600);
        txt(value, x + 20, yy + 55, 22, accent, 800);
      };
      
      drawCard(60,              y, 'TOPLAM DOLUM', String(stats.count),                  '#0891B2');
      drawCard(60 + cardW + 10, y, 'LPG LİTRE',    l.totalLitre.toFixed(2) + ' L',        '#0891B2');
      drawCard(60 + (cardW + 10) * 2, y, 'LPG TUTAR', Calc.fmt(l.totalTL),               '#B91C1C');
      drawCard(60 + (cardW + 10) * 3, y, 'LPG L/100KM', l.avgL100 > 0 ? l.avgL100.toFixed(2) : '—', '#D97706');
      
      y += cardH + 20;
      
      // ─── LPG DETAYLARI ───
      _roundRect(ctx, 60, y, W - 120, 280, 16, '#FFFFFF');
      txt('LPG DETAYLI İSTATİSTİKLER', 90, y + 20, 20, '#0E7490', 800);
      
      const dY = y + 60;
      const dW = (W - 120 - 90) / 4;
      const dX = 90;
      
      const drawDetail = (x, yy, label, value, color) => {
        txt(label, x, yy, 12, '#7B8A9E', 600);
        txt(value, x, yy + 22, 20, color, 800);
      };
      
      drawDetail(dX,            dY, 'Ölçülen KM',    l.totalKm.toLocaleString('tr-TR') + ' km', '#2563EB');
      drawDetail(dX + dW,       dY, 'Ort. L/100km',  l.avgL100 > 0 ? l.avgL100.toFixed(2) : '—', '#D97706');
      drawDetail(dX + dW * 2,   dY, 'Ort. TL/km',    l.avgTlPerKm > 0 ? l.avgTlPerKm.toFixed(3) : '—', '#0891B2');
      drawDetail(dX + dW * 3,   dY, 'Ort. TL/L',     l.avgFiyat.toFixed(2),                       '#92400E');
      
      const s2Y = dY + 70;
      txt('Tüketim Dağılımı', dX, s2Y, 14, '#3D4A5C', 700);
      const s3Y = s2Y + 28;
      if (l.stats.count > 0) {
        txt(`Min: ${l.stats.min.toFixed(2)}`, dX, s3Y, 13, '#7B8A9E', 500);
        txt(`Medyan: ${l.stats.median.toFixed(2)}`, dX + 220, s3Y, 13, '#7B8A9E', 500);
        txt(`Max: ${l.stats.max.toFixed(2)}`, dX + 480, s3Y, 13, '#7B8A9E', 500);
        txt(`Std: ${l.stats.stdDev.toFixed(3)}`, dX + 720, s3Y, 13, '#7B8A9E', 500);
      }
      
      const s4Y = s3Y + 30;
      if (l.dolumAraligi) {
        txt(`Dolum Aralığı: Ort. ${l.dolumAraligi.ortalama.toFixed(0)} gün (min ${l.dolumAraligi.min}, max ${l.dolumAraligi.max})`, dX, s4Y, 13, '#7B8A9E', 500);
      }
      if (l.trend) {
        const ok = l.trend.yon === 'up' ? '↑' : '↓';
        const c = l.trend.yon === 'up' ? '#B91C1C' : '#047857';
        txt(`Son Trend: ${l.trend.onceki.toFixed(2)} → ${l.trend.son.toFixed(2)} (${ok} %${Math.abs(l.trend.yuzde).toFixed(1)})`, dX + 500, s4Y, 13, c, 700);
      }
      
      y += 300;
      
      // ─── BENZİN ───
      if (b.count > 0) {
        _roundRect(ctx, 60, y, W - 120, 120, 16, '#FFFFFF');
        txt('BENZİN — YARDIMCI YAKIT', 90, y + 20, 16, '#1E40AF', 800);
        txt(`${b.count} dolum · ${b.totalLitre.toFixed(2)} L · ${Calc.fmt(b.totalTL)} · Ort. ${b.avgFiyat.toFixed(2)} TL/L`, 90, y + 55, 14, '#3D4A5C', 500);
        txt('Not: Benzin için KM/tüketim hesabı yapılmaz.', 90, y + 85, 12, '#7B8A9E', 400);
        y += 140;
      }
      
      // ─── CHART ───
      if (hasChart) {
        _roundRect(ctx, 60, y, W - 120, 400, 16, '#FFFFFF');
        txt('LPG TÜKETİM TRENDİ', 90, y + 20, 16, '#0E7490', 800);
        try {
          const chartUrl = hasChart.toBase64Image('image/png', 1);
          const img = new Image();
          await new Promise((resolve) => {
            img.onload = resolve;
            img.onerror = resolve;
            img.src = chartUrl;
          });
          if (img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, 90, y + 60, W - 180, 320);
          }
        } catch (chartErr) {
          console.warn('[PNG] Chart draw failed:', chartErr);
        }
        y += 420;
      }
      
      // ─── AYLIK TABLO ───
      if (l.monthly.length > 0) {
        const rows = l.monthly.slice(-12);
        const tableH = 70 + rows.length * 30;
        _roundRect(ctx, 60, y, W - 120, tableH, 16, '#FFFFFF');
        txt('AYLIK LPG ÖZETİ', 90, y + 20, 16, '#0E7490', 800);
        
        txt('DÖNEM',  90,  y + 60, 11, '#7B8A9E', 700);
        txt('DOLUM',  400, y + 60, 11, '#7B8A9E', 700);
        txt('LİTRE',  550, y + 60, 11, '#7B8A9E', 700);
        txt('TUTAR',  750, y + 60, 11, '#7B8A9E', 700);
        txt('KM',     950, y + 60, 11, '#7B8A9E', 700);
        txt('L/100', 1100, y + 60, 11, '#7B8A9E', 700);
        
        rows.forEach((m, i) => {
          const ry = y + 90 + i * 30;
          txt(m.label,                             90, ry, 13, '#0B1527', 600);
          txt(String(m.lpgCount || 0),            400, ry, 13, '#3D4A5C', 500);
          txt(m.lpgLitre.toFixed(1) + ' L',       550, ry, 13, '#0891B2', 700);
          txt(Calc.fmt(m.lpgTL),                  750, ry, 13, '#B91C1C', 700);
          txt(m.km.toLocaleString('tr-TR') + ' km', 950, ry, 13, '#3D4A5C', 500);
          txt(m.avgL100 > 0 ? m.avgL100.toFixed(2) : '—', 1100, ry, 13, '#D97706', 700);
        });
        
        y += tableH + 20;
      }
      
      // ─── FOOTER ───
      ctx.fillStyle = '#7B8A9E';
      ctx.font = '500 14px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('EBHA Mani · Paranı gör, geleceğini planla', W / 2, H - 40);
      
      // ─── DOWNLOAD ───
      canvas.toBlob(blob => {
        if (!blob) { showToast('⚠️ PNG oluşturulamadı'); return; }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `akaryakit_analiz_${dayjs().format('YYYY-MM-DD_HHmm')}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('📊 PNG indirildi!');
      }, 'image/png');
      
    } catch (e) {
      console.error('[exportFuelChartPNG] Hata:', e);
      showToast('⚠️ PNG indirilemedi: ' + (e.message || 'Bilinmeyen hata'));
    }
  },
  /* ══════════════════════════════════════
     ARŞİV
  ══════════════════════════════════════ */
  async renderArsiv() {
    const keys = Object.keys(state.archives).sort().reverse();
    const tamamlananBorclar = state.borcalacaklar.filter(b => b.odendiMi);
    const tamamlananToplamTL = tamamlananBorclar.reduce(
      (s, b) => s + (Number(b.miktar) || 0) * Calc.birimFiyat(b.birim || 'tl'), 0
    );

    // ═══════════════════════════════════════════════════════
    // 🆕 KÜMÜLATİF SERVET + TREND HESABI
    // ═══════════════════════════════════════════════════════
    const allArchived = Object.entries(state.archives).map(([k, v]) => {
      const aG = (v.gelirler || []).reduce((s, x) => s + (Number(x.miktar) || 0), 0);
      const aGd = (v.giderler || []).reduce((s, x) => s + (Number(x.miktar) || 0), 0);
      return { key: k, net: aG - aGd, gelir: aG, gider: aGd };
    }).sort((a, b) => a.key.localeCompare(b.key));

    const kumulatif = allArchived.reduce((s, a) => s + a.net, 0);
    const ortalamaNet = allArchived.length ? kumulatif / allArchived.length : 0;
    const enIyiAy = allArchived.length ? allArchived.reduce((a, b) => a.net > b.net ? a : b) : null;
    const enKotuAy = allArchived.length ? allArchived.reduce((a, b) => a.net < b.net ? a : b) : null;
    const son3Trend = allArchived.slice(-3).map(a => a.net);

    const kumulatifHTML = allArchived.length === 0 ? '' : `
      <div class="card" style="background:linear-gradient(135deg, #0F2A5C 0%, #1E40AF 100%);color:#fff;padding:20px 18px;margin-bottom:14px;border:none;box-shadow:0 8px 24px rgba(15,42,92,.25);">
        <div style="font-size:10px;opacity:.75;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
          <span>💎 Toplam Birikim (Arşiv)</span>
          <span style="font-size:9px;">${allArchived.length} ay</span>
        </div>
        <div style="font-family:'Plus Jakarta Sans';font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1;">${Calc.fmt(kumulatif)}</div>
        <div style="display:flex;gap:14px;margin-top:12px;font-size:11px;opacity:.9;flex-wrap:wrap;">
          <span>📈 Ort. <strong>${Calc.fmt(ortalamaNet)}</strong>/ay</span>
          ${enIyiAy ? `<span>🏆 ${SalaryMonth.shortLabel(enIyiAy.key)}</span>` : ''}
          ${enKotuAy && enKotuAy.net < 0 ? `<span>⚠️ ${SalaryMonth.shortLabel(enKotuAy.key)}</span>` : ''}
        </div>
        ${son3Trend.length >= 2 ? `
          <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2);font-size:10.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="opacity:.7;">Son ${son3Trend.length} ay:</span>
            ${son3Trend.map((v, i) => `<strong style="color:${v>=0?'#34D399':'#F87171'};">${v>=0?'+':''}${Calc.fmt(v)}${i<son3Trend.length-1?' →':''}</strong>`).join(' ')}
            ${(() => {
              if (son3Trend.length < 2) return '';
              const yon = son3Trend[son3Trend.length - 1] - son3Trend[0];
              const ok = yon >= 0 ? '↑' : '↓';
              const renk = yon >= 0 ? '#34D399' : '#F87171';
              return `<span style="margin-left:auto;color:${renk};font-weight:800;font-size:14px;">${ok}</span>`;
            })()}
          </div>
        ` : ''}
      </div>
    `;

    // ═══════════════════════════════════════════════════════
    // 🆕 KATEGORİ TREND GRAFİĞİ HESABI (BLOK 8)
    // ═══════════════════════════════════════════════════════
    const arsivKategoriTrend = (() => {
      const months = Object.keys(state.archives).sort().slice(-12);
      if (months.length < 2) return null;

      const data = [];
      const allKats = new Set();

      months.forEach(k => {
        const a = state.archives[k];
        const kats = {};
        (a.giderler || []).forEach(x => {
          const kat = x.kategori || 'Diğer';
          kats[kat] = (kats[kat] || 0) + (Number(x.miktar) || 0);
          allKats.add(kat);
        });
        data.push({ label: SalaryMonth.shortLabel(k), ...kats });
      });

      const toplamlar = {};
      allKats.forEach(k => {
        toplamlar[k] = data.reduce((s, d) => s + (Number(d[k]) || 0), 0);
      });
      const topKats = [...allKats].sort((a, b) => toplamlar[b] - toplamlar[a]).slice(0, 5);

      return { data, kategoriler: topKats };
    })();

    const kategoriTrendHTML = arsivKategoriTrend ? `
      <div class="card">
        <div class="section-header">
          <span class="section-title">📊 Kategori Trendleri (Son 12 Ay)</span>
          <button onclick="App.downloadChart('arsivKatChart', 'Arsiv_Kategori_Trend')"
                  style="background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;" title="PNG İndir">
            <i class="fas fa-download"></i>
          </button>
        </div>
        <div class="chart-wrap" style="height:220px;"><canvas id="arsivKatChart"></canvas></div>
      </div>
    ` : '';

    /* Yıla göre grupla */
    const byYear = {};
    keys.forEach(k => {
      const y = SalaryMonth.yearOf(k);
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push(k);
    });
    const years = Object.keys(byYear).sort().reverse();

    /* Açık yıllar */
    if (!this._archiveOpenYears) {
      this._archiveOpenYears = new Set(years.length ? [years[0]] : []);
    }

    /* Aktif dönem & sayaç */
    const currentKey = SalaryMonth.currentKey();
    const currentRange = SalaryMonth.range(currentKey);
    const daysLeft = SalaryMonth.daysUntilArchive();
    const nextDate = SalaryMonth.nextArchiveDate();
    const pct = SalaryMonth.progressPct(currentKey);
    const overdue = SalaryMonth.isOverdue();
    const prevKey = SalaryMonth.previousKey();
    const prevArchived = !!state.archives[prevKey];
    const prevHasData = SalaryMonth.hasDataInRange(SalaryMonth.range(prevKey));
    const pendingMonths = SalaryMonth.pendingMonths();

    const curGelir = state.gelirler.filter(g => g.tarih >= currentRange.start && g.tarih <= currentRange.end).reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const curGider = state.giderler.filter(g => g.tarih >= currentRange.start && g.tarih <= currentRange.end).reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const curNet = curGelir - curGider;

    const countdownColor = overdue ? 'var(--danger)' : (daysLeft <= 3 ? 'var(--warning)' : 'var(--primary)');
    const countdownBg = overdue ? 'var(--danger-light)' : (daysLeft <= 3 ? 'var(--warning-light)' : 'var(--primary-light)');
    const countdownIcon = overdue ? 'fa-exclamation-triangle' : 'fa-hourglass-half';
    const countdownText = overdue
      ? `Arşiv gecikmiş! ${SalaryMonth.shortLabel(prevKey)} bekliyor`

            const aG = Array.isArray(a.gelirler) ? a.gelirler : [];
            const aGd = Array.isArray(a.giderler) ? a.giderler : [];
            const g = aG.reduce((ss, x) => ss + (Number(x.miktar) || 0), 0);

            const aG = Array.isArray(a.gelirler) ? a.gelirler : [];

                      const gider = aGd.reduce((s, g) => s + (Number(g.miktar) || 0), 0);

                      const logCnt = Array.isArray(a.loglar) ? a.loglar.length : 0;
                      const cnt = aG.length + aGd.length;
                      return `<div class="archive-card" style="position:relative;" onclick="App.showArchiveDetail('${k}')">
                        <button onclick="event.stopPropagation();App.deleteArchive('${k}')"
                                title="Arşivi Sil"
                                style="position:absolute;top:6px;right:6px;background:var(--danger-light);color:var(--danger);
                                       border:1px solid var(--danger);width:22px;height:22px;border-radius:6px;cursor:pointer;

              <span style="color:var(--text3);">${b.stats.islemSayisi} işlem</span>

              <button onclick="App.downloadBackup(${b.id})" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;"><i class="fas fa-download"></i></button>
            </div>`).join('') || '<div class="empty-state" style="padding:20px;"><i class="fas fa-cloud-upload-alt"></i><p>Henüz yedek yok</p></div>'}

    /* Tamamlanan borçları render et */

              </div>

                <div style="color:var(--accent);font-weight:700;margin-bottom:2px;">✅ Tamamlandı</div>
                <div>${odemeTarihi}</div>

    // 🆕 Kategori trend grafiğini çiz (HTML basıldıktan sonra)

  },

  /* Yıl accordion aç/kapa */
  _toggleArchiveYear(y) {
    if (!this._archiveOpenYears) this._archiveOpenYears = new Set();
    if (this._archiveOpenYears.has(y)) this._archiveOpenYears.delete(y);
    else this._archiveOpenYears.add(y);
    this.renderArsiv();
  },

  /* Manuel arşivleme — onay dialog + işlem */
  async manualArchive(targetKey) {
    /* 🆕 Çift tıklama koruması */
    if (this._archivingLock) {
      showToast('⏳ Arşivleme devam ediyor...');
      return;
    }
    this._archivingLock = true;
    try {
      return await this._manualArchiveInternal(targetKey);
    } finally {
      this._archivingLock = false;
    }
  },

  async _manualArchiveInternal(targetKey) {
    if (!targetKey) {
      const prevKey = SalaryMonth.previousKey();
      const curKey = SalaryMonth.currentKey();
      const prevArchived = !!state.archives[prevKey];
      const prevHasData = SalaryMonth.hasDataInRange(SalaryMonth.range(prevKey));
      const curHasData = SalaryMonth.hasDataInRange(SalaryMonth.range(curKey));

      if (!prevArchived && prevHasData) targetKey = prevKey;
      else if (prevArchived && curHasData) targetKey = curKey;
      else {
        Swal.fire({ icon: 'info', title: 'Bilgi', text: 'Arşivlenecek dönem bulunamadı.' });
        return;
      }
    }

    const range = SalaryMonth.range(targetKey);
    const isEarly = targetKey === SalaryMonth.currentKey();

    const { isConfirmed } = await Swal.fire({
      title: 'Dönemi Arşivle',
      html: `<div style="text-align:left;">
        <p>Aşağıdaki maaş dönemi arşivlenecek:</p>
        <div style="margin:12px 0;padding:14px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Dönem</div>
          <div style="font-family:'Plus Jakarta Sans';font-size:16px;font-weight:800;">${SalaryMonth.shortLabel(targetKey)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px;">${range.start} → ${range.end}</div>
        </div>
        ${isEarly ? `
          <div style="margin-top:10px;padding:10px;background:#FEF3C7;border-radius:8px;font-size:12px;color:#92400E;">
            ⚠️ <strong>Aktif dönemi</strong> erken arşivliyorsunuz. Sonraki günlerde eklenen işlemler ana listede kalır.
          </div>` : ''}
        <p style="font-size:12px;color:var(--text3);margin-top:12px;">Borç/Alacak kayıtları etkilenmeyecek.</p>
      </div>`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Evet, Arşivle',
      cancelButtonText: 'İptal',
      width: Math.min(520, window.innerWidth - 24)
    });
    if (!isConfirmed) return;

    const ok = await CRUD.manualArchive(targetKey);
    if (ok) {
      /* Yeni yılı accordion'da otomatik aç */
      const newYear = SalaryMonth.yearOf(targetKey);
      if (!this._archiveOpenYears) this._archiveOpenYears = new Set();
      this._archiveOpenYears.add(newYear);
      await this.renderArsiv();
      if (this.currentPage === 'dashboard') await this.renderDashboard();

      // 🆕 AYLIK RİTÜEL MODAL — "Bu ay nasıl geçti?"
      await this._showMonthlyRitual(targetKey);
    }
  },

  /* 🆕 AYLIK RİTÜEL MODAL — Arşivleme sonrası insight kartı */
  async _showMonthlyRitual(monthKey) {
    const a = state.archives[monthKey];
    if (!a) return;

    const aGelirler = Array.isArray(a.gelirler) ? a.gelirler : [];
    const aGiderler = Array.isArray(a.giderler) ? a.giderler : [];
    const buGelir = aGelirler.reduce((s, x) => s + (Number(x.miktar) || 0), 0);
    const buGider = aGiderler.reduce((s, x) => s + (Number(x.miktar) || 0), 0);
    const buNet = buGelir - buGider;

    // Önceki ay (varsa)
    const sortedArchives = Object.keys(state.archives).sort();
    const idx = sortedArchives.indexOf(monthKey);
    const prevKey = idx > 0 ? sortedArchives[idx - 1] : null;
    const prevArchive = prevKey ? state.archives[prevKey] : null;
    const prevGelir = prevArchive ? (prevArchive.gelirler || []).reduce((s, x) => s + (Number(x.miktar) || 0), 0) : 0;
    const prevGider = prevArchive ? (prevArchive.giderler || []).reduce((s, x) => s + (Number(x.miktar) || 0), 0) : 0;
    const prevNet = prevGelir - prevGider;

    // Kategori değişim
    const buKats = {};
    aGiderler.forEach(x => { const k = x.kategori || 'Diğer'; buKats[k] = (buKats[k] || 0) + (Number(x.miktar) || 0); });
    const prevKats = prevArchive ? (prevArchive.giderler || []).reduce((m, x) => {
      const k = x.kategori || 'Diğer';
      m[k] = (m[k] || 0) + (Number(x.miktar) || 0);
      return m;
    }, {}) : {};

    const farkKats = Object.entries(buKats)
      .map(([k, v]) => {
        const prev = prevKats[k] || 0;
        const diff = prev > 0 ? ((v - prev) / prev) * 100 : null;
        return { kat: k, bu: v, prev, diff };
      })
      .filter(x => x.diff !== null && Math.abs(x.diff) >= 15)
      .sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff))
      .slice(0, 3);

    const netFark = prevArchive ? (buNet - prevNet) : 0;
    const netOk = netFark >= 0;

    const result = await Swal.fire({
      title: '🎉 ' + SalaryMonth.shortLabel(monthKey) + ' Arşivlendi',
      html: `
        <div style="text-align:left;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
            <div class="archive-stat-card" style="text-align:center;">
              <div class="archive-stat-label">Net Bakiye</div>
              <div class="archive-stat-value ${buNet >= 0 ? 'green' : 'red'}" style="font-size:15px;">${Calc.fmt(buNet)}</div>
            </div>
            <div class="archive-stat-card" style="text-align:center;">
              <div class="archive-stat-label">${prevArchive ? 'Geçen Aya Göre' : 'Durum'}</div>
              <div class="archive-stat-value ${netOk ? 'green' : 'red'}" style="font-size:13px;">
                ${prevArchive
                  ? (Math.abs(netFark) < 0.01 ? '≈ Aynı' : (netOk ? '↑ ' : '↓ ') + Calc.fmt(Math.abs(netFark)))
                  : '🎯 İlk arşiv'}
              </div>
            </div>
          </div>

          ${farkKats.length > 0 ? `
            <div style="padding:10px;background:var(--surface2);border-radius:8px;margin-bottom:10px;">
              <div style="font-size:11px;font-weight:700;margin-bottom:6px;color:var(--text2);">📊 En Çok Değişen Kategoriler</div>
              ${farkKats.map(f => `
                <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px dashed var(--border);">
                  <span>${UI.escHtml(f.kat)}</span>
                  <span style="color:${f.diff > 0 ? 'var(--danger)' : 'var(--accent)'};font-weight:700;">
                    ${f.diff > 0 ? '↑' : '↓'} %${Math.abs(f.diff).toFixed(0)}
                  </span>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <div style="font-size:11px;color:var(--text3);text-align:center;padding:8px 0;border-top:1px solid var(--border);margin-top:8px;">
            ${aGelirler.length} gelir · ${aGiderler.length} gider
            ${a.pdfDataUrl ? ' · 📄 PDF hazır' : ''}
          </div>
        </div>
      `,
      confirmButtonText: a.pdfDataUrl ? '📄 PDF İndir' : 'Tamam',
      showCancelButton: !!a.pdfDataUrl,
      cancelButtonText: 'Kapat',
      width: Math.min(460, window.innerWidth - 24)
    });

    if (result.isConfirmed && a.pdfDataUrl) {
      this.downloadArchivePDF(monthKey);
    }
  },

  _logFilterCat: 'tum',
