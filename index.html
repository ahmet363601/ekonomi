  quickFilter(t) {
    const now = dayjs();
    const salaryRange = SalaryMonth.range(SalaryMonth.currentKey());
    const map = {
      bugun: [now.format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      hafta: [now.subtract(7,'day').format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      ay:    [salaryRange.start, salaryRange.end],
      '3ay': [now.subtract(3,'month').format('YYYY-MM-DD'), now.format('YYYY-MM-DD')],
      '6ay': [now.subtract(6,'month').format('YYYY-MM-DD'), now.format('YYYY-MM-DD')]
    };
    if (map[t]) {
      const rStart = document.getElementById('rStart');
      const rEnd   = document.getElementById('rEnd');
      if (rStart) rStart.value = map[t][0];
      if (rEnd)   rEnd.value   = map[t][1];
      this.applyRapor();
    }
  },

  async applyRapor() {
    const start  = document.getElementById('rStart')?.value || this._raporStart;
    const end    = document.getElementById('rEnd')?.value   || this._raporEnd;
    this._raporStart = start; this._raporEnd = end;
    const f      = { start, end };
    const gelir  = Calc.toplamGelir(f);
    const gider  = Calc.toplamGider(f);
    const bakiye = gelir - gider;
    const katG   = Calc.kategoriGiderler(f);
    const topKat = Object.entries(katG).sort((a,b)=>b[1]-a[1])[0];
    const gunFark= Math.max(1, dayjs(end).diff(dayjs(start),'day') + 1);
    const avgGun = gider / gunFark;

    const statsEl = document.getElementById('raporStats');
    if (statsEl) statsEl.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="card-label">Toplam Gelir</div><div class="stat-amount green">${Calc.fmt(gelir)}</div></div>
        <div class="stat-card"><div class="card-label">Toplam Gider</div><div class="stat-amount red">${Calc.fmt(gider)}</div></div>
        <div class="stat-card"><div class="card-label">Net Bakiye</div><div class="stat-amount ${bakiye>=0?'blue':'red'}">${Calc.fmt(bakiye)}</div></div>
        <div class="stat-card"><div class="card-label">Günlük Ort. Gider</div><div class="stat-amount amber">${Calc.fmt(avgGun)}</div></div>
      </div>
      ${topKat ? `<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-bottom:12px;">
        <div><div class="card-label">En Yüksek Kategori</div><div style="font-family:'Plus Jakarta Sans';font-size:16px;font-weight:800;">${UI.escHtml(topKat[0])}</div></div>
        <div style="font-family:'Plus Jakarta Sans';font-size:20px;font-weight:900;color:var(--danger);">${Calc.fmt(topKat[1])}</div>
      </div>` : ''}`;

    const pieCard = document.getElementById('raporChartCard');
    if (Object.keys(katG).length && pieCard) {
      pieCard.style.display = '';
      requestAnimationFrame(() => Charts.donut('raporPieChart', katG));
    }
    requestAnimationFrame(() => Charts.line('raporLineChart', Calc.aylikTrend(6)));

    const txData = [
      ...state.gelirler.filter(g=>g.tarih>=start&&g.tarih<=end).map(g=>({...g,_tip:'gelir'})),
      ...state.giderler.filter(g=>g.tarih>=start&&g.tarih<=end).map(g=>({...g,_tip:'gider'}))
    ].sort((a,b)=>b.tarih>a.tarih?1:-1);

    const txEl = document.getElementById('raporTxList');
    if (txEl) txEl.innerHTML = txData.length
      ? `<div class="card">
          <div class="section-header"><span class="section-title">İşlem Listesi (${txData.length})</span></div>
          <div style="max-height:380px;overflow-y:auto;">
            ${txData.slice(0,50).map(i=>UI.txItem(i,`App.showTransactionDetail(${i.id},'${i._tip}')`)).join('')}
          </div>
          ${txData.length>50?`<p style="text-align:center;font-size:11px;color:var(--text3);padding:8px 0;">... ve ${txData.length-50} işlem daha</p>`:''}
        </div>`
      : '';
  },

  /* ══════════════════════════════════════
     ARŞİV
  ══════════════════════════════════════ */
  async renderArsiv() {
    const keys = Object.keys(state.archives).sort().reverse();
    const tamamlananBorclar = state.borcalacaklar.filter(b => b.odendiMi);
    const tamamlananToplamTL = tamamlananBorclar.reduce(
      (s, b) => s + (Number(b.miktar) || 0) * Calc.birimFiyat(b.birim || 'tl'), 0
    );

    /* Yıla göre grupla */
    const byYear = {};
    keys.forEach(k => {
      const y = SalaryMonth.yearOf(k);
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push(k);
    });
    const years = Object.keys(byYear).sort().reverse();

    /* Açık yıllar */
    if (!this._archiveOpenYears) {
      this._archiveOpenYears = new Set(years.length ? [years[0]] : []);
    }

    /* Aktif dönem & sayaç */
    const currentKey = SalaryMonth.currentKey();
    const currentRange = SalaryMonth.range(currentKey);
    const daysLeft = SalaryMonth.daysUntilArchive();
    const nextDate = SalaryMonth.nextArchiveDate();
    const pct = SalaryMonth.progressPct(currentKey);
    const overdue = SalaryMonth.isOverdue();
    const prevKey = SalaryMonth.previousKey();
    const prevArchived = !!state.archives[prevKey];
    const prevHasData = SalaryMonth.hasDataInRange(SalaryMonth.range(prevKey));
    const pendingMonths = SalaryMonth.pendingMonths();

    const curGelir = state.gelirler.filter(g => g.tarih >= currentRange.start && g.tarih <= currentRange.end).reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const curGider = state.giderler.filter(g => g.tarih >= currentRange.start && g.tarih <= currentRange.end).reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const curNet = curGelir - curGider;

    const countdownColor = overdue ? 'var(--danger)' : (daysLeft <= 3 ? 'var(--warning)' : 'var(--primary)');
    const countdownBg = overdue ? 'var(--danger-light)' : (daysLeft <= 3 ? 'var(--warning-light)' : 'var(--primary-light)');
    const countdownIcon = overdue ? 'fa-exclamation-triangle' : 'fa-hourglass-half';
    const countdownText = overdue
      ? `Arşiv gecikmiş! ${SalaryMonth.shortLabel(prevKey)} bekliyor`
      : (daysLeft === 0 ? 'Bugün arşiv günü!' : `${daysLeft} gün sonra arşiv`);

    document.getElementById('view').innerHTML = `<div class="page-in">

      <!-- ═══ AKTİF DÖNEM + SAYAÇ ═══ -->
      <div class="card" style="background:linear-gradient(135deg, #EFF6FF, #FFFFFF);border-left:4px solid ${countdownColor};">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <i class="fas fa-calendar-check" style="color:var(--primary);font-size:16px;"></i>
          <span style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;">Aktif Maaş Dönemi</span>
        </div>

        <div style="font-family:'Plus Jakarta Sans';font-size:20px;font-weight:900;color:var(--text);margin-bottom:4px;">
          ${SalaryMonth.shortLabel(currentKey)}
        </div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:12px;">
          ${currentRange.start} → ${currentRange.end}
        </div>

        <div style="padding:12px;background:${countdownBg};border-radius:10px;margin-bottom:10px;border:1px solid ${countdownColor}40;">
          <div style="display:flex;align-items:center;gap:8px;">
            <i class="fas ${countdownIcon}" style="color:${countdownColor};font-size:18px;"></i>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:800;color:${countdownColor};">${countdownText}</div>
              <div style="font-size:10.5px;color:var(--text3);margin-top:2px;">
                Sonraki arşiv: ${dayjs(nextDate).format('DD MMMM YYYY')}
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:4px;">
          <span>Dönem ilerlemesi</span>
          <span>%${pct}</span>
        </div>
        <div class="progress-track" style="margin:0 0 12px 0;">
          <div class="progress-bar" style="width:${pct}%;background:${countdownColor};"></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <div style="text-align:center;padding:8px;background:var(--accent-light);border-radius:8px;">
            <div style="font-size:9px;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:2px;">Gelir</div>
            <div style="font-family:'Plus Jakarta Sans';font-size:11px;font-weight:800;color:var(--accent);">${Calc.fmt(curGelir)}</div>
          </div>
          <div style="text-align:center;padding:8px;background:var(--danger-light);border-radius:8px;">
            <div style="font-size:9px;color:var(--danger);text-transform:uppercase;font-weight:700;margin-bottom:2px;">Gider</div>
            <div style="font-family:'Plus Jakarta Sans';font-size:11px;font-weight:800;color:var(--danger);">${Calc.fmt(curGider)}</div>
          </div>
          <div style="text-align:center;padding:8px;background:var(--surface2);border-radius:8px;">
            <div style="font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:2px;">Net</div>
            <div style="font-family:'Plus Jakarta Sans';font-size:11px;font-weight:800;color:${curNet>=0?'var(--accent)':'var(--danger)'};">${Calc.fmt(curNet)}</div>
          </div>
        </div>
      </div>

      <!-- ═══ ARŞİV BUTONU ═══ -->
      ${(() => {
        /* 1. Önceki dönem arşivlenmemişse → birincil buton */
        if (!prevArchived && prevHasData) {
          return `<button class="btn ${overdue ? 'btn-danger' : 'btn-primary'} btn-full" onclick="App.manualArchive()" style="margin-bottom:10px;">
            <i class="fas fa-archive"></i>
            ${overdue
              ? `Gecikmiş Arşiv: ${SalaryMonth.shortLabel(prevKey)}`
              : `${SalaryMonth.shortLabel(prevKey)} Dönemini Arşivle`}
          </button>`;
        }

        /* 2. Aktif dönem son 5 gün içindeyse → belirgin buton */
        if (daysLeft <= 5 && daysLeft > 0 && (curGelir > 0 || curGider > 0)) {
          const isLastDay = daysLeft === 1;
          return `<button class="btn ${isLastDay ? 'btn-danger' : 'btn-amber'} btn-full" onclick="App.manualArchive('${currentKey}')" style="margin-bottom:10px;">
            <i class="fas fa-${isLastDay ? 'exclamation-triangle' : 'archive'}"></i>
            ${isLastDay
              ? `Yarın Arşiv Günü — ${SalaryMonth.shortLabel(currentKey)} Arşivle`
              : `${SalaryMonth.shortLabel(currentKey)} Arşivle — ${daysLeft} gün kaldı`}
          </button>`;
        }

        /* 3. Aktif dönem için küçük "erken arşivle" seçeneği (her zaman) */
        /* 3. Aktif dönem için "erken arşivle" — veri olsa da olmasa da göster */
        const currentHasData = curGelir > 0 || curGider > 0;
        return `<button class="btn btn-ghost btn-full" onclick="App.manualArchive('${currentKey}')"
                        style="margin-bottom:10px;font-size:12px;border-style:dashed;">
          <i class="fas fa-archive"></i>
          ${currentHasData
            ? `${SalaryMonth.shortLabel(currentKey)} Dönemini Erken Arşivle`
            : `${SalaryMonth.shortLabel(currentKey)} Dönemini Arşivle (boş)`}
          <span style="color:var(--text3);font-weight:500;">(${daysLeft} gün kaldı)</span>
        </button>`;
      })()}

      <!-- ═══ BEKLEYENLER ═══ -->
      ${pendingMonths.length > 0 ? `
        <div class="card" style="border-left:4px solid var(--warning);">
          <div class="section-header">
            <span class="section-title" style="display:flex;align-items:center;gap:8px;">
              <i class="fas fa-clock" style="color:var(--warning);"></i>
              Arşivlenmeyi Bekleyen
            </span>
            <span class="badge badge-amber">${pendingMonths.length}</span>
          </div>
          ${pendingMonths.map(k => {
            const r = SalaryMonth.range(k);
            const g = state.gelirler.filter(x => x.tarih >= r.start && x.tarih <= r.end).length;
            const gd = state.giderler.filter(x => x.tarih >= r.start && x.tarih <= r.end).length;
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--surface2);">
              <div>
                <div style="font-size:13px;font-weight:700;">${SalaryMonth.shortLabel(k)}</div>
                <div style="font-size:10.5px;color:var(--text3);margin-top:2px;">${g} gelir · ${gd} gider</div>
              </div>
              <button onclick="App.manualArchive('${k}')" class="btn btn-sm btn-primary"><i class="fas fa-archive"></i> Arşivle</button>
            </div>`;
          }).join('')}
        </div>
      ` : ''}

      <!-- ═══ İSTATİSTİK ═══ -->
      <div class="stat-grid">
        <div class="stat-card"><div class="card-label">Arşivlenen Dönem</div><div class="stat-amount blue">${keys.length}</div></div>
        <div class="stat-card"><div class="card-label">Yedek Sayısı</div><div class="stat-amount amber">${state.backups.length}</div></div>
      </div>

      <!-- ═══ TAMAMLANAN BORÇLAR ═══ -->
      ${tamamlananBorclar.length > 0 ? `
        <div class="card" style="border-left:4px solid var(--accent);">
          <div class="section-header">
            <span class="section-title" style="display:flex;align-items:center;gap:8px;">
              <i class="fas fa-check-circle" style="color:var(--accent);"></i>
              Tamamlanan Borç & Alacak
            </span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:11px;color:var(--text3);font-weight:600;">${Calc.fmt(tamamlananToplamTL)}</span>
              <span class="badge badge-success">${tamamlananBorclar.length}</span>
            </div>
          </div>
          <div id="tamamlananBorcList"></div>
        </div>
      ` : ''}

      <!-- ═══ YIL GRUPLU ARŞİV ═══ -->
      ${years.length === 0
        ? UI.empty('Henüz arşiv yok.')
        : years.map(y => {
            const yearKeys = byYear[y];
            const isOpen = this._archiveOpenYears.has(y);
            const yearTotal = yearKeys.reduce((s, k) => {
            const a = state.archives[k] || {};
            const aG = Array.isArray(a.gelirler) ? a.gelirler : [];
            const aGd = Array.isArray(a.giderler) ? a.giderler : [];
            const g = aG.reduce((ss, x) => ss + (Number(x.miktar) || 0), 0);
            const gd = aGd.reduce((ss, x) => ss + (Number(x.miktar) || 0), 0);
            return s + (g - gd);
          }, 0);
            const totalCount = yearKeys.reduce((s, k) => {
              const a = state.archives[k] || {};
              const aG = Array.isArray(a.gelirler) ? a.gelirler : [];
              const aGd = Array.isArray(a.giderler) ? a.giderler : [];
              return s + aG.length + aGd.length;
            }, 0);

            return `<div class="card" style="margin-bottom:12px;">
              <!-- Yıl başlığı (tıklanabilir) -->
              <div onclick="App._toggleArchiveYear('${y}')" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:4px 0;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <i class="fas fa-chevron-${isOpen ? 'down' : 'right'}" style="color:var(--primary);font-size:14px;width:16px;"></i>
                  <div>
                    <div style="font-family:'Plus Jakarta Sans';font-size:18px;font-weight:900;color:var(--text);">${y}</div>
                    <div style="font-size:11px;color:var(--text3);margin-top:2px;">
                      ${yearKeys.length} dönem · ${totalCount} işlem
                    </div>
                  </div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700;">Net</div>
                  <div style="font-family:'Plus Jakarta Sans';font-size:15px;font-weight:800;color:${yearTotal>=0?'var(--accent)':'var(--danger)'};">${Calc.fmt(yearTotal)}</div>
                </div>
              </div>

              ${isOpen ? `
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
                  <div class="archive-grid">
                    ${yearKeys.map(k => {
                      const a = state.archives[k] || {};
                      const aG = Array.isArray(a.gelirler) ? a.gelirler : [];
                      const aGd = Array.isArray(a.giderler) ? a.giderler : [];
                      const gelir = aG.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
                      const gider = aGd.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
                      const net = gelir - gider;
                      const logCnt = Array.isArray(a.loglar) ? a.loglar.length : 0;
                      const cnt = aG.length + aGd.length;
                      return `<div class="archive-card" style="position:relative;" onclick="App.showArchiveDetail('${k}')">
                        <button onclick="event.stopPropagation();App.deleteArchive('${k}')"
                                title="Arşivi Sil"
                                style="position:absolute;top:6px;right:6px;background:var(--danger-light);color:var(--danger);
                                       border:1px solid var(--danger);width:22px;height:22px;border-radius:6px;cursor:pointer;
                                       font-size:10px;display:flex;align-items:center;justify-content:center;padding:0;z-index:2;">
                          <i class="fas fa-trash"></i>
                        </button>
                        <div class="archive-month" style="font-size:12px;">${SalaryMonth.shortLabel(k)}</div>
                        <div style="font-size:9px;color:var(--text3);margin-bottom:4px;">${SalaryMonth.range(k).start.substring(5)} → ${SalaryMonth.range(k).end.substring(5)}</div>
                        <div class="archive-amount" style="color:${net>=0?'var(--accent)':'var(--danger)'};">${Calc.fmt(net)}</div>
                        <div class="archive-count">${cnt} işlem${logCnt ? ` · ${logCnt} log` : ''}</div>
                        <div style="margin-top:6px;font-size:10px;display:flex;gap:8px;">
                          <span style="color:var(--accent);">↑ ${Calc.fmt(gelir)}</span>
                          <span style="color:var(--danger);">↓ ${Calc.fmt(gider)}</span>
                        </div>
                      </div>`;
                    }).join('')}
                  </div>
                </div>
              ` : ''}
            </div>`;
          }).join('')
      }
      <!-- ═══ ÜRETİLEN RAPORLAR ═══ -->
      ${(() => {
        const pdfList = keys
          .filter(k => state.archives[k] && state.archives[k].pdfDataUrl)
          .map(k => ({
            key: k,
            label: SalaryMonth.shortLabel(k),
            generatedAt: state.archives[k].pdfGeneratedAt || state.archives[k].archivedAt,
            range: state.archives[k].salaryMonthRange || SalaryMonth.range(k)
          }))
          .sort((a, b) => (b.generatedAt || '') > (a.generatedAt || '') ? 1 : -1);

        if (!pdfList.length) return '';

        return `<div class="card" style="border-left:4px solid var(--info);">
          <div class="section-header">
            <span class="section-title" style="display:flex;align-items:center;gap:8px;">
              <i class="fas fa-file-pdf" style="color:var(--info);"></i>
              Üretilen Raporlar
            </span>
            <span class="badge badge-cyan">${pdfList.length}</span>
          </div>
          <div style="max-height:320px;overflow-y:auto;">
            ${pdfList.map(r => `
              <div onclick="App.downloadArchivePDF('${r.key}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--surface2);cursor:pointer;transition:var(--transition);" onmouseover="this.style.borderColor='var(--primary)';this.style.background='var(--primary-light)';" onmouseout="this.style.borderColor='var(--border)';this.style.background='var(--surface2)';">
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
                    <i class="fas fa-file-pdf" style="color:#DC2626;font-size:12px;"></i>
                    <span style="font-size:13px;font-weight:700;color:var(--text);">${r.label}</span>
                  </div>
                  <div style="font-size:10.5px;color:var(--text3);">${dayjs(r.generatedAt).format('DD MMM YYYY HH:mm')} · ${r.range.start.substring(5)} → ${r.range.end.substring(5)}</div>
                </div>
                <i class="fas fa-download" style="color:var(--primary);font-size:14px;flex-shrink:0;margin-left:8px;"></i>
              </div>
            `).join('')}
          </div>
        </div>`;
      })()}

      <!-- ═══ YEDEK GEÇMİŞİ ═══ -->
      <!-- ═══ YEDEK GEÇMİŞİ ═══ -->
      <div class="card">
        <div class="section-header"><span class="section-title">📋 Yedek Geçmişi</span></div>
        <div style="max-height:260px;overflow-y:auto;">
          ${state.backups.slice(0,15).map(b => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;">
              <span style="color:var(--text2);">${dayjs(b.createdAt).format('DD MMM HH:mm')}</span>
              <span style="color:var(--text3);">${b.stats.islemSayisi} işlem</span>
              <span class="badge ${b.type==='auto'?'badge-blue':'badge-amber'}">${b.type==='auto'?'Otomatik':'Manuel'}</span>
              <button onclick="App.downloadBackup(${b.id})" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:13px;"><i class="fas fa-download"></i></button>
            </div>`).join('') || '<div class="empty-state" style="padding:20px;"><i class="fas fa-cloud-upload-alt"></i><p>Henüz yedek yok</p></div>'}
        </div>
      </div>
    </div>`;

    /* Tamamlanan borçları render et */
    if (tamamlananBorclar.length > 0) {
      const el = document.getElementById('tamamlananBorcList');
      if (el) {
        el.innerHTML = tamamlananBorclar
          .sort((a, b) => (b.odemeTarihi || '') > (a.odemeTarihi || '') ? 1 : -1)
          .map(b => {
            const birim = b.birim || 'tl';
            const fiyat = Calc.birimFiyat(birim);
            const tlDeger = (Number(b.miktar) || 0) * fiyat;
            const isAl = b.tip === 'alacak';
            const odemeTarihi = b.odemeTarihi ? dayjs(b.odemeTarihi).format('DD MMM YYYY') : '—';
            const miktarStr = birim === 'tl'
              ? Calc.fmt(tlDeger)
              : `${Calc.formatBirim(b)} <span style="color:var(--text3);font-weight:500;">≈ ${Calc.fmt(tlDeger)}</span>`;

            return `<div class="tx-item tx-item-clickable" onclick="App.showTamamlananBorcDetay(${b.id})"
                         style="margin-bottom:8px;border-left:3px solid ${isAl ? 'var(--accent)' : 'var(--warning)'};">
              <div class="tx-icon ${isAl ? 'alacak' : 'borc'}">
                <i class="fas ${isAl ? 'fa-hand-holding-dollar' : 'fa-hand-holding-usd'}"></i>
              </div>
              <div class="tx-info">
                <div class="tx-title">${UI.escHtml(b.kisiAdi)}</div>
                <div class="tx-date">${isAl ? '🟢 Alacak' : '🔴 Borç'} · ${miktarStr}</div>
              </div>
              <div style="text-align:right;font-size:10px;color:var(--text3);flex-shrink:0;">
                <div style="color:var(--accent);font-weight:700;margin-bottom:2px;">✅ Tamamlandı</div>
                <div>${odemeTarihi}</div>
              </div>
            </div>`;
          }).join('');
      }
    }
  },

  /* Yıl accordion aç/kapa */
  _toggleArchiveYear(y) {
    if (!this._archiveOpenYears) this._archiveOpenYears = new Set();
    if (this._archiveOpenYears.has(y)) this._archiveOpenYears.delete(y);
    else this._archiveOpenYears.add(y);
    this.renderArsiv();
  },

  /* Manuel arşivleme — onay dialog + işlem */
  async manualArchive(targetKey) {
    /* 🆕 Çift tıklama koruması */
    if (this._archivingLock) {
      showToast('⏳ Arşivleme devam ediyor...');
      return;
    }
    this._archivingLock = true;
    try {
      return await this._manualArchiveInternal(targetKey);
    } finally {
      this._archivingLock = false;
    }
  },

  async _manualArchiveInternal(targetKey) {
    if (!targetKey) {
      const prevKey = SalaryMonth.previousKey();
      const curKey = SalaryMonth.currentKey();
      const prevArchived = !!state.archives[prevKey];
      const prevHasData = SalaryMonth.hasDataInRange(SalaryMonth.range(prevKey));
      const curHasData = SalaryMonth.hasDataInRange(SalaryMonth.range(curKey));

      if (!prevArchived && prevHasData) targetKey = prevKey;
      else if (prevArchived && curHasData) targetKey = curKey;
      else {
        Swal.fire({ icon: 'info', title: 'Bilgi', text: 'Arşivlenecek dönem bulunamadı.' });
        return;
      }
    }

    const range = SalaryMonth.range(targetKey);
    const isEarly = targetKey === SalaryMonth.currentKey();

    const { isConfirmed } = await Swal.fire({
      title: 'Dönemi Arşivle',
      html: `<div style="text-align:left;">
        <p>Aşağıdaki maaş dönemi arşivlenecek:</p>
        <div style="margin:12px 0;padding:14px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);">
          <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Dönem</div>
          <div style="font-family:'Plus Jakarta Sans';font-size:16px;font-weight:800;">${SalaryMonth.shortLabel(targetKey)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px;">${range.start} → ${range.end}</div>
        </div>
        ${isEarly ? `
          <div style="margin-top:10px;padding:10px;background:#FEF3C7;border-radius:8px;font-size:12px;color:#92400E;">
            ⚠️ <strong>Aktif dönemi</strong> erken arşivliyorsunuz. Sonraki günlerde eklenen işlemler ana listede kalır.
          </div>` : ''}
        <p style="font-size:12px;color:var(--text3);margin-top:12px;">Borç/Alacak kayıtları etkilenmeyecek.</p>
      </div>`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Evet, Arşivle',
      cancelButtonText: 'İptal',
      width: Math.min(520, window.innerWidth - 24)
    });
    if (!isConfirmed) return;

    const ok = await CRUD.manualArchive(targetKey);
    if (ok) {
      /* Yeni yılı accordion'da otomatik aç */
      const newYear = SalaryMonth.yearOf(targetKey);
      if (!this._archiveOpenYears) this._archiveOpenYears = new Set();
      this._archiveOpenYears.add(newYear);
      await this.renderArsiv();

  /* ══════════════════════════════════════
     LOGLAR — Kategorize, filtrelenebilir

  _logFilterCat: 'tum',
  _logTimeFilter: 'ay',        // 'ay' | 'gecenay' | 'tum'

  async openLogModal() {
    this._logFilterCat = 'tum';
    this._logTimeFilter = 'ay';

    Swal.fire({
      title: '📜 İşlem Logları',
      html: `<div style="text-align:left;">
        <div class="search-box" style="margin-bottom:10px;">
          <i class="fas fa-search"></i>
          <input type="text" id="logSearch" class="form-input"
                 placeholder="İşlem, kişi, kategori veya açıklamada ara…"
                 oninput="App._filterLogs()">
        </div>

        <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;">Dönem</div>
        <div class="tab-chips" id="logTimeChips" style="margin-bottom:10px;">
          <span class="chip active" data-time="ay"       onclick="App._setLogTime('ay')">Bu Ay</span>
          <span class="chip"        data-time="gecenay"   onclick="App._setLogTime('gecenay')">Geçen Ay</span>
          <span class="chip"        data-time="tum"       onclick="App._setLogTime('tum')">Tümü</span>
        </div>

        <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;">Kategori</div>
        <div class="tab-chips" id="logCatChips" style="margin-bottom:10px;"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
          <span style="font-size:11px;color:var(--text3);" id="logCounter">—</span>
          <button onclick="App._cleanupPageLogs()" style="padding:5px 10px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;">
            <i class="fas fa-broom"></i> Eski Sayfa Loglarını Temizle
          </button>
        </div>

        <div id="logBody" style="max-height:420px;overflow-y:auto;"></div>
      </div>`,
      width: Math.min(560, window.innerWidth - 24),
      confirmButtonText: 'Kapat',
      showCloseButton: true
    });

    this._renderCatChips();
    this._renderLogBody();
  },

  _renderCatChips() {
    const container = document.getElementById('logCatChips');
    if (!container) return;

    const timeFiltered = this._filterByTime(state.logs);
    const counts = {};
    timeFiltered.forEach(l => { counts[l.category || 'diger'] = (counts[l.category || 'diger'] || 0) + 1; });

    const cats = [['tum', 'Tümü'], ['islem','İşlemler'], ['borc','Borç/Alacak'],
                  ['kategori','Kategori'], ['limit','Limit'], ['arsiv','Arşiv'],
                  ['veri','Veri'], ['sistem','Sistem']];

    container.innerHTML = cats.map(([k, v]) => {
      const cnt = k === 'tum' ? timeFiltered.length : (counts[k] || 0);
      if (k !== 'tum' && cnt === 0) return '';  // boş kategoriyi gösterme
      return `<span class="chip${this._logFilterCat === k ? ' active' : ''}" data-cat="${k}" onclick="App._setLogCat('${k}')">${v}${cnt ? ` (${cnt})` : ''}</span>`;
    }).join('');
  },

  _filterByTime(logs) {
    const period = this._logTimeFilter;
    if (period === 'tum') return logs;
    const targetKey = period === 'gecenay' ? SalaryMonth.previousKey() : SalaryMonth.currentKey();
    const range = SalaryMonth.range(targetKey);
    return logs.filter(l => {
      const d = dayjs(l.timestamp).format('YYYY-MM-DD');
      return d >= range.start && d <= range.end;
    });
  },

  _setLogTime(t) {
    this._logTimeFilter = t;
    document.querySelectorAll('#logTimeChips .chip').forEach(c => c.classList.toggle('active', c.dataset.time === t));
    this._renderCatChips();
    this._renderLogBody();
  },

  _setLogCat(c) {
    this._logFilterCat = c;
    document.querySelectorAll('#logCatChips .chip').forEach(c2 => c2.classList.toggle('active', c2.dataset.cat === c));
    this._renderLogBody();
  },

  _renderLogBody() {
    const q = (document.getElementById('logSearch')?.value || '').toLowerCase();

    let filtered = this._filterByTime(state.logs);

    if (this._logFilterCat !== 'tum') {
      filtered = filtered.filter(l => (l.category || 'diger') === this._logFilterCat);
    }

    if (q) {
      filtered = filtered.filter(l => {
        const hay = [
          l.label || l.action || '',
          l.details || '',
          l.meta?.person || '',
          l.meta?.category || '',
          l.meta?.month || ''
        ].join(' ').toLowerCase();
        return hay.includes(q);
      });
    }

    const counter = document.getElementById('logCounter');
    if (counter) counter.textContent = `${filtered.length} kayıt`;

    const body = document.getElementById('logBody');
    if (!body) return;

    if (!filtered.length) {
      body.innerHTML = '<div class="empty-state" style="padding:30px;"><i class="fas fa-clipboard-list"></i><p>Kriterlere uygun log bulunamadı</p></div>';
      return;
    }

    body.innerHTML = filtered.slice(0, 150).map(l =>
      UI.logItem(l, `App.showLogDetail(${l.id})`)
    ).join('')
    + (filtered.length > 150
        ? `<p style="text-align:center;font-size:11px;color:var(--text3);padding:8px 0;">+${filtered.length - 150} kayıt daha (aramayı daraltın)</p>`
        : '');
  },

  _filterLogs() { this._renderLogBody(); },

  showLogDetail(logIdOrObj) {

    const def = LOG_ACTIONS[log.action] || { cat:'diger', sev:'info', icon:'fa-info-circle', label: log.action };

    const label = log.label || def.label;

    /* Meta satırları */
    const metaRows = [];
    if (log.meta) {
      if (log.meta.entityId)             metaRows.push({ k: 'Kayıt ID',       v: log.meta.entityId });
      if (log.meta.person)               metaRows.push({ k: 'Kişi',           v: log.meta.person });
      if (log.meta.category)             metaRows.push({ k: 'Kategori',       v: log.meta.category });
      if (log.meta.amount !== undefined) {
        const u = log.meta.unit || 'tl';
        metaRows.push({ k: 'Miktar', v: u === 'tl' ? Calc.fmt(log.meta.amount) : `${log.meta.amount} ${Calc.birimKisa(u)}` });
      }
      if (log.meta.tlValue !== undefined) metaRows.push({ k: 'TL Karşılığı',  v: Calc.fmt(log.meta.tlValue) });

      if (log.meta.gelirCount !== undefined) metaRows.push({ k: 'Gelir',      v: `${log.meta.gelirCount} kayıt` });
      if (log.meta.giderCount !== undefined) metaRows.push({ k: 'Gider',      v: `${log.meta.giderCount} kayıt` });
      if (log.meta.logCount !== undefined)   metaRows.push({ k: 'Log',        v: `${log.meta.logCount} kayıt` });
      if (log.meta.oldValue !== undefined && log.meta.newValue !== undefined) {
        metaRows.push({ k: 'Önce → Sonra', v: `${Calc.fmt(log.meta.oldValue)} → ${Calc.fmt(log.meta.newValue)}` });

      if (log.meta.totalPaid !== undefined && log.meta.totalAmount !== undefined) {

          <div style="font-size:13px;margin-top:4px;color:var(--text);">${UI.escHtml(log.details)}</div>
        </div>` : ''}

        ${metaRows.length ? `
        <div class="archive-stat-card" style="margin-bottom:10px;">
          <div class="archive-stat-label">Ek Bilgiler</div>
          ${metaRows.map(r => `
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);">

  async resetAll() {
  const r = await Swal.fire({
    icon: 'warning',
    title: 'Emin misiniz?',
    text: 'TÜM veriler (gelir, gider, borç, arşiv, log, yedek) silinecek! Bu işlem geri alınamaz.',
    showCancelButton: true,
    confirmButtonColor: '#DC2626',
    confirmButtonText: 'Evet, Her Şeyi Sil',
    cancelButtonText: 'İptal'
  });
  if (!r.isConfirmed) return;

  const stores = ['gelirler','giderler','borcalacaklar','kategoriler','limitler','ayarlar','archives','logs','backups'];
  try {
    // Her store'u atomik olarak temizle (queueSave sırasına uy)
    for (const s of stores) {
      await queueSave(() => new Promise((res, rej) => {
        const tx = db.transaction(s, 'readwrite');
        tx.objectStore(s).clear();
        tx.oncomplete = () => res();
        tx.onerror    = () => rej(tx.error);
      }));
    }
    // State'i varsayılana döndür
    state.gelirler = [];
    state.giderler = [];
    state.borcalacaklar = [];
    state.archives = {};
    state.logs = [];
    state.backups = [];
    state.limitler = {};
    state.kategoriler = {
      gelir: ['Maaş','Serbest Çalışma','Yatırım','Hediye','Kira Geliri','Diğer'],
      gider: ['Market','Fatura','Eğlence','Ulaşım','Sağlık','Eğitim','Yemek','Alışveriş','Diğer']
    };
    state.ayarlar = {
      varsayilanRaporAraligi: 'ay',
      gramAltinFiyati: 6400,
      ceyrekAltinFiyati: 10500
    };
    localStorage.removeItem('butcem_migrate_done');

    Swal.close();
    showToast('🗑️ Tüm veriler sıfırlandı');
    await this.loadPage('dashboard');
  } catch (e) {
    console.error('[resetAll] Hata:', e);
    Swal.close();
    Swal.fire({ icon: 'error', title: 'Sıfırlama Hatası', text: e.message || 'Bilinmeyen hata' });
  }
},

  async exportToPDF() {
    if (typeof window.jspdf === 'undefined') {
      showToast('❌ PDF motoru yüklenemedi. İnternet bağlantınızı kontrol edin.');
      return;
    }

    Swal.fire({
      title: 'PDF hazırlanıyor...',
      html: 'Türkçe font ve rapor yükleniyor',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      const M = 20;

      const hasUni = await _loadPdfFonts(doc);
      const FONT = hasUni ? 'Roboto' : 'helvetica';

      /* ═══ KAPAK ═══ */
      doc.setFillColor(30, 64, 175);
      doc.rect(0, 0, W, 48, 'F');
      doc.setFillColor(37, 99, 235);
      doc.rect(0, 22, W, 26, 'F');
      doc.setFillColor(59, 130, 246);
      doc.circle(W - 15, 10, 34, 'F');
      doc.setFillColor(37, 99, 235);
      doc.circle(W - 15, 10, 26, 'F');

      doc.setFont(FONT, 'bold');
      doc.setFontSize(24);
      doc.setTextColor(255, 255, 255);
      _txt(doc, 'EBHA MANİ', M, 22, null, hasUni);

      doc.setFont(FONT, 'normal');
      doc.setFontSize(10);
      doc.setTextColor(219, 234, 254);
      _txt(doc, 'Finansal Rapor', M, 31, null, hasUni);

      doc.setFontSize(9);
      _txt(doc, dayjs().format('DD MMMM YYYY · HH:mm'), W - M, 42, { align: 'right' }, hasUni);

      /* ═══ ÖZET KARTLARI ═══ */
      let y = 58;
      const ayF = Calc.ayFilter();
      const gelirT = Calc.toplamGelir(ayF);
      const giderT = Calc.toplamGider(ayF);
      const bakiye = gelirT - giderT;
      const borcT = Calc.aktifBorcAlacak();

      const cw = (W - 2 * M - 9) / 4;
      const ch = 24;

      _kart(doc, M,               y, cw, ch, { label: 'Gelir', value: Calc.fmt(gelirT), accent: [5,150,105]   }, hasUni, FONT);
      _kart(doc, M + cw + 3,      y, cw, ch, { label: 'Gider', value: Calc.fmt(giderT), accent: [220,38,38]  }, hasUni, FONT);
      _kart(doc, M + (cw+3)*2,    y, cw, ch, { label: 'Net',   value: Calc.fmt(bakiye), accent: [37,99,235]  }, hasUni, FONT);
      _kart(doc, M + (cw+3)*3,    y, cw, ch, { label: 'Borç',  value: Calc.fmt(borcT),  accent: [217,119,6] }, hasUni, FONT);

      y += ch + 10;

      /* ═══ GİDER DAĞILIMI ═══ */
      _baslik(doc, 'GİDER DAĞILIMI', y, hasUni, FONT);
      y += 10;

      const katG = Calc.kategoriGiderler(ayF);
      const sortedKat = Object.entries(katG).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const maxKat = sortedKat.length ? sortedKat[0][1] : 1;
      const palet = [
        [37,99,235], [5,150,105], [217,119,6], [220,38,38],
        [124,58,237], [8,145,178], [234,88,12], [219,39,119]
      ];

      sortedKat.forEach(([kat, val], i) => {
        if (y > H - 40) { doc.addPage(); y = 20; }
        const renk = palet[i % palet.length];

        doc.setFont(FONT, 'normal');
        doc.setFontSize(9);
        doc.setTextColor(15, 23, 42);
        _txt(doc, String(kat).substring(0, 16), M, y + 3, null, hasUni);

        _bar(doc, M + 40, y - 1, W - M - 40 - 32, 3, val / maxKat, renk);

        doc.setFont(FONT, 'bold');
        doc.setTextColor(...renk);
        _txt(doc, Calc.fmt(val), W - M, y + 3, { align: 'right' }, hasUni);
        y += 8;
      });

      /* ═══ İŞLEM TABLOLARI ═══ */
      const tablo = (list, baslik, renk, isaret) => {
        if (!list || !list.length) return;
        if (y > H - 50) { doc.addPage(); y = 20; }

        y += 6;
        _baslik(doc, baslik, y, hasUni, FONT);
        y += 10;

        const cizBaslik = () => {
          doc.setFillColor(248, 250, 252);
          doc.rect(M, y - 4, W - 2 * M, 6, 'F');
          doc.setFont(FONT, 'bold');
          doc.setFontSize(7.5);
          doc.setTextColor(100, 116, 139);
          _txt(doc, 'TARİH', M + 3, y, null, hasUni);
          _txt(doc, 'KATEGORİ', M + 28, y, null, hasUni);
          _txt(doc, 'AÇIKLAMA', M + 78, y, null, hasUni);
          _txt(doc, 'TUTAR', W - M - 3, y, { align: 'right' }, hasUni);
          y += 5;
        };
        cizBaslik();

        list.slice(0, 30).forEach((item, idx) => {
          if (y > H - 30) { doc.addPage(); y = 20; cizBaslik(); }

          if (idx % 2 === 0) {
            doc.setFillColor(252, 253, 255);
            doc.rect(M, y - 4, W - 2 * M, 6.5, 'F');
          }

          doc.setFont(FONT, 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(71, 85, 105);
          _txt(doc, item.tarih || '', M + 3, y, null, hasUni);

          doc.setTextColor(15, 23, 42);
          _txt(doc, String(item.kategori || '').substring(0, 18), M + 28, y, null, hasUni);

          doc.setTextColor(148, 163, 184);
          _txt(doc, String(item.aciklama || '—').substring(0, 26), M + 78, y, null, hasUni);

          doc.setFont(FONT, 'bold');
          doc.setTextColor(...renk);
          _txt(doc, isaret + Calc.fmt(item.miktar), W - M - 3, y, { align: 'right' }, hasUni);
          y += 6.5;
        });

        if (list.length > 30) {
          doc.setFont(FONT, 'normal');
          doc.setFontSize(7);
          doc.setTextColor(148, 163, 184);
          _txt(doc, `... ve ${list.length - 30} kayıt daha`, M, y + 2, null, hasUni);
          y += 7;
        }
      };

      tablo(state.gelirler, 'GELİRLER', [5, 150, 105], '+');
      tablo(state.giderler, 'GİDERLER', [220, 38, 38], '-');

      /* ═══ BORÇ / ALACAK — birim farkındalı ═══ */
      const aktifBorclar = state.borcalacaklar.filter(x => !x.odendiMi);

      if (aktifBorclar.length) {
        if (y > H - 50) { doc.addPage(); y = 20; }
        y += 6;
        _baslik(doc, 'BORÇ & ALACAK', y, hasUni, FONT);
        y += 10;

        aktifBorclar.slice(0, 20).forEach(function(borcItem) {
          if (y > H - 30) { doc.addPage(); y = 20; }

          const birim      = borcItem.birim || 'tl';
          const birimFiyat = Calc.birimFiyat(birim);
          const miktarNum  = Number(borcItem.miktar) || 0;
          const paid       = (borcItem.payments || []).reduce((s, p) => s + (Number(p.miktar) || 0), 0);
          const kalan      = Math.max(0, miktarNum - paid);
          const isAl       = borcItem.tip === 'alacak';
          const renk       = isAl ? [5, 150, 105] : [217, 119, 6];

          _roundRect(doc, M, y - 4, W - 2 * M, 15, 2, [252, 253, 255], [226, 232, 240]);

          doc.setFillColor(...renk);
          doc.roundedRect(M + 3, y - 2, 14, 4.5, 1, 1, 'F');
          doc.setFont(FONT, 'bold');
          doc.setFontSize(6);
          doc.setTextColor(255, 255, 255);
          _txt(doc, isAl ? 'ALACAK' : 'BORÇ', M + 10, y + 0.5, { align: 'center' }, hasUni);

          doc.setFont(FONT, 'bold');
          doc.setFontSize(9);
          doc.setTextColor(15, 23, 42);
          _txt(doc, String(borcItem.kisiAdi || '').substring(0, 30), M + 20, y + 1, null, hasUni);

          /* Miktar — TL veya gram/çeyrek */
          const miktarGosterim = birim === 'tl'
            ? Calc.fmt(miktarNum)
            : `${miktarNum.toLocaleString('tr-TR', { maximumFractionDigits: 2 })} ${Calc.birimKisa(birim)} (${Calc.fmt(miktarNum * birimFiyat)})`;

          doc.setFontSize(9);
          doc.setTextColor(...renk);
          _txt(doc, miktarGosterim, W - M - 3, y + 1, { align: 'right' }, hasUni);

          /* Progress bar */
          const pct = miktarNum > 0 ? Math.min(1, paid / miktarNum) : 0;
          _bar(doc, M + 3, y + 5, 40, 2, pct, renk);

          doc.setFont(FONT, 'normal');
          doc.setFontSize(7);
          doc.setTextColor(148, 163, 184);
          _txt(doc, `%${Math.round(pct * 100)} ödendi`, M + 45, y + 6.5, null, hasUni);

          /* Kalan — TL veya gram/çeyrek */
          if (kalan > 0) {
            const kalanGosterim = birim === 'tl'
              ? `Kalan: ${Calc.fmt(kalan)}`
              : `Kalan: ${kalan.toLocaleString('tr-TR', { maximumFractionDigits: 2 })} ${Calc.birimKisa(birim)} (${Calc.fmt(kalan * birimFiyat)})`;
            _txt(doc, kalanGosterim, W - M - 3, y + 6.5, { align: 'right' }, hasUni);
          } else {
            doc.setTextColor(...renk);
            doc.setFont(FONT, 'bold');
            _txt(doc, '✓ Tamamlandı', W - M - 3, y + 6.5, { align: 'right' }, hasUni);
          }

          y += 17;
        });
      }

      /* ═══ FOOTER ═══ */
      const total = doc.internal.getNumberOfPages();
      for (let i = 1; i <= total; i++) {
        doc.setPage(i);
        _footer(doc, i, total, hasUni, FONT);
      }

      const fname = `ebhamani_rapor_${dayjs().format('YYYY-MM-DD_HHmm')}.pdf`;
      doc.save(fname);
      Swal.close();
      showToast('📄 PDF indirildi!');
    } catch (err) {
      console.error('[PDF] Hata:', err);
      Swal.close();
      Swal.fire({ icon: 'error', title: 'PDF Hatası', text: err.message || 'Rapor oluşturulamadı.' });
    }
  },

  async exportToJSON() {
    const data = {
      version: '5.1',

      gelirler:      state.gelirler,
      giderler:      state.giderler,
      borcalacaklar: state.borcalacaklar,

    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href:url, download:`ebhamani_yedek_${dayjs().format('YYYY-MM-DD_HHmm')}.json` });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

    showToast('💾 Yedek alındı!');
  },

    async importFromJSON(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const data = JSON.parse(e.target.result);
        const asArr = v => Array.isArray(v) ? v.filter(x => x && x.miktar != null) : [];

        state.gelirler      = asArr(data.gelirler);
        state.giderler      = asArr(data.giderler);
        state.borcalacaklar = asArr(data.borcalacaklar);

        if (data.kategoriler && data.kategoriler.gelir && data.kategoriler.gider) {
          state.kategoriler = {
            gelir: Array.isArray(data.kategoriler.gelir) ? data.kategoriler.gelir : state.kategoriler.gelir,
            gider: Array.isArray(data.kategoriler.gider) ? data.kategoriler.gider : state.kategoriler.gider
          };
        }
        if (data.limitler && typeof data.limitler === 'object' && !Array.isArray(data.limitler)) {
          state.limitler = data.limitler;
        }
        if (data.archives && typeof data.archives === 'object' && !Array.isArray(data.archives)) {
          state.archives = data.archives;
        }

        await saveAllData();
        await addLog('json_import', file.name);
        showToast('✅ Yedek başarıyla yüklendi!');
        await this.loadPage(this.currentPage);
      } catch (err) {
        console.error('[import] Hata:', err);
        Swal.fire({ icon:'error', title:'Geçersiz Dosya', text:'JSON formatı hatalı veya eksik.' });
      }
    };
    reader.readAsText(file);
  },
  async downloadArchivePDF(key) {
    const archive = state.archives[key];
    if (!archive || !archive.pdfDataUrl) {
      showToast('⚠️ PDF bulunamadı');
      return;
    }
    const filename = `ebhamani_arsiv_${key}_${dayjs(archive.pdfGeneratedAt || new Date()).format('YYYYMMDD_HHmm')}.pdf`;
    const link = document.createElement('a');
    link.href = archive.pdfDataUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('📄 PDF indirildi');
  },

  async downloadBackup(backupId) {
    const backup = state.backups.find(b => b.id == backupId);
    if (!backup) return;
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href:url, download:`ebhamani_backup_${dayjs(backup.createdAt).format('YYYY-MM-DD_HHmm')}.json` });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
};

/* ─────────────────────────────────────────────
   MİGRASYON (Eski ayların otomatik arşivlenmesi)
───────────────────────────────────────────── */
/* Geçmiş ay arşivleme — SADECE kullanıcı onayıyla, tek seferlik */
/* ─────────────────────────────────────────────
   OTOMATİK ARŞİV KONTROLÜ — uygulama açılışında çalışır
   Geçmiş dönem arşivlenmemişse kullanıcıya tek tıkla arşivleme sunar
───────────────────────────────────────────── */
async function autoArchiveCheck() {
  try {
    /* 🆕 TÜM bekleyen dönemleri al (sadece bir önceki değil) */
    const pending = SalaryMonth.pendingMonths();

    if (!pending.length) return;

    /* Toplu onay dialogu */
    const totalGelir = pending.reduce((s, k) => {
      const r = SalaryMonth.range(k);
      return s + state.gelirler.filter(g => g.tarih >= r.start && g.tarih <= r.end).length;
    }, 0);
    const totalGider = pending.reduce((s, k) => {
      const r = SalaryMonth.range(k);
      return s + state.giderler.filter(g => g.tarih >= r.start && g.tarih <= r.end).length;
    }, 0);

    const { isConfirmed } = await Swal.fire({
      icon: 'warning',
      title: pending.length === 1
        ? '⏰ Arşiv Gecikmiş'
        : `⏰ ${pending.length} Dönem Arşivlenmeli`,
      html: `<div style="text-align:left;">
        <p><strong>${pending.length}</strong> dönem arşivlenmemiş durumda:</p>
        <div style="margin:12px 0;padding:12px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);max-height:180px;overflow-y:auto;">
          ${pending.map(k => `
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;">
              <span style="font-weight:700;">${SalaryMonth.shortLabel(k)}</span>
              <span style="color:var(--text3);font-size:10px;">${SalaryMonth.range(k).start.substring(5)} → ${SalaryMonth.range(k).end.substring(5)}</span>
            </div>
          `).join('')}
        </div>
        <p style="font-size:12px;color:#94a3b8;">
          <strong>${totalGelir}</strong> gelir · <strong>${totalGider}</strong> gider toplam
        </p>

/* ─────────────────────────────────────────────
   MİGRASYON (Eski ayların otomatik arşivlenmesi)
───────────────────────────────────────────── */
async function migrateOldData(force = false) {
  const seenKey = 'butcem_migrate_done';
  if (!force && localStorage.getItem(seenKey) === '1') return;

  /* Maaş dönemi sınırları (15→15) */
  const currentKey = SalaryMonth.currentKey();
  const currentRange = SalaryMonth.range(currentKey);

  /* Aktif maaş dönemi dışındaki işlemler "eski" */
  const oldGelir = state.gelirler.filter(g => {
    if (!g.tarih) return false;
    return g.tarih < currentRange.start || g.tarih > currentRange.end;
  });
  const oldGider = state.giderler.filter(g => {
    if (!g.tarih) return false;
    return g.tarih < currentRange.start || g.tarih > currentRange.end;
  });

  if (oldGelir.length || oldGider.length) {
    const { isConfirmed } = await Swal.fire({
      icon: 'question',
      title: 'Geçmiş Aylar Arşivlensin mi?',
      html: `<p style="font-size:13px;">${oldGelir.length + oldGider.length} adet geçmiş tarihli kayıt bulundu.</p>
             <p style="font-size:12px;color:#94A3B8;margin-top:6px;">"Arşivle" derseniz ana listeden kaldırılıp Arşiv sekmesine taşınır. "Vazgeç" derseniz her şey olduğu gibi kalır.</p>`,
      showCancelButton: true,
      confirmButtonText: 'Arşivle',
      cancelButtonText: 'Vazgeç'
    });

    if (isConfirmed) {
      /* Maaş dönemlerine göre grupla */
      const months = new Set([
        ...oldGelir.map(g => SalaryMonth.keyOf(g.tarih)),
        ...oldGider.map(g => SalaryMonth.keyOf(g.tarih))
      ]);

      for (const m of months) {
        if (!state.archives[m]) {
          const r = SalaryMonth.range(m);
          const aLoglar = state.logs.filter(l => {
            const d = dayjs(l.timestamp).format('YYYY-MM-DD');
            return d >= r.start && d <= r.end;
          });
          state.archives[m] = {
            gelirler: oldGelir.filter(g => g.tarih >= r.start && g.tarih <= r.end),
            giderler: oldGider.filter(g => g.tarih >= r.start && g.tarih <= r.end),
            borcalacaklar: [],
            loglar: aLoglar,
            salaryMonthRange: r,
            year: SalaryMonth.yearOf(m),
            archivedAt: new Date().toISOString(),
            schemaVersion: 3
          };
        }
      }

      /* Sadece AKTİF maaş dönemi ana listede kalsın
         (önceki dönem de arşivlendi — çift kayıt önlenir) */
      state.gelirler = state.gelirler.filter(g => {
        if (!g.tarih) return true;
        return g.tarih >= currentRange.start && g.tarih <= currentRange.end;
      });
      state.giderler = state.giderler.filter(g => {
        if (!g.tarih) return true;
        return g.tarih >= currentRange.start && g.tarih <= currentRange.end;
      });
      state.logs = state.logs.filter(l => {
        const d = dayjs(l.timestamp).format('YYYY-MM-DD');
        return d >= currentRange.start && d <= currentRange.end;
      });

      await saveGelirler();
      await saveGiderler();
      await saveLogs();
      await saveArchives();
    }
  }

  localStorage.setItem(seenKey, '1');
}

/* ═══════════════════════════════════════════════════════════════
   PDF YARDIMCILARI — Türkçe karakter + modern tasarım
   ─────────────────────────────────────────────────────────────
   Roboto TTF CDN'den bir kez yüklenir, jsPDF'e gömülür.
   Font yüklenemezse otomatik ASCII fallback (ş→s, ğ→g …).
   ═══════════════════════════════════════════════════════════════ */

let _pdfFontsReady = false;

async function _loadPdfFonts(doc) {
  if (_pdfFontsReady) return true;
  const sources = [
    { name: 'Roboto-Regular.ttf', alias: 'Roboto', style: 'normal',
      url: 'https://cdn.jsdelivr.net/gh/googlefonts/roboto-2@main/src/hinted/Roboto-Regular.ttf' },
    { name: 'Roboto-Bold.ttf',    alias: 'Roboto', style: 'bold',
      url: 'https://cdn.jsdelivr.net/gh/googlefonts/roboto-2@main/src/hinted/Roboto-Bold.ttf' }
  ];
  try {
    for (const f of sources) {
      const res = await fetch(f.url, { mode: 'cors' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      doc.addFileToVFS(f.name, _arrayBufferToBase64(buf));
      doc.addFont(f.name, f.alias, f.style);
    }
    _pdfFontsReady = true;
    console.log('[PDF] ✅ Roboto yüklendi (Türkçe karakterler aktif)');
    return true;
  } catch (e) {
    console.warn('[PDF] ⚠️ Font yüklenemedi, ASCII fallback:', e);
    return false;
  }
}

function _arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function _ascii(str) {
  if (str == null) return '';
  return String(str)
    .replace(/ğ/g,'g').replace(/Ğ/g,'G')
    .replace(/ü/g,'u').replace(/Ü/g,'U')
    .replace(/ş/g,'s').replace(/Ş/g,'S')
    .replace(/ı/g,'i').replace(/İ/g,'I')
    .replace(/ö/g,'o').replace(/Ö/g,'O')
    .replace(/ç/g,'c').replace(/Ç/g,'C')
    .replace(/₺/g,'TL');
}

/* Türkçe-güvenli metin yazıcı: hasUni=false ise ASCII'ye çevirir */
function _txt(doc, str, x, y, opts, hasUni) {
  doc.text(hasUni ? String(str ?? '') : _ascii(str), x, y, opts);
}

function _roundRect(doc, x, y, w, h, r, fill, border) {
  if (fill)   doc.setFillColor(...fill);
  if (border) doc.setDrawColor(...border);
  doc.roundedRect(x, y, w, h, r, r, fill && border ? 'FD' : fill ? 'F' : 'D');
}

function _kart(doc, x, y, w, h, opts, hasUni, FONT) {
  const { label, value, accent } = opts;
  _roundRect(doc, x, y, w, h, 2.5, [255,255,255], [226,232,240]);
  doc.setFillColor(...accent);
  doc.rect(x, y, w, 2.2, 'F');
  doc.setFont(FONT, 'normal');
  doc.setFontSize(6.5);
  doc.setTextColor(100,116,139);
  _txt(doc, String(label).toUpperCase(), x + 3.5, y + 7, null, hasUni);
  doc.setFont(FONT, 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(...accent);
  _txt(doc, value, x + 3.5, y + 16, null, hasUni);
}

function _baslik(doc, text, y, hasUni, FONT) {
  doc.setFillColor(37,99,235);
  doc.circle(22, y - 0.5, 1.3, 'F');
  doc.setFont(FONT, 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(15,23,42);
  _txt(doc, text, 26, y + 0.5, null, hasUni);
  doc.setDrawColor(226,232,240);
  doc.setLineWidth(0.25);
  doc.line(20, y + 4.5, 190, y + 4.5);
}

function _bar(doc, x, y, w, h, pct, color) {
  doc.setFillColor(241,245,249);
  doc.roundedRect(x, y, w, h, 0.8, 0.8, 'F');
  const fw = Math.max(0, Math.min(w, w * pct));
  if (fw > 0) {
    doc.setFillColor(...color);
    doc.roundedRect(x, y, fw, h, 0.8, 0.8, 'F');
  }
}

function _footer(doc, pg, total, hasUni, FONT) {
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  doc.setDrawColor(226,232,240);
  doc.setLineWidth(0.15);
  doc.line(20, H - 14, W - 20, H - 14);
  doc.setFont(FONT, 'normal');
  doc.setFontSize(7);
  doc.setTextColor(148,163,184);
  _txt(doc, 'EBHA Mani  ·  Finansal Rapor', 20, H - 9.5, null, hasUni);
  _txt(doc, `Sayfa ${pg} / ${total}`, W - 20, H - 9.5, { align: 'right' }, hasUni);
}

/* ═══════════════════════════════════════════════════════════════
   ARŞİV PDF ÜRETİCİ — her arşivlemede otomatik çağrılır
   ═══════════════════════════════════════════════════════════════ */
async function buildArchivePDF(monthKey) {
  if (typeof window.jspdf === 'undefined') return null;

  const archive = state.archives[monthKey];
  if (!archive) return null;

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const M = 15;

    const hasUni = await _loadPdfFonts(doc);
    const FONT = hasUni ? 'Roboto' : 'helvetica';

    const range      = archive.salaryMonthRange || SalaryMonth.range(monthKey);
    const aGelirler  = Array.isArray(archive.gelirler) ? archive.gelirler : [];
    const aGiderler  = Array.isArray(archive.giderler) ? archive.giderler : [];
    const aLoglar    = Array.isArray(archive.loglar)   ? archive.loglar   : [];

    const toplamGelir = aGelirler.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const toplamGider = aGiderler.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const net         = toplamGelir - toplamGider;

    /* KAPAK */
    doc.setFillColor(30, 64, 175);
    doc.rect(0, 0, W, 42, 'F');
    doc.setFillColor(37, 99, 235);
    doc.rect(0, 20, W, 22, 'F');

    doc.setFont(FONT, 'bold');
    doc.setFontSize(22);
    doc.setTextColor(255, 255, 255);
    _txt(doc, 'EBHA MANI', M, 16, null, hasUni);

    doc.setFont(FONT, 'normal');
    doc.setFontSize(11);
    doc.setTextColor(219, 234, 254);
    _txt(doc, 'Arşiv Raporu · ' + SalaryMonth.shortLabel(monthKey), M, 25, null, hasUni);
    _txt(doc, range.start + ' → ' + range.end, M, 32, null, hasUni);

    doc.setFontSize(8);
    _txt(doc, 'Oluşturma: ' + dayjs(archive.pdfGeneratedAt || archive.archivedAt || new Date()).format('DD MMMM YYYY HH:mm'), W - M, 32, { align: 'right' }, hasUni);

    /* ÖZET KARTLARI */
    let y = 52;
    const cw = (W - 2 * M - 6) / 3;

    _kart(doc, M,             y, cw, 20, { label: 'Toplam Gelir', value: Calc.fmt(toplamGelir), accent: [5,150,105] }, hasUni, FONT);
    _kart(doc, M + cw + 3,    y, cw, 20, { label: 'Toplam Gider', value: Calc.fmt(toplamGider), accent: [220,38,38] }, hasUni, FONT);
    _kart(doc, M + (cw+3)*2,  y, cw, 20, { label: 'Net Bakiye',   value: Calc.fmt(net),         accent: [37,99,235] }, hasUni, FONT);

    y += 26;

    /* İSTATİSTİK SATIRI */
    doc.setFont(FONT, 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    _txt(doc, `${aGelirler.length} gelir kaydı · ${aGiderler.length} gider kaydı · ${aLoglar.length} log kaydı`, M, y, null, hasUni);
    y += 8;

    /* TABLOLAR */
    const tabloCiz = (list, baslik, renk, isaret) => {
      if (!list.length) return;
      if (y > H - 50) { doc.addPage(); y = 20; }

      _baslik(doc, baslik + ' (' + list.length + ')', y, hasUni, FONT);
      y += 8;

      doc.setFillColor(248, 250, 252);
      doc.rect(M, y - 4, W - 2 * M, 6, 'F');
      doc.setFont(FONT, 'bold');
      doc.setFontSize(7.5);
      doc.setTextColor(100, 116, 139);
      _txt(doc, 'TARİH', M + 3, y, null, hasUni);
      _txt(doc, 'KATEGORİ', M + 25, y, null, hasUni);
      _txt(doc, 'AÇIKLAMA', M + 65, y, null, hasUni);
      _txt(doc, 'TUTAR', W - M - 3, y, { align: 'right' }, hasUni);
      y += 5;

      list.forEach(function(item, idx) {
        if (y > H - 20) { doc.addPage(); y = 20; }
        if (idx % 2 === 0) {
          doc.setFillColor(252, 253, 255);
          doc.rect(M, y - 4, W - 2 * M, 6.5, 'F');
        }
        doc.setFont(FONT, 'normal');
        doc.setFontSize(8.5);
        doc.setTextColor(71, 85, 105);
        _txt(doc, item.tarih || '-', M + 3, y, null, hasUni);
        doc.setTextColor(15, 23, 42);
        _txt(doc, String(item.kategori || '').substring(0, 18), M + 25, y, null, hasUni);
        doc.setTextColor(148, 163, 184);
        _txt(doc, String(item.aciklama || '-').substring(0, 35), M + 65, y, null, hasUni);
        doc.setFont(FONT, 'bold');
        doc.setTextColor(...renk);
        _txt(doc, isaret + Calc.fmt(item.miktar), W - M - 3, y, { align: 'right' }, hasUni);
        y += 6.5;
      });

      y += 6;
    };

    tabloCiz(aGelirler, 'GELİRLER', [5, 150, 105], '+');
    tabloCiz(aGiderler, 'GİDERLER', [220, 38, 38], '-');

    /* FOOTER */
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      _footer(doc, i, totalPages, hasUni, FONT);
    }

    return doc.output('datauristring');
  } catch (e) {
    console.error('[Archive PDF] Üretim hatası:', e);
    return null;
  }
}

/* ───── Kalıcı depolama izni ─────
   iOS ve bazı tarayıcılar persist() çağrısına kullanıcı etkileşimi
   sonrası daha olumlu yanıt verir. İlk tıklamada bir kez tetiklenir. */
let persistRequested = false;
async function requestPersistentStorage() {
  if (persistRequested) return;
  persistRequested = true;

  if (!navigator.storage || !navigator.storage.persist) {
    console.warn('[Storage] Kalıcı depolama API\'si desteklenmiyor.');
    return;
  }
  try {
    const isPersisted = await navigator.storage.persisted();
    if (isPersisted) {
      console.log('[Storage] ✅ Zaten kalıcı depolama aktif.');
      return;
    }
    const granted = await navigator.storage.persist();
    console.log('[Storage] Kalıcı depolama izni:', granted ? '✅ VERİLDİ' : '❌ REDDEDİLDİ');
    if (!granted) {
      console.warn('[Storage] Tarayıcı kalıcı depolamaya izin vermedi. Düzenli yedek alın.');
    }
  } catch (e) {
    console.error('[Storage] Kalıcı depolama isteği hatası:', e);
  }
}
