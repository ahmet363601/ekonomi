          <span style="font-size:10px;color:var(--text3);font-style:italic;">Son 500 log tutulur</span>
        </div>

        <div id="logBody" style="max-height:420px;overflow-y:auto;"></div>
      </div>`,
      width: Math.min(560, window.innerWidth - 24),
      confirmButtonText: 'Kapat',
      showCloseButton: true,
      didOpen: () => {
        // ✅ DOM hazır — chip'ler ve log listesi dolar
        this._renderCatChips();
        this._renderLogBody();
      }
    });
  },

  _renderCatChips() {
    const container = document.getElementById('logCatChips');
    if (!container) return;

    const timeFiltered = this._filterByTime(state.logs);
    const counts = {};
    timeFiltered.forEach(l => { counts[l.category || 'diger'] = (counts[l.category || 'diger'] || 0) + 1; });

    const cats = [['tum', 'Tümü'], ['islem','İşlemler'], ['borc','Borç/Alacak'],
                  ['kategori','Kategori'], ['limit','Limit'], ['arsiv','Arşiv'],
                  ['veri','Veri'], ['sistem','Sistem']];

    container.innerHTML = cats.map(([k, v]) => {
      const cnt = k === 'tum' ? timeFiltered.length : (counts[k] || 0);
      if (k !== 'tum' && cnt === 0) return '';  // boş kategoriyi gösterme
      return `<span class="chip${this._logFilterCat === k ? ' active' : ''}" data-cat="${k}" onclick="App._setLogCat('${k}')">${v}${cnt ? ` (${cnt})` : ''}</span>`;
    }).join('');
  },

  _filterByTime(logs) {
    const period = this._logTimeFilter;
    if (period === 'tum') return logs;
    const targetKey = period === 'gecenay' ? SalaryMonth.previousKey() : SalaryMonth.currentKey();
    const range = SalaryMonth.range(targetKey);
    return logs.filter(l => {
      const d = dayjs(l.timestamp).format('YYYY-MM-DD');
      return d >= range.start && d <= range.end;
    });
  },

  _setLogTime(t) {
    this._logTimeFilter = t;
    document.querySelectorAll('#logTimeChips .chip').forEach(c => c.classList.toggle('active', c.dataset.time === t));
    this._renderCatChips();
    this._renderLogBody();
  },

  _setLogCat(c) {
    this._logFilterCat = c;
    document.querySelectorAll('#logCatChips .chip').forEach(c2 => c2.classList.toggle('active', c2.dataset.cat === c));
    this._renderLogBody();
  },

  _renderLogBody() {
    const q = (document.getElementById('logSearch')?.value || '').toLowerCase();

    let filtered = this._filterByTime(state.logs);

    if (this._logFilterCat !== 'tum') {
      filtered = filtered.filter(l => (l.category || 'diger') === this._logFilterCat);
    }

    if (q) {
      filtered = filtered.filter(l => {
        const hay = [
          l.label || l.action || '',
          l.details || '',
          l.meta?.person || '',
          l.meta?.category || '',
          l.meta?.month || ''
        ].join(' ').toLowerCase();
        return hay.includes(q);
      });
    }

    const counter = document.getElementById('logCounter');
    if (counter) counter.textContent = `${filtered.length} kayıt`;

    const body = document.getElementById('logBody');
    if (!body) return;

    if (!filtered.length) {
      body.innerHTML = '<div class="empty-state" style="padding:30px;"><i class="fas fa-clipboard-list"></i><p>Kriterlere uygun log bulunamadı</p></div>';
      return;
    }

    body.innerHTML = filtered.slice(0, 150).map(l =>
      UI.logItem(l, `App.showLogDetail(${l.id})`)
    ).join('')
    + (filtered.length > 150
        ? `<p style="text-align:center;font-size:11px;color:var(--text3);padding:8px 0;">+${filtered.length - 150} kayıt daha (aramayı daraltın)</p>`
        : '');
  },

  _filterLogs() { this._renderLogBody(); },

            <span class="badge" style="background:${cat.bg};color:${cat.color};">${cat.label}</span>

          <div style="font-size:13px;margin-top:4px;color:var(--text);">${UI.escHtml(log.details)}</div>

        ${metaRows.length ? `

  if (existing) {

  /* 🆕 Bakım Yapıldı Modal */
  /* 🆕 Ayarlardan araç aksiyonu — tek araç varsa direkt, çoklu ise seçtir */
  async pickVehicleForAction(action) {
    Swal.close();
    await new Promise(r => setTimeout(r, 150));

    const vehicles = state.araclar || [];
    if (vehicles.length === 0) {
      Swal.fire({
        icon: 'info',
        title: 'Araç Yok',
        text: 'Önce bir araç ekleyin (Araçları Yönet → Yeni Araç Ekle).',
        confirmButtonText: 'Tamam'
      });
      return;
    }

    let selectedVehicle;
    if (vehicles.length === 1) {
      selectedVehicle = vehicles[0];
    } else {
      const options = {};
      vehicles.forEach((v, idx) => {
        const model = `${v.marka || ''} ${v.model || ''}`.trim();
        options[idx] = `${v.plaka || '—'}${model ? ' · ' + model : ''}`;
      });

      const { value } = await Swal.fire({
        title: 'Araç Seç',
        input: 'select',
        inputOptions: options,
        inputPlaceholder: 'Bir araç seçin',
        showCancelButton: true,
        confirmButtonText: 'Devam',
        cancelButtonText: 'İptal',
        width: Math.min(420, window.innerWidth - 24)
      });

      if (value === undefined || value === null || value === '') return;
      selectedVehicle = vehicles[parseInt(value, 10)];
    }

    if (!selectedVehicle) return;

    if (action === 'bakim') {
      await this.openBakimYapModal(selectedVehicle.id);
    } else if (action === 'gecmis') {
      await this.showBakimGecmisi(selectedVehicle.id);
    }
  },

          document.getElementById('gCeyrek').value = r.ceyrek.toFixed(2);
        } else {
          el.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:var(--warning);"></i> API ulaşılamadı · Elle girin`;
          el.style.color = 'var(--warning)';
        }

      preConfirm: () => ({

      })

        await saveAyarlar();
        showToast('✅ Altın kurları güncellendi');
        await this.loadPage(this.currentPage);
      }
    });
  },

  async resetAll() {
  const r = await Swal.fire({
    icon: 'warning',
    title: 'Emin misiniz?',
    text: 'TÜM veriler (gelir, gider, borç, arşiv, log, yedek) silinecek! Bu işlem geri alınamaz.',
    showCancelButton: true,
    confirmButtonColor: '#DC2626',
    confirmButtonText: 'Evet, Her Şeyi Sil',
    cancelButtonText: 'İptal'
  });
  if (!r.isConfirmed) return;

const stores = ['gelirler','giderler','borcalacaklar','kategoriler','limitler','ayarlar','archives','logs','backups','araclar','notifications'];
    try {
    // Her store'u atomik olarak temizle (queueSave sırasına uy)
    for (const s of stores) {
      await queueSave(() => new Promise((res, rej) => {
        const tx = db.transaction(s, 'readwrite');
        tx.objectStore(s).clear();
        tx.oncomplete = () => res();
        tx.onerror    = () => rej(tx.error);
      }));
    }
    // State'i varsayılana döndür
    state.gelirler = [];
    state.giderler = [];
    state.borcalacaklar = [];
    state.archives = {};
    state.logs = [];
    state.backups = [];
    state.limitler = {};
    state.araclar = [];
    // YANLIŞ olan satırı sil, tek bir tane bırak:
    state.kategoriler = {
      gelir: ['Maaş','Serbest Çalışma','Yatırım','Hediye','Kira Geliri','Diğer'],
      gider: ['Market','Fatura','Eğlence','Ulaşım','Sağlık','Eğitim','Yemek','Alışveriş','Akaryakıt','Diğer']
    };
    state.ayarlar = {
      varsayilanRaporAraligi: 'ay',
      gramAltinFiyati: 6400,
      ceyrekAltinFiyati: 10500
    };
    localStorage.removeItem('butcem_migrate_done');

    Swal.close();
    showToast('🗑️ Tüm veriler sıfırlandı');
        // 🆕 App state sıfırla (UI'nin temiz başlaması için)
    this._recentTab = 'tum';
    this._recentPage = 1;
    this._islemTip = 'gider';
    this._islemListTab = 'tum';
    this._islemListPage = 1;
    this._borcFilter = 'tum';
    this._fuelFilter = { q: '', range: 'tum', tip: 'tum' };
    this._fuelPage = 1;
    this._archivingLock = false;
    this._archiveOpenYears = null;
    _lastBackupTime = 0;
    
    await this.loadPage('dashboard');
  } catch (e) {
    console.error('[resetAll] Hata:', e);
    Swal.close();
    Swal.fire({ icon: 'error', title: 'Sıfırlama Hatası', text: e.message || 'Bilinmeyen hata' });
  }
},

  async exportToPDF() {
    if (typeof window.jspdf === 'undefined') {
      showToast('❌ PDF motoru yüklenemedi. İnternet bağlantınızı kontrol edin.');
      return;
    }
    const rStart = this._raporStart;
    const rEnd   = this._raporEnd;
    const gelirlerFiltre = Calc._allGelirler().filter(g => g.tarih >= rStart && g.tarih <= rEnd);
    const giderlerFiltre = Calc._allGiderler().filter(g => g.tarih >= rStart && g.tarih <= rEnd);

    Swal.fire({
      title: 'PDF hazırlanıyor...',
      html: 'Türkçe font ve kapsamlı analizler yükleniyor',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      const M = 15;

      const hasUni = await _loadPdfFonts(doc);
      const FONT = hasUni ? 'Roboto' : 'helvetica';

      // ─── HESAPLAMALAR ───
      const gelirT = Calc._toplamGelirTum({ start: rStart, end: rEnd });
      const giderT = Calc._toplamGiderTum({ start: rStart, end: rEnd });
      const bakiye = gelirT - giderT;
      const borcT = Calc.aktifBorcAlacak();
      const gunFark = Math.max(1, dayjs(rEnd).diff(dayjs(rStart), 'day') + 1);
      const avgGun = giderT / gunFark;
      const tasarrufOrani = gelirT > 0 ? ((gelirT - giderT) / gelirT) * 100 : 0;
      const katG = Calc._kategoriGiderlerTum({ start: rStart, end: rEnd });
      const sortedKat = Object.entries(katG).sort((a, b) => b[1] - a[1]).slice(0, 10);

      // Ay bazlı özet
      const ayBazli = {};
      [...gelirlerFiltre.map(x=>({...x,_tip:'gelir'})), ...giderlerFiltre.map(x=>({...x,_tip:'gider'}))].forEach(tx => {
        const key = dayjs(tx.tarih).format('YYYY-MM');
        if (!ayBazli[key]) ayBazli[key] = { gelir: 0, gider: 0, islem: 0 };
        if (tx._tip === 'gelir') ayBazli[key].gelir += Number(tx.miktar) || 0;
        else ayBazli[key].gider += Number(tx.miktar) || 0;
        ayBazli[key].islem++;
      });
      const ayList = Object.entries(ayBazli).sort((a,b) => a[0].localeCompare(b[0]));

      // ─── KAPAK ───
      doc.setFillColor(15, 42, 92);
      doc.rect(0, 0, W, 55, 'F');
      doc.setFillColor(30, 64, 175);
      doc.rect(0, 30, W, 25, 'F');
      doc.setFillColor(59, 130, 246);
      doc.circle(W - 20, 12, 34, 'F');
      doc.setFillColor(30, 64, 175);
      doc.circle(W - 20, 12, 26, 'F');

      doc.setFont(FONT, 'bold');
      doc.setFontSize(26);
      doc.setTextColor(255, 255, 255);
      _txt(doc, 'EBHA MANİ', M, 22, null, hasUni);

      doc.setFont(FONT, 'normal');
      doc.setFontSize(11);
      doc.setTextColor(219, 234, 254);
      _txt(doc, 'Kapsamlı Finansal Rapor', M, 34, null, hasUni);

      doc.setFontSize(9);
      _txt(doc, dayjs().format('DD MMMM YYYY · HH:mm'), W - M, 48, { align: 'right' }, hasUni);

      // ─── DÖNEM BİLGİSİ ───
      let y = 65;
      doc.setFillColor(247, 248, 250);
      doc.roundedRect(M, y, W - 2 * M, 12, 2, 2, 'F');
      doc.setFont(FONT, 'normal');
      doc.setFontSize(10);
      doc.setTextColor(61, 74, 92);
      _txt(doc, `Rapor Dönemi: ${dayjs(rStart).format('DD MMM YYYY')} → ${dayjs(rEnd).format('DD MMM YYYY')} (${gunFark} gün)`, M + 4, y + 8, null, hasUni);
      y += 20;

      // ─── 1. SATIR: GELİR / GİDER / NET / TASARRUF ───
      const cw = (W - 2 * M - 9) / 4;
      const ch = 24;
      _kart(doc, M,             y, cw, ch, { label: 'Toplam Gelir', value: Calc.fmt(gelirT),        accent: [5,150,105]   }, hasUni, FONT);
      _kart(doc, M + cw + 3,    y, cw, ch, { label: 'Toplam Gider', value: Calc.fmt(giderT),        accent: [220,38,38]   }, hasUni, FONT);
      _kart(doc, M + (cw+3)*2,  y, cw, ch, { label: 'Net Bakiye',   value: Calc.fmt(bakiye),        accent: [37,99,235]   }, hasUni, FONT);
      _kart(doc, M + (cw+3)*3,  y, cw, ch, { label: 'Tasarruf',     value: `%${tasarrufOrani.toFixed(1)}`, accent: tasarrufOrani >= 20 ? [5,150,105] : (tasarrufOrani > 0 ? [217,119,6] : [185,28,28]) }, hasUni, FONT);
      y += ch + 8;

      // ─── 2. SATIR: İŞLEM / GÜNLÜK ORT / BORÇ / EN YÜKSEK KAT ───
      _kart(doc, M,             y, cw, ch, { label: 'İşlem',        value: String(gelirlerFiltre.length + giderlerFiltre.length), accent: [37,99,235] }, hasUni, FONT);
      _kart(doc, M + cw + 3,    y, cw, ch, { label: 'Günlük Ort.',  value: Calc.fmt(avgGun),        accent: [217,119,6]   }, hasUni, FONT);
      _kart(doc, M + (cw+3)*2,  y, cw, ch, { label: 'Aktif Borç',   value: Calc.fmt(borcT),         accent: [146,64,14]   }, hasUni, FONT);
      _kart(doc, M + (cw+3)*3,  y, cw, ch, { label: 'En Yüksek Kat', value: sortedKat.length ? String(sortedKat[0][0]).substring(0, 12) : '—', accent: [8,145,178] }, hasUni, FONT);
      y += ch + 12;

      // ─── KATEGORİ ANALİZİ ───
      if (sortedKat.length > 0) {
        _baslik(doc, 'KATEGORİ ANALİZİ', y, hasUni, FONT);
        y += 10;

        const maxKat = sortedKat[0][1];
        const palet = [[37,99,235],[5,150,105],[217,119,6],[220,38,38],[124,58,237],[8,145,178],[234,88,12],[219,39,119],[100,116,139],[71,85,105]];

        sortedKat.forEach(([kat, val], i) => {
          if (y > H - 30) { doc.addPage(); y = 20; }
          const renk = palet[i % palet.length];
          const yuzde = giderT > 0 ? (val / giderT) * 100 : 0;

          doc.setFont(FONT, 'normal');
          doc.setFontSize(9);
          doc.setTextColor(15, 23, 42);
          _txt(doc, String(kat).substring(0, 16), M, y + 3, null, hasUni);

          doc.setTextColor(123, 138, 158);
          doc.setFontSize(7.5);
          _txt(doc, `%${yuzde.toFixed(1)}`, M + 55, y + 3, null, hasUni);

          _bar(doc, M + 70, y - 1, W - M - 70 - 30, 3, val / maxKat, renk);

          doc.setFont(FONT, 'bold');
          doc.setTextColor(...renk);
          doc.setFontSize(9);
          _txt(doc, Calc.fmt(val), W - M, y + 3, { align: 'right' }, hasUni);
          y += 8;
        });
        y += 4;
      }

      // ─── AYLIK DÖKÜM ───
      if (ayList.length > 0 && y < H - 60) {
        if (y > H - 80) { doc.addPage(); y = 20; }
        _baslik(doc, 'AYLIK DÖKÜM', y, hasUni, FONT);
        y += 10;

        doc.setFillColor(248, 250, 252);
        doc.rect(M, y - 4, W - 2 * M, 6, 'F');
        doc.setFont(FONT, 'bold');
        doc.setFontSize(7.5);
        doc.setTextColor(100, 116, 139);
        _txt(doc, 'AY',      M + 3,   y, null, hasUni);
        _txt(doc, 'GELİR',   M + 45,  y, null, hasUni);
        _txt(doc, 'GİDER',   M + 90,  y, null, hasUni);
        _txt(doc, 'NET',     M + 130, y, null, hasUni);
        _txt(doc, 'İŞLEM',   M + 170, y, { align: 'right' }, hasUni);
        y += 5;

        ayList.slice(-12).forEach(([key, d], idx) => {
          if (y > H - 20) { doc.addPage(); y = 20; }
          if (idx % 2 === 0) {
            doc.setFillColor(252, 253, 255);
            doc.rect(M, y - 4, W - 2 * M, 6.5, 'F');
          }
          const net = d.gelir - d.gider;
          doc.setFont(FONT, 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(15, 23, 42);
          _txt(doc, dayjs(key + '-01').format('MMM YYYY'), M + 3, y, null, hasUni);
          doc.setTextColor(5, 150, 105);
          _txt(doc, Calc.fmt(d.gelir), M + 45, y, null, hasUni);
          doc.setTextColor(220, 38, 38);
          _txt(doc, Calc.fmt(d.gider), M + 90, y, null, hasUni);
          doc.setFont(FONT, 'bold');
          doc.setTextColor(...(net >= 0 ? [37,99,235] : [220,38,38]));
          _txt(doc, Calc.fmt(net), M + 130, y, null, hasUni);
          doc.setFont(FONT, 'normal');
          doc.setTextColor(100, 116, 139);
          _txt(doc, String(d.islem), M + 170, y, { align: 'right' }, hasUni);
          y += 6.5;
        });
        y += 6;
      }

      // ─── GRAFİKLER ───
      if (sortedKat.length > 0 && typeof Chart !== 'undefined') {
        try {
          if (y > H - 100) { doc.addPage(); y = 20; }
          _baslik(doc, 'GİDER DAĞILIMI', y, hasUni, FONT);
          y += 8;

          const palet = [[37,99,235],[5,150,105],[217,119,6],[220,38,38],[124,58,237],[8,145,178],[234,88,12],[219,39,119]];
          const donutData = {
            labels: sortedKat.map(([k]) => k),
            datasets: [{ data: sortedKat.map(([, v]) => v), backgroundColor: sortedKat.map((_, i) => `rgb(${palet[i % palet.length].join(',')})`), borderWidth: 0 }]
          };
          const donutBase64 = await _renderChartToBase64('doughnut', donutData, {
            plugins: { legend: { position: 'right', labels: { font: { size: 11 }, padding: 10, boxWidth: 14 } } }
          });
          if (donutBase64) {
            const imgW = W - 2 * M;
            const imgH = 80;
            doc.addImage(donutBase64, 'PNG', M, y, imgW, imgH);
            y += imgH + 8;
          }

          if (y > H - 90) { doc.addPage(); y = 20; }
          _baslik(doc, 'AYLIK GELİR/GİDER TRENDİ', y, hasUni, FONT);
          y += 8;

          const monthCount = Math.max(1, Math.min(12, dayjs(rEnd).diff(dayjs(rStart), 'month') + 1));
          const trend = Calc.aylikTrendBetween(rStart, rEnd, monthCount);
          const lineData = {
            labels: trend.map(t => t.label),
            datasets: [
              { label: 'Gelir', data: trend.map(t => t.gelir), borderColor: '#059669', backgroundColor: 'rgba(5,150,105,.1)', borderWidth: 2, fill: true, tension: 0.3 },
              { label: 'Gider', data: trend.map(t => t.gider), borderColor: '#DC2626', backgroundColor: 'rgba(220,38,38,.1)', borderWidth: 2, fill: true, tension: 0.3 }
            ]
          };
          const lineBase64 = await _renderChartToBase64('line', lineData, {
            plugins: { legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 14 } } },
            scales: { y: { ticks: { callback: v => 'TL ' + v.toLocaleString('tr-TR') }, grid: { color: 'rgba(148,163,184,.15)' } }, x: { grid: { display: false } } }
          });
          if (lineBase64) {
            const imgW = W - 2 * M;
            const imgH = 70;
            doc.addImage(lineBase64, 'PNG', M, y, imgW, imgH);
            y += imgH + 10;
          }
        } catch (chartErr) {
          console.warn('[PDF] Grafik ekleme hatası:', chartErr);
        }
      }

      // ─── AKARYAKIT ANALİZİ ───
      const fuelStats = Calc.fuelStats({ start: rStart, end: rEnd });
      if (fuelStats.count > 0) {
        if (y > H - 60) { doc.addPage(); y = 20; }
        _baslik(doc, 'AKARYAKIT ANALİZİ', y, hasUni, FONT);
        y += 10;

        const l = fuelStats.lpg;
        const b = fuelStats.benzin;

        const fcw = (W - 2 * M - 6) / 3;
        _kart(doc, M,             y, fcw, 20, { label: 'LPG Litre', value: l.totalLitre.toFixed(2) + ' L', accent: [8,145,178] }, hasUni, FONT);
        _kart(doc, M + fcw + 3,   y, fcw, 20, { label: 'LPG Tutar', value: Calc.fmt(l.totalTL),        accent: [185,28,28] }, hasUni, FONT);
        _kart(doc, M + (fcw+3)*2, y, fcw, 20, { label: 'LPG L/100km', value: l.avgL100 > 0 ? l.avgL100.toFixed(2) : '—', accent: [217,119,6] }, hasUni, FONT);
        y += 26;

        doc.setFont(FONT, 'normal');
        doc.setFontSize(9);
        doc.setTextColor(61, 74, 92);
        _txt(doc, `Ölçülen KM: ${l.totalKm.toLocaleString('tr-TR')} km  ·  Ort. TL/km: ${l.avgTlPerKm > 0 ? l.avgTlPerKm.toFixed(3) : '—'}  ·  Ort. TL/L: ${l.avgFiyat.toFixed(2)}`, M + 2, y, null, hasUni);
        y += 6;
        if (b.count > 0) {
          _txt(doc, `Benzin (yardımcı): ${b.count} dolum · ${b.totalLitre.toFixed(2)} L · ${Calc.fmt(b.totalTL)}`, M + 2, y, null, hasUni);
          y += 6;
        }
        y += 6;
      }

      // ─── EN YÜKSEK 5 GİDER + GELİR ───
      const topGiderler = [...giderlerFiltre].sort((a,b) => (Number(b.miktar)||0) - (Number(a.miktar)||0)).slice(0, 5);
      const topGelirler = [...gelirlerFiltre].sort((a,b) => (Number(b.miktar)||0) - (Number(a.miktar)||0)).slice(0, 5);

      const tabloYaz = (list, baslik, renk, isaret) => {
        if (!list.length) return;
        if (y > H - 60) { doc.addPage(); y = 20; }
        _baslik(doc, baslik, y, hasUni, FONT);
        y += 10;
        doc.setFillColor(248, 250, 252);
        doc.rect(M, y - 4, W - 2 * M, 6, 'F');
        doc.setFont(FONT, 'bold');
        doc.setFontSize(7.5);
        doc.setTextColor(100, 116, 139);
        _txt(doc, 'TARİH',     M + 3,   y, null, hasUni);
        _txt(doc, 'KATEGORİ',  M + 28,  y, null, hasUni);
        _txt(doc, 'AÇIKLAMA',  M + 78,  y, null, hasUni);
        _txt(doc, 'TUTAR',     W - M - 3, y, { align: 'right' }, hasUni);
        y += 5;
        list.forEach((item, idx) => {
          if (y > H - 20) { doc.addPage(); y = 20; }
          if (idx % 2 === 0) {
            doc.setFillColor(252, 253, 255);
            doc.rect(M, y - 4, W - 2 * M, 6.5, 'F');
          }
          doc.setFont(FONT, 'normal');
          doc.setFontSize(8.5);
          doc.setTextColor(71, 85, 105);
          _txt(doc, item.tarih || '', M + 3, y, null, hasUni);
          doc.setTextColor(15, 23, 42);
          _txt(doc, String(item.kategori || '').substring(0, 18), M + 28, y, null, hasUni);
          doc.setTextColor(148, 163, 184);
          _txt(doc, String(item.aciklama || '—').substring(0, 26), M + 78, y, null, hasUni);
          doc.setFont(FONT, 'bold');
          doc.setTextColor(...renk);
          _txt(doc, isaret + Calc.fmt(item.miktar), W - M - 3, y, { align: 'right' }, hasUni);
          y += 6.5;
        });
        y += 4;
      };
      tabloYaz(topGiderler, 'EN YÜKSEK 5 GİDER', [220, 38, 38], '-');
      tabloYaz(topGelirler, 'EN YÜKSEK 5 GELİR', [5, 150, 105], '+');

      // ─── BORÇ / ALACAK ───
      const aktifBorclar = state.borcalacaklar.filter(x => !x.odendiMi);
      if (aktifBorclar.length) {
        if (y > H - 50) { doc.addPage(); y = 20; }
        _baslik(doc, 'BORÇ & ALACAK', y, hasUni, FONT);
        y += 10;
        aktifBorclar.slice(0, 20).forEach(function(borcItem) {
          if (y > H - 30) { doc.addPage(); y = 20; }
          const birim      = borcItem.birim || 'tl';
          const birimFiyat = Calc.birimFiyat(birim);
          const miktarNum  = Number(borcItem.miktar) || 0;
          const paid       = (borcItem.payments || []).reduce((s, p) => s + (Number(p.miktar) || 0), 0);
          const kalan      = Math.max(0, miktarNum - paid);
          const isAl       = borcItem.tip === 'alacak';
          const renk       = isAl ? [5, 150, 105] : [217, 119, 6];
          _roundRect(doc, M, y - 4, W - 2 * M, 15, 2, [252, 253, 255], [226, 232, 240]);
          doc.setFillColor(...renk);
          doc.roundedRect(M + 3, y - 2, 14, 4.5, 1, 1, 'F');
          doc.setFont(FONT, 'bold');
          doc.setFontSize(6);
          doc.setTextColor(255, 255, 255);
          _txt(doc, isAl ? 'ALACAK' : 'BORÇ', M + 10, y + 0.5, { align: 'center' }, hasUni);
          doc.setFont(FONT, 'bold');
          doc.setFontSize(9);
          doc.setTextColor(15, 23, 42);
          _txt(doc, String(borcItem.kisiAdi || '').substring(0, 30), M + 20, y + 1, null, hasUni);
          const miktarGosterim = birim === 'tl'
            ? Calc.fmt(miktarNum)
            : `${miktarNum.toLocaleString('tr-TR', { maximumFractionDigits: 2 })} ${Calc.birimKisa(birim)} (${Calc.fmt(miktarNum * birimFiyat)})`;
          doc.setFontSize(9);
          doc.setTextColor(...renk);
          _txt(doc, miktarGosterim, W - M - 3, y + 1, { align: 'right' }, hasUni);
          const pct = miktarNum > 0 ? Math.min(1, paid / miktarNum) : 0;
          _bar(doc, M + 3, y + 5, 40, 2, pct, renk);
          doc.setFont(FONT, 'normal');
          doc.setFontSize(7);
          doc.setTextColor(148, 163, 184);
          _txt(doc, `%${Math.round(pct * 100)} ödendi`, M + 45, y + 6.5, null, hasUni);
          if (kalan > 0) {
            const kalanGosterim = birim === 'tl'
              ? `Kalan: ${Calc.fmt(kalan)}`
              : `Kalan: ${kalan.toLocaleString('tr-TR', { maximumFractionDigits: 2 })} ${Calc.birimKisa(birim)} (${Calc.fmt(kalan * birimFiyat)})`;
            _txt(doc, kalanGosterim, W - M - 3, y + 6.5, { align: 'right' }, hasUni);
          } else {
            doc.setTextColor(...renk);
            doc.setFont(FONT, 'bold');
            _txt(doc, '✓ Tamamlandı', W - M - 3, y + 6.5, { align: 'right' }, hasUni);
          }
          y += 17;
        });
      }

      // ─── FOOTER ───
      const total = doc.internal.getNumberOfPages();
      for (let i = 1; i <= total; i++) {
        doc.setPage(i);
        _footer(doc, i, total, hasUni, FONT);
      }

      doc.save(`ebhamani_rapor_${dayjs().format('YYYY-MM-DD_HHmm')}.pdf`);
      Swal.close();
      showToast('📄 PDF indirildi!');
    } catch (err) {
      console.error('[PDF] Hata:', err);
      Swal.close();
      Swal.fire({ icon: 'error', title: 'PDF Hatası', text: err.message || 'Rapor oluşturulamadı.' });
    }
  },


  async exportToExcel() {
    if (typeof window.XLSX === 'undefined') {
      showToast('❌ Excel motoru yüklenemedi. İnternet bağlantınızı kontrol edin.');
      return;
    }
    try {
      const rStart = this._raporStart;
      const rEnd   = this._raporEnd;
      const gelirlerFiltre = Calc._allGelirler().filter(g => g.tarih >= rStart && g.tarih <= rEnd);
      const giderlerFiltre = Calc._allGiderler().filter(g => g.tarih >= rStart && g.tarih <= rEnd);

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
        gelirlerFiltre.map(g=>({ Tip:'Gelir', Miktar:g.miktar, Kategori:g.kategori, Tarih:g.tarih, Aciklama:g.aciklama||'' }))
      ), 'Gelirler');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
        giderlerFiltre.map(g=>({ Tip:'Gider', Miktar:g.miktar, Kategori:g.kategori, Tarih:g.tarih, Aciklama:g.aciklama||'' }))
      ), 'Giderler');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
        state.borcalacaklar.map(b=>({
          Tip: b.tip==='alacak'?'Alacak':'Borç',
          Kisi: b.kisiAdi,
          Birim: Calc.birimAdi(b.birim || 'tl'),
          Miktar: b.miktar,
          Odenen: (b.payments||[]).reduce((s,p)=>s+p.miktar,0),
          Kalan: b.miktar - (b.payments||[]).reduce((s,p)=>s+p.miktar,0),
          Tarih: b.tarih,
          Durum: b.odendiMi?'Tamamlandı':'Devam Ediyor',
          Aciklama: b.aciklama||''
        }))
      ), 'Borç_Alacak');
      XLSX.writeFile(wb, `ebhamani_veri_${dayjs().format('YYYY-MM-DD_HHmm')}.xlsx`);
      showToast('📊 Excel indirildi!');
    } catch(e) {
      Swal.fire({ icon:'error', title:'Excel Hatası', text:'Dosya oluşturulamadı.' });
    }
  },

  async importFromJSON(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const raw = JSON.parse(e.target.result);
        // downloadBackup → { data: { gelirler... } } yapısında kaydeder
        const data = (raw.data && !raw.gelirler) ? raw.data : raw;
        const asArr = v => Array.isArray(v)
          ? v.filter(x => x && typeof x === 'object' && x.miktar != null && !isNaN(Number(x.miktar)) && x.tarih)
          : [];

        const newGelirler      = asArr(data.gelirler);
        const newGiderler      = asArr(data.giderler);
        const newBorcalacaklar = Array.isArray(data.borcalacaklar)
          ? data.borcalacaklar.filter(b => b && typeof b === 'object' && b.kisiAdi && b.miktar != null)
          : [];

        let newKategoriler = { ...state.kategoriler };
        if (data.kategoriler && data.kategoriler.gelir && data.kategoriler.gider) {
          newKategoriler = {
            gelir: Array.isArray(data.kategoriler.gelir) ? data.kategoriler.gelir : state.kategoriler.gelir,
            gider: Array.isArray(data.kategoriler.gider) ? data.kategoriler.gider : state.kategoriler.gider
          };
          if (!newKategoriler.gider.includes('Akaryakıt')) newKategoriler.gider.push('Akaryakıt');
        }

        let newLimitler = {};
        if (data.limitler && typeof data.limitler === 'object' && !Array.isArray(data.limitler)) {
          Object.entries(data.limitler).forEach(([k, v]) => {
            const num = Number(v);
            if (!isNaN(num) && num > 0) newLimitler[k] = num;
          });
        }

        let newArchives = {};
        if (data.archives && typeof data.archives === 'object' && !Array.isArray(data.archives)) {
          Object.entries(data.archives).forEach(([k, v]) => {
            if (!/^\d{4}-\d{2}$/.test(k)) return;
            if (!v || typeof v !== 'object') return;
            newArchives[k] = {
              gelirler:      Array.isArray(v.gelirler)      ? v.gelirler      : [],
              giderler:      Array.isArray(v.giderler)      ? v.giderler      : [],
              borcalacaklar: Array.isArray(v.borcalacaklar) ? v.borcalacaklar : [],
              loglar:        Array.isArray(v.loglar)        ? v.loglar        : [],
              salaryMonthRange: v.salaryMonthRange || SalaryMonth.range(k),
              year:             v.year || k.substring(0, 4),
              archivedAt:       v.archivedAt || new Date().toISOString(),
              schemaVersion:    v.schemaVersion || 3,
              pdfDataUrl:       typeof v.pdfDataUrl === 'string' ? v.pdfDataUrl : null,
              pdfGeneratedAt:   v.pdfGeneratedAt || null
            };
          });
        }

        let newAraclar = [];
        if (Array.isArray(data.araclar)) {
          newAraclar = data.araclar.filter(a =>
            a && typeof a === 'object' && a.plaka
          ).map(a => ({ ...a, id: a.id || Date.now() + Math.random() }));
        }

        let newAyarlar = { ...state.ayarlar };
        if (data.ayarlar && typeof data.ayarlar === 'object') {
          newAyarlar = {
            varsayilanRaporAraligi: data.ayarlar.varsayilanRaporAraligi || 'ay',
            gramAltinFiyati:        Number(data.ayarlar.gramAltinFiyati) || 6400,
            ceyrekAltinFiyati:      Number(data.ayarlar.ceyrekAltinFiyati) || 10500
          };
        }

        // Onay iste
        const onay = await Swal.fire({
          icon: 'warning',
          title: 'Yedeği Yükle',
          html: `<div style="text-align:left;">
            <p style="margin-bottom:8px;">Yedek dosyası: <strong>${UI.escHtml(file.name)}</strong></p>
            <div style="padding:12px;background:var(--surface2);border-radius:10px;margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                <span>Gelirler:</span><strong>${newGelirler.length}</strong>
              </div>
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                <span>Giderler:</span><strong>${newGiderler.length}</strong>
              </div>
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                <span>Borç/Alacak:</span><strong>${newBorcalacaklar.length}</strong>
              </div>
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                <span>Arşivler:</span><strong>${Object.keys(newArchives).length}</strong>
              </div>
              <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
                <span>Araçlar:</span><strong>${newAraclar.length}</strong>
              </div>
            </div>
            <p style="font-size:12px;color:#DC2626;font-weight:600;">⚠️ Mevcut verileriniz TAMAMEN DEĞİŞTİRİLECEK!</p>
            <p style="font-size:11px;color:#94a3b8;margin-top:6px;">Devam etmeden önce mevcut verilerinizin JSON yedeğini almanız önerilir.</p>
          </div>`,
          showCancelButton: true,
          confirmButtonText: 'Evet, Yükle',
          cancelButtonText: 'İptal',
          confirmButtonColor: '#DC2626',
          width: Math.min(500, window.innerWidth - 24)
        });
        if (!onay.isConfirmed) return;
                // 🆕 Ön yedek (yanlış import geri dönülemez, bu güvence sağlar)
        try {
          const preBackup = {
            _type: 'pre_import_auto_backup',
            _timestamp: new Date().toISOString(),
            gelirler: state.gelirler,
            giderler: state.giderler,
            borcalacaklar: state.borcalacaklar,
            kategoriler: state.kategoriler,
            limitler: state.limitler,
            archives: state.archives,
            ayarlar: state.ayarlar
          };
          const json = JSON.stringify(preBackup);
          // Boyut kontrolü: 2MB sınırı
          if (json.length < 2 * 1024 * 1024) {
            localStorage.setItem('pre_import_backup', json);
            localStorage.setItem('pre_import_backup_date', new Date().toISOString());
          } else {
            console.warn("[import] Ön yedek çok büyük (>2MB), localStorage'a kaydedilmedi");          }
        } catch (_) {
          /* sessiz geç — ön yedek zorunlu değil */
        }

        state.gelirler      = newGelirler;
        state.giderler      = newGiderler;
        state.borcalacaklar = newBorcalacaklar.map(b => ({ ...b, birim: b.birim || 'tl' }));
        state.kategoriler   = newKategoriler;
        state.limitler      = newLimitler;
        state.archives      = newArchives;
        state.ayarlar       = newAyarlar;
        state.araclar       = newAraclar;
        state.logs          = [];

        await saveAllData();
        await addLog('json_import', `${file.name} (${newGelirler.length + newGiderler.length} işlem)`);
        showToast('✅ Yedek başarıyla yüklendi!');
        await this.loadPage(this.currentPage);
      } catch (err) {
        console.error('[import] Hata:', err);
        Swal.fire({ icon:'error', title:'Geçersiz Dosya', text: err.message || 'JSON formatı hatalı veya eksik.' });
      }
    };
    reader.onerror = () => {
      Swal.fire({ icon:'error', title:'Dosya Okunamadı', text:'Dosya bozuk veya okunamıyor.' });
    };
    reader.readAsText(file);
  },

    const backup = state.backups.find(b => b.id == backupId);

    URL.revokeObjectURL(url);
  },
    /* 🆕 FAZ 2 — Karşılaştırma select'leri doldur */
  _fillKarsilastirmaSelects() {
    const keys = new Set();
    [SalaryMonth.currentKey(), SalaryMonth.previousKey()].forEach(k => keys.add(k));
    state.gelirler.forEach(g => { if (g.tarih) keys.add(SalaryMonth.keyOf(g.tarih)); });
    state.giderler.forEach(g => { if (g.tarih) keys.add(SalaryMonth.keyOf(g.tarih)); });
    Object.keys(state.archives).forEach(k => keys.add(k));

    const sorted = [...keys].sort().reverse();
    const opts = sorted.map(k => `<option value="${k}">${SalaryMonth.shortLabel(k)}</option>`).join('');

    const s1 = document.getElementById('cmpKey1');
    const s2 = document.getElementById('cmpKey2');
    const prevVal1 = s1?.value;
    const prevVal2 = s2?.value;

    if (s1) {
      s1.innerHTML = opts;
      s1.value = (prevVal1 && keys.has(prevVal1)) ? prevVal1 : SalaryMonth.currentKey();
      if (!s1.value) s1.value = sorted[0] || '';
    }
    if (s2) {
      s2.innerHTML = opts;
      s2.value = (prevVal2 && keys.has(prevVal2)) ? prevVal2 : SalaryMonth.previousKey();
      if (!s2.value) s2.value = sorted[1] || sorted[0] || '';
    }

    this.renderKarsilastirma();
  },

  /* 🆕 FAZ 2 — Karşılaştırma render */
  renderKarsilastirma() {
    const k1 = document.getElementById('cmpKey1')?.value;
    const k2 = document.getElementById('cmpKey2')?.value;
    if (!k1 || !k2) return;

    const c = Calc.donemKarsilastir(k1, k2);
    const el = document.getElementById('karsilastirmaBody');
    if (!el) return;

    const fark = (a, b) => {
      const d = a - b;
      if (Math.abs(d) < 0.01) return { text: '≈', renk: 'var(--text3)', ok: true };
      if (b === 0 && a > 0) return { text: 'YENİ', renk: 'var(--primary)', ok: false };
      const pct = b !== 0 ? Math.round((d / b) * 100) : 0;
      return {
        text: `${d > 0 ? '+' : ''}${pct}%`,
        renk: d > 0 ? 'var(--danger)' : 'var(--accent)',
        ok: d < 0
      };
    };

    const satir = (label, v1, v2, tersMi = false) => {
      let f = fark(v1, v2);
      if (tersMi) f.renk = v1 > v2 ? 'var(--accent)' : (v1 < v2 ? 'var(--danger)' : 'var(--text3)');
      return `<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);align-items:center;">
        <div style="text-align:right;font-size:12px;font-weight:700;color:var(--text);">${Calc.fmt(v1)}</div>
        <div style="text-align:center;min-width:60px;">
          <div style="font-size:9.5px;color:var(--text3);text-transform:uppercase;font-weight:600;">${label}</div>
          <div style="font-size:10.5px;font-weight:800;color:${f.renk};">${f.text}</div>
        </div>
        <div style="text-align:left;font-size:12px;font-weight:700;color:var(--text);">${Calc.fmt(v2)}</div>
      </div>`;
    };

    const katFark = (() => {
      const t1 = Object.entries(c.data1.kats).sort((a,b)=>b[1]-a[1]).slice(0,3);
      const t2 = Object.entries(c.data2.kats).sort((a,b)=>b[1]-a[1]).slice(0,3);
      const allKats = new Set([...t1.map(x=>x[0]), ...t2.map(x=>x[0])]);
      return [...allKats].map(k => ({
        kat: k,
        v1: c.data1.kats[k] || 0,
        v2: c.data2.kats[k] || 0
      })).sort((a, b) => Math.max(b.v1, b.v2) - Math.max(a.v1, a.v2)).slice(0, 5);
    })();

    el.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:10px;padding:0 4px;">
        <div style="text-align:right;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;">${c.label1}</div>
        <div></div>
        <div style="text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;">${c.label2}</div>
      </div>
      ${satir('Gelir', c.data1.gelir, c.data2.gelir, true)}
      ${satir('Gider', c.data1.gider, c.data2.gider)}
      ${satir('Net', c.data1.net, c.data2.net, true)}
      ${satir('İşlem', c.data1.islem, c.data2.islem, true)}

      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
        <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;">Kategori Karşılaştırma (Top 5)</div>
        ${katFark.map(k => {
          const f = fark(k.v1, k.v2);
          return `<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:6px 0;align-items:center;">
            <div style="text-align:right;font-size:11px;color:var(--text);">${Calc.fmt(k.v1)}</div>
            <div style="text-align:center;min-width:70px;">
              <div style="font-size:10px;color:var(--text2);font-weight:600;">${UI.escHtml(k.kat)}</div>
              <div style="font-size:9.5px;font-weight:800;color:${f.renk};">${f.text}</div>
            </div>
            <div style="text-align:left;font-size:11px;color:var(--text);">${Calc.fmt(k.v2)}</div>
          </div>`;
        }).join('')}
      </div>
    `;
  },

  async downloadChart(chartId, title) {
    const chart = Charts.instances[chartId];
    if (!chart) { showToast('⚠️ Grafik bulunamadı'); return; }
    try {
      const url = chart.toBase64Image('image/png', 1);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${(title || 'grafik').replace(/\s+/g, '_')}_${dayjs().format('YYYY-MM-DD_HHmm')}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('📊 Grafik indirildi');
    } catch (e) {
      showToast('⚠️ Grafik indirilemedi');
    }
  },
  /* 🔔 Bildirim modal */

      title: '🔔 Bildirimler',

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:8px 12px;background:var(--surface2);border-radius:10px;">
          <div style="font-size:12px;color:var(--text2);">
            <strong style="color:var(--danger);">${unread}</strong> okunmamış · ${total} toplam
          </div>
          <div style="display:flex;gap:6px;">
            ${unread > 0 ? `<button onclick="App.markAllNotificationsRead()" style="background:var(--primary);color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;">✓ Tümünü Okundu</button>` : ''}
            ${total > 0 ? `<button onclick="App.clearReadNotifications()" style="background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);padding:6px 10px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;">🗑️ Okunanları Sil</button>` : ''}

      showCloseButton: true
    });
  },

  _buildNotifListHTML() {
    if (!state.notifications.length) {
      return `<div class="empty-state" style="padding:40px 20px;">
        <i class="fas fa-bell-slash"></i>
        <p>Bildirim yok</p>
        <p style="font-size:11px;opacity:.6;margin-top:6px;">Araç, bütçe, vade uyarıları burada toplanır</p>
      </div>`;
    }

    return state.notifications.slice(0, 100).map(n => {
      const def = NotifTypes[n.type] || NotifTypes.info;
      const unreadStyle = !n.read
        ? `background:var(--primary-light);border-left:4px solid ${def.color};`
        : `background:var(--surface);border-left:4px solid var(--border);`;
      const unreadDot = !n.read
        ? `<span style="width:8px;height:8px;background:var(--danger);border-radius:50%;display:inline-block;margin-right:6px;"></span>`

      return `<div onclick="App.showNotificationDetail(${n.id})"

                  onmouseover="this.style.transform='translateX(2px)';this.style.boxShadow='0 2px 8px rgba(15,42,92,.08)'"
                  onmouseout="this.style.transform='translateX(0)';this.style.boxShadow='none'">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;">

            <span style="font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${UI.escHtml(n.title)}</span>
          </div>

        </div>
        <div style="font-size:11.5px;color:var(--text2);padding-left:${!n.read ? '14px' : '0'};line-height:1.4;">
          ${UI.escHtml(n.description)}
        </div>
      </div>`;
    }).join('');
  },

  async showNotificationDetail(id) {
    const n = state.notifications.find(x => x.id == id);
    if (!n) return;

    const def = NotifTypes[n.type] || NotifTypes.info;

    /* Okundu işaretle */
    if (!n.read) await Notifications.markRead(id);

    const priorityMap = {
      'critical': { bg: 'var(--danger)', label: 'KRİTİK' },
      'high':     { bg: 'var(--warning)', label: 'ACİL' },
      'normal':   { bg: 'var(--info)', label: 'BİLGİ' },
      'low':      { bg: 'var(--text3)', label: 'DÜŞÜK' }
    };
    const pr = priorityMap[n.priority] || priorityMap.normal;

    /* Detay metnini markdown benzeri biçimden HTML'e çevir */
    const detailsHTML = (n.details || '').split('\n').map(line => {
      if (line.trim() === '') return '<div style="height:8px;"></div>';
      if (/^\*\*(.+?)\*\*/.test(line)) {
        return `<div style="font-size:12.5px;color:var(--text);line-height:1.6;margin-bottom:4px;">${line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</div>`;
      }
      if (/^[•\-]\s/.test(line)) {
        return `<div style="font-size:12px;color:var(--text2);line-height:1.6;padding-left:14px;margin-bottom:3px;">${line}</div>`;
      }
      return `<div style="font-size:12.5px;color:var(--text);line-height:1.6;margin-bottom:4px;">${line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</div>`;
    }).join('');

    const actionBtn = n.action && n.action.target
      ? `<button onclick="App._notifAction('${n.action.type}', '${n.action.target}', ${JSON.stringify(n.action.payload || null)}); Swal.close();"
                 style="background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;width:100%;margin-top:6px;">
          <i class="fas fa-arrow-right"></i> İlgili Sayfaya Git
        </button>`
      : '';

    const result = await Swal.fire({
      title: '🔔 Bildirim Detayı',
      html: `<div style="text-align:left;">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);border-radius:10px;margin-bottom:12px;">
          <div style="width:36px;height:36px;border-radius:10px;background:${def.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">
            <i class="fas ${def.icon}"></i>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px;">${UI.escHtml(n.title)}</div>
            <div style="font-size:10.5px;color:var(--text3);">${dayjs(n.createdAt).format('DD MMMM YYYY · HH:mm')}</div>
          </div>
          <span style="background:${pr.bg};color:#fff;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:800;letter-spacing:.4px;">${pr.label}</span>
        </div>

        <div style="padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;">
          ${detailsHTML}
        </div>

        <div style="display:flex;gap:6px;">
          <button onclick="App.deleteNotification(${n.id}); Swal.close();"
                  style="flex:1;background:var(--danger-light);color:var(--danger);border:1px solid var(--danger);padding:9px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;">
            <i class="fas fa-trash"></i> Sil
          </button>
          ${actionBtn}
        </div>
      </div>`,
      width: Math.min(520, window.innerWidth - 24),
      showConfirmButton: false,
      showCloseButton: true
    });
  },

  _notifAction(type, target, payload) {
    Swal.close();
    setTimeout(() => {
      if (type === 'goto') {
        if (target === 'vehicle') {
          if (payload) { setTimeout(() => App.showBakimGecmisi(payload), 200); }
          else App.openVehicleModal();
        } else if (target === 'borcalacak') this.loadPage('borcalacak');
        else if (target === 'arsiv') this.loadPage('arsiv');
        else if (target === 'rapor') this.loadPage('rapor');
        else if (target === 'dashboard') this.loadPage('dashboard');
      }
    }, 200);
  },

  async markAllNotificationsRead() {
    const ok = await Notifications.markAllRead();
    if (ok) showToast('✓ Tüm bildirimler okundu');
    await this.openNotifications();
  },

  async clearReadNotifications() {
    const r = await Swal.fire({
      icon: 'question',
      title: 'Okunanları Sil?',
      text: 'Sadece "okundu" işaretli bildirimler silinecek.',
      showCancelButton: true,

      await Notifications.clearRead();

  async deleteNotification(id) {
    await Notifications.remove(id);

  /* 🆕 FAZ 3 — Global Arama */
  async openGlobalSearch() {
    await Swal.fire({
      title: '🔍 Global Arama',
      html: `<div style="text-align:left;">
        <div class="search-box" style="margin-bottom:10px;">
          <i class="fas fa-search"></i>
          <input type="text" id="globalSearchInput" class="form-input"
                 placeholder="İşlem, kişi, kategori, arşiv, log, ayar... her şeyi ara"
                 oninput="App._performGlobalSearch()">
        </div>
        <div id="globalSearchResults" style="max-height:420px;overflow-y:auto;">
          <div class="empty-state" style="padding:30px;">
            <i class="fas fa-keyboard"></i>
            <p>En az 2 karakter yazın</p>
            <p style="font-size:11px;opacity:.6;margin-top:6px;">Gelir, gider, borç, kategori, arşiv, log — her şeyde arar</p>
          </div>
        </div>
      </div>`,
      width: Math.min(560, window.innerWidth - 24),
      showCloseButton: true,
      showConfirmButton: false,
      didOpen: () => {
        setTimeout(() => document.getElementById('globalSearchInput')?.focus(), 120);
      }
    });
  },

  _performGlobalSearch() {
    const q = (document.getElementById('globalSearchInput')?.value || '').toLowerCase().trim();
    const results = document.getElementById('globalSearchResults');
    if (!results) return;

    if (q.length < 2) {
      results.innerHTML = '<div class="empty-state" style="padding:30px;"><i class="fas fa-keyboard"></i><p>En az 2 karakter yazın</p></div>';
      return;
    }

    const matches = [];

    state.gelirler.forEach(g => {
      const hay = ((g.kategori || '') + ' ' + (g.aciklama || '') + ' ' + (g.tarih || '')).toLowerCase();
      if (hay.includes(q)) {
        matches.push({ tip: 'gelir', item: g, label: g.kategori || '', sub: Calc.fmt(g.miktar) + ' - ' + (g.tarih || '') });
      }
    });

    state.giderler.forEach(g => {
      const hay = ((g.kategori || '') + ' ' + (g.aciklama || '') + ' ' + (g.tarih || '')).toLowerCase();
      if (hay.includes(q)) {
        matches.push({ tip: 'gider', item: g, label: g.kategori || '', sub: Calc.fmt(g.miktar) + ' - ' + (g.tarih || '') });
      }
    });

    state.borcalacaklar.forEach(b => {
      const hay = ((b.kisiAdi || '') + ' ' + (b.aciklama || '')).toLowerCase();
      if (hay.includes(q)) {
        matches.push({ tip: b.tip, item: b, label: b.kisiAdi || '', sub: Calc.formatBirim(b) + ' - ' + (b.odendiMi ? 'Odendi' : 'Aktif') });
      }
    });

    state.kategoriler.gelir.forEach(k => {
      if (k.toLowerCase().includes(q)) {
        matches.push({ tip: 'kategori', item: { k: k, t: 'gelir' }, label: k, sub: 'Gelir kategorisi' });
      }
    });
    state.kategoriler.gider.forEach(k => {
      if (k.toLowerCase().includes(q)) {
        matches.push({ tip: 'kategori', item: { k: k, t: 'gider' }, label: k, sub: 'Gider kategorisi' });
      }
    });

    const archiveKeys = Object.keys(state.archives);
    for (let i = 0; i < archiveKeys.length; i++) {
      const key = archiveKeys[i];
      const hay = (key + ' ' + SalaryMonth.shortLabel(key)).toLowerCase();
      if (hay.includes(q)) {
        const a = state.archives[key];
        const gCnt = Array.isArray(a.gelirler) ? a.gelirler.length : 0;
        const gdCnt = Array.isArray(a.giderler) ? a.giderler.length : 0;
        matches.push({ tip: 'arsiv', item: { key: key }, label: SalaryMonth.shortLabel(key), sub: 'Arsiv - ' + gCnt + ' gelir / ' + gdCnt + ' gider' });
      }
    }

    state.logs.forEach(l => {
      const hay = ((l.label || '') + ' ' + (l.details || '') + ' ' + (l.action || '')).toLowerCase();
      if (hay.includes(q)) {
        matches.push({ tip: 'log', item: l, label: l.label || l.action || '', sub: l.details || '' });
      }
    });

    if (matches.length === 0) {
      results.innerHTML = '<div class="empty-state" style="padding:30px;"><i class="fas fa-inbox"></i><p>Sonuc bulunamadi</p></div>';
      return;
    }

    const tipBadge = { gelir: 'success', gider: 'danger', alacak: 'success', borc: 'amber', kategori: 'blue', arsiv: 'cyan', log: 'blue' };

    const shown = matches.slice(0, 50);
    let html = '<div style="font-size:11px;color:var(--text3);padding:5px 0 8px;font-weight:600;">';
    html += shown.length + ' sonuc';
    if (matches.length > 50) html += ' (ilk 50 gosteriliyor)';
    html += '</div>';

    for (let i = 0; i < shown.length; i++) {
      const m = shown[i];
      let onclick = 'Swal.close()';

      if (m.tip === 'gelir' || m.tip === 'gider' || m.tip === 'alacak' || m.tip === 'borc') {
        onclick = 'Swal.close(); setTimeout(function(){ App.showTransactionDetail(' + m.item.id + ', ' + JSON.stringify(m.tip) + '); }, 200)';
      } else if (m.tip === 'arsiv') {
        onclick = 'Swal.close(); setTimeout(function(){ App.showArchiveDetail(' + JSON.stringify(m.item.key) + '); }, 200)';
      } else if (m.tip === 'log') {
        onclick = 'Swal.close(); setTimeout(function(){ App.showLogDetail(' + m.item.id + '); }, 200)';
      } else if (m.tip === 'kategori') {
        onclick = 'Swal.close(); setTimeout(function(){ App._islemTip=' + JSON.stringify(m.item.t) + '; App.loadPage("islemler"); }, 200)';
      }

      const safeOnclick = onclick.replace(/&/g, '&amp;').replace(/"/g, '&quot;');

      html += '<div onclick="' + safeOnclick + '" style="padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:5px;background:var(--surface2);cursor:pointer;">';
      html += '<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:2px;">';
      html += '<strong style="font-size:13px;color:var(--text);">' + UI.escHtml(m.label) + '</strong>';
      html += '<span class="badge badge-' + (tipBadge[m.tip] || 'blue') + '" style="font-size:9px;padding:2px 6px;">' + UI.escHtml(m.tip) + '</span>';
      html += '</div>';
      html += '<div style="font-size:11px;color:var(--text3);">' + UI.escHtml(m.sub) + '</div>';
      html += '</div>';
    }

    results.innerHTML = html;
  }
};

/* ═══════════════════════════════════════════════════════════════
   OTOMATİK ARŞİV KONTROLÜ
   ═══════════════════════════════════════════════════════════════ */
async function autoArchiveCheck() {
  try {
    const pending = SalaryMonth.pendingMonths();
    if (!pending.length) return;

    const totalGelir = pending.reduce((s, k) => {
      const r = SalaryMonth.range(k);
      return s + state.gelirler.filter(g => g.tarih >= r.start && g.tarih <= r.end).length;
    }, 0);
    const totalGider = pending.reduce((s, k) => {
      const r = SalaryMonth.range(k);
      return s + state.giderler.filter(g => g.tarih >= r.start && g.tarih <= r.end).length;
    }, 0);

    const { isConfirmed } = await Swal.fire({
      icon: 'warning',
      title: pending.length === 1
        ? '⏰ Arşiv Gecikmiş'
        : `⏰ ${pending.length} Dönem Arşivlenmeli`,
      html: `<div style="text-align:left;">
        <p><strong>${pending.length}</strong> dönem arşivlenmemiş durumda:</p>
        <div style="margin:12px 0;padding:12px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);max-height:180px;overflow-y:auto;">
          ${pending.map(k => `
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;">
              <span style="font-weight:700;">${SalaryMonth.shortLabel(k)}</span>
              <span style="color:var(--text3);font-size:10px;">${SalaryMonth.range(k).start.substring(5)} → ${SalaryMonth.range(k).end.substring(5)}</span>
            </div>
          `).join('')}
        </div>
        <p style="font-size:12px;color:#94a3b8;">
          <strong>${totalGelir}</strong> gelir · <strong>${totalGider}</strong> gider toplam
        </p>
      </div>`,
      showCancelButton: true,
      confirmButtonText: '✅ Tümünü Arşivle',
      cancelButtonText: 'Daha Sonra',
      width: Math.min(480, window.innerWidth - 24)
    });

    if (!isConfirmed) return;

    // Toplu işlem — loading modal tek seferlik
    Swal.fire({
      title: 'Arşivleniyor...',
      html: `<p>${pending.length} dönem arşivleniyor</p>
             <p style="font-size:11px;color:#94a3b8;margin-top:6px;">PDF raporları da oluşturuluyor</p>`,
      allowOutsideClick: false,
      allowEscapeKey: false,
      didOpen: () => Swal.showLoading()
    });

    CRUD._batchMode = true;   // ← EKLE
    let basarili = 0;
    let basarisiz = 0;
    for (const k of pending) {
      try {
        const ok = await CRUD.manualArchive(k);
        if (ok) basarili++;
        else basarisiz++;
      } catch (e) {
        console.warn(`[autoArchive] ${k} başarısız:`, e);
        basarisiz++;
      }
    }
    CRUD._batchMode = false;  // ← EKLE

    Swal.close();

    if (basarisiz > 0) {
      Swal.fire({
        icon: basarili > 0 ? 'warning' : 'error',
        title: basarili > 0 ? 'Kısmen Arşivlendi' : 'Arşivlenemedi',
        html: `<p><strong>${basarili}</strong> dönem arşivlendi, <strong>${basarisiz}</strong> dönem başarısız.</p>
               <p style="font-size:12px;color:#94a3b8;margin-top:8px;">Başarısız olanları Arşiv sayfasından tek tek deneyebilirsiniz.</p>`,
        confirmButtonText: 'Tamam'
      });
    } else {
      showToast(`✅ ${basarili} dönem arşivlendi`);
    }

    if (App.currentPage === 'dashboard') await App.renderDashboard();
    else if (App.currentPage === 'arsiv') await App.renderArsiv();
    else if (App.currentPage === 'islemler') await App.renderIslemler();
    else if (App.currentPage === 'borcalacak') await App.renderBorcalacak();
    else if (App.currentPage === 'rapor') await App.renderRapor();

  } catch (e) {
    console.warn('[autoArchiveCheck] Hata:', e);
  }
}

/* ─────────────────────────────────────────────
   MİGRASYON
   ───────────────────────────────────────────── */
async function migrateOldData(force = false) {
  const seenKey = 'butcem_migrate_done';
  if (!force && localStorage.getItem(seenKey) === '1') return;

  /* Maaş dönemi sınırları (15→15) */
  const currentKey = SalaryMonth.currentKey();
  const currentRange = SalaryMonth.range(currentKey);

  /* Aktif maaş dönemi dışındaki işlemler "eski" */
  const oldGelir = state.gelirler.filter(g => {
    if (!g.tarih) return false;
    return g.tarih < currentRange.start || g.tarih > currentRange.end;
  });
  const oldGider = state.giderler.filter(g => {
    if (!g.tarih) return false;
    return g.tarih < currentRange.start || g.tarih > currentRange.end;
  });

  if (oldGelir.length || oldGider.length) {
    const { isConfirmed } = await Swal.fire({
      icon: 'question',
      title: 'Geçmiş Aylar Arşivlensin mi?',
      html: `<p style="font-size:13px;">${oldGelir.length + oldGider.length} adet geçmiş tarihli kayıt bulundu.</p>
             <p style="font-size:12px;color:#94A3B8;margin-top:6px;">"Arşivle" derseniz ana listeden kaldırılıp Arşiv sekmesine taşınır. "Vazgeç" derseniz her şey olduğu gibi kalır.</p>`,
      showCancelButton: true,
      confirmButtonText: 'Arşivle',
      cancelButtonText: 'Vazgeç'
    });

    if (isConfirmed) {
      /* Maaş dönemlerine göre grupla */
      const months = new Set([
        ...oldGelir.map(g => SalaryMonth.keyOf(g.tarih)),
        ...oldGider.map(g => SalaryMonth.keyOf(g.tarih))
      ]);

      for (const m of months) {
        if (!state.archives[m]) {
          const r = SalaryMonth.range(m);
          const aLoglar = state.logs.filter(l => {
            const d = dayjs(l.timestamp).format('YYYY-MM-DD');
            return d >= r.start && d <= r.end;
          });
          state.archives[m] = {
            gelirler: oldGelir.filter(g => g.tarih >= r.start && g.tarih <= r.end),
            giderler: oldGider.filter(g => g.tarih >= r.start && g.tarih <= r.end),
            borcalacaklar: [],
            loglar: aLoglar,
            salaryMonthRange: r,
            year: SalaryMonth.yearOf(m),
            archivedAt: new Date().toISOString(),
            schemaVersion: 3
          };
        }
      }

      /* Sadece AKTİF maaş dönemi ana listede kalsın
         (önceki dönem de arşivlendi — çift kayıt önlenir) */
      state.gelirler = state.gelirler.filter(g => {
        if (!g.tarih) return true;
        return g.tarih >= currentRange.start && g.tarih <= currentRange.end;
      });
      state.giderler = state.giderler.filter(g => {
        if (!g.tarih) return true;
        return g.tarih >= currentRange.start && g.tarih <= currentRange.end;
      });
      state.logs = state.logs.filter(l => {
        const d = dayjs(l.timestamp).format('YYYY-MM-DD');
        return d >= currentRange.start && d <= currentRange.end;
      });

      await saveGelirler();
      await saveGiderler();
      await saveLogs();
      await saveArchives();
    }
  }

  localStorage.setItem(seenKey, '1');
}

/* ═══════════════════════════════════════════════════════════════
   PDF YARDIMCILARI — Türkçe karakter + modern tasarım
   ─────────────────────────────────────────────────────────────
   Roboto TTF CDN'den bir kez yüklenir, jsPDF'e gömülür.
   Font yüklenemezse otomatik ASCII fallback (ş→s, ğ→g …).
   ═══════════════════════════════════════════════════════════════ */

let _pdfFontData = null;
let _pdfFontFailed = false;

async function _loadPdfFonts(doc) {
  try {
    if (_pdfFontFailed) return false;
    if (!_pdfFontData) {
      const sources = [
        { name: 'Roboto-Regular.ttf', alias: 'Roboto', style: 'normal',
          url: 'https://cdn.jsdelivr.net/gh/googlefonts/roboto-2@main/src/hinted/Roboto-Regular.ttf' },
        { name: 'Roboto-Bold.ttf',    alias: 'Roboto', style: 'bold',
          url: 'https://cdn.jsdelivr.net/gh/googlefonts/roboto-2@main/src/hinted/Roboto-Bold.ttf' }
      ];
      _pdfFontData = [];
      for (const f of sources) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);
        try {
          const res = await fetch(f.url, { mode: 'cors', signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const buf = await res.arrayBuffer();
          _pdfFontData.push({ ...f, b64: _arrayBufferToBase64(buf) });
        } catch (fetchErr) {
          clearTimeout(timer);
          throw fetchErr;
        }
      }
      console.log('[PDF] ✅ Fontlar indirildi');
    }
    // ⬇️ BUNLAR EKSİK — geri ekle:
    for (const f of _pdfFontData) {
      doc.addFileToVFS(f.name, f.b64);
      doc.addFont(f.name, f.alias, f.style);
    }
    return true;      // ⬅️ BU DA EKSİK
  } catch (e) {
    _pdfFontFailed = true;
    _pdfFontData = null;
    console.warn('[PDF] ⚠️ Font yüklenemedi:', e);
    return false;
  }
}
function _arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function _ascii(str) {
  if (str == null) return '';
  return String(str)
    .replace(/ğ/g,'g').replace(/Ğ/g,'G')
    .replace(/ü/g,'u').replace(/Ü/g,'U')
    .replace(/ş/g,'s').replace(/Ş/g,'S')
    .replace(/ı/g,'i').replace(/İ/g,'I')
    .replace(/ö/g,'o').replace(/Ö/g,'O')
    .replace(/ç/g,'c').replace(/Ç/g,'C')
    .replace(/₺/g,'TL');
}

/* Türkçe-güvenli metin yazıcı: hasUni=false ise ASCII'ye çevirir */
function _txt(doc, str, x, y, opts, hasUni) {
  doc.text(hasUni ? String(str ?? '') : _ascii(str), x, y, opts);
}

function _roundRect(doc, x, y, w, h, r, fill, border) {
  if (fill)   doc.setFillColor(...fill);
  if (border) doc.setDrawColor(...border);
  doc.roundedRect(x, y, w, h, r, r, fill && border ? 'FD' : fill ? 'F' : 'D');
}

function _kart(doc, x, y, w, h, opts, hasUni, FONT) {
  const { label, value, accent } = opts;
  _roundRect(doc, x, y, w, h, 2.5, [255,255,255], [226,232,240]);
  doc.setFillColor(...accent);
  doc.rect(x, y, w, 2.2, 'F');
  doc.setFont(FONT, 'normal');
  doc.setFontSize(6.5);
  doc.setTextColor(100,116,139);
  _txt(doc, String(label).toUpperCase(), x + 3.5, y + 7, null, hasUni);
  doc.setFont(FONT, 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(...accent);
  _txt(doc, value, x + 3.5, y + 16, null, hasUni);
}

function _baslik(doc, text, y, hasUni, FONT) {
  doc.setFillColor(37,99,235);
  doc.circle(22, y - 0.5, 1.3, 'F');
  doc.setFont(FONT, 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(15,23,42);
  _txt(doc, text, 26, y + 0.5, null, hasUni);
  doc.setDrawColor(226,232,240);
  doc.setLineWidth(0.25);
  doc.line(20, y + 4.5, 190, y + 4.5);
}

function _bar(doc, x, y, w, h, pct, color) {
  doc.setFillColor(241,245,249);
  doc.roundedRect(x, y, w, h, 0.8, 0.8, 'F');
  const fw = Math.max(0, Math.min(w, w * pct));
  if (fw > 0) {
    doc.setFillColor(...color);
    doc.roundedRect(x, y, fw, h, 0.8, 0.8, 'F');
  }
}

function _footer(doc, pg, total, hasUni, FONT) {
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  doc.setDrawColor(226,232,240);
  doc.setLineWidth(0.15);
  doc.line(20, H - 14, W - 20, H - 14);
  doc.setFont(FONT, 'normal');
  doc.setFontSize(7);
  doc.setTextColor(148,163,184);
  _txt(doc, 'EBHA Mani  ·  Paranı gör, geleceğini planla', 20, H - 9.5, null, hasUni);
  _txt(doc, `Sayfa ${pg} / ${total}`, W - 20, H - 9.5, { align: 'right' }, hasUni);
}

/* ═══════════════════════════════════════════════════════════════
   ARŞİV PDF ÜRETİCİ — her arşivlemede otomatik çağrılır
   ═══════════════════════════════════════════════════════════════ */
async function buildArchivePDF(monthKey) {
  if (typeof window.jspdf === 'undefined') return null;

  const archive = state.archives[monthKey];
  if (!archive) return null;

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const W = doc.internal.pageSize.getWidth();
    const H = doc.internal.pageSize.getHeight();
    const M = 15;

    const hasUni = await _loadPdfFonts(doc);
    const FONT = hasUni ? 'Roboto' : 'helvetica';

    const range      = archive.salaryMonthRange || SalaryMonth.range(monthKey);
    const aGelirler  = Array.isArray(archive.gelirler) ? archive.gelirler : [];
    const aGiderler  = Array.isArray(archive.giderler) ? archive.giderler : [];
    const aLoglar    = Array.isArray(archive.loglar)   ? archive.loglar   : [];

    const toplamGelir = aGelirler.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const toplamGider = aGiderler.reduce((s, g) => s + (Number(g.miktar) || 0), 0);
    const net         = toplamGelir - toplamGider;

    /* KAPAK */
    doc.setFillColor(30, 64, 175);
    doc.rect(0, 0, W, 42, 'F');
    doc.setFillColor(37, 99, 235);
    doc.rect(0, 20, W, 22, 'F');

    doc.setFont(FONT, 'bold');
    doc.setFontSize(22);
    doc.setTextColor(255, 255, 255);
    _txt(doc, 'EBHA MANI', M, 16, null, hasUni);

    doc.setFont(FONT, 'normal');
    doc.setFontSize(11);
    doc.setTextColor(219, 234, 254);
    _txt(doc, 'Arşiv Raporu · ' + SalaryMonth.shortLabel(monthKey), M, 25, null, hasUni);
    _txt(doc, range.start + ' → ' + range.end, M, 32, null, hasUni);

    doc.setFontSize(8);
    _txt(doc, 'Oluşturma: ' + dayjs(archive.pdfGeneratedAt || archive.archivedAt || new Date()).format('DD MMMM YYYY HH:mm'), W - M, 32, { align: 'right' }, hasUni);

    /* ÖZET KARTLARI */
    let y = 52;
    const cw = (W - 2 * M - 6) / 3;

    _kart(doc, M,             y, cw, 20, { label: 'Toplam Gelir', value: Calc.fmt(toplamGelir), accent: [5,150,105] }, hasUni, FONT);
    _kart(doc, M + cw + 3,    y, cw, 20, { label: 'Toplam Gider', value: Calc.fmt(toplamGider), accent: [220,38,38] }, hasUni, FONT);
    _kart(doc, M + (cw+3)*2,  y, cw, 20, { label: 'Net Bakiye',   value: Calc.fmt(net),         accent: [37,99,235] }, hasUni, FONT);

    y += 26;

    /* İSTATİSTİK SATIRI */
    doc.setFont(FONT, 'normal');
    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    _txt(doc, `${aGelirler.length} gelir kaydı · ${aGiderler.length} gider kaydı · ${aLoglar.length} log kaydı`, M, y, null, hasUni);
    y += 8;

    /* TABLOLAR */
    const tabloCiz = (list, baslik, renk, isaret) => {
      if (!list.length) return;
      if (y > H - 50) { doc.addPage(); y = 20; }

      _baslik(doc, baslik + ' (' + list.length + ')', y, hasUni, FONT);
      y += 8;

      doc.setFillColor(248, 250, 252);
      doc.rect(M, y - 4, W - 2 * M, 6, 'F');
      doc.setFont(FONT, 'bold');
      doc.setFontSize(7.5);
      doc.setTextColor(100, 116, 139);
      _txt(doc, 'TARİH', M + 3, y, null, hasUni);
      _txt(doc, 'KATEGORİ', M + 25, y, null, hasUni);
      _txt(doc, 'AÇIKLAMA', M + 65, y, null, hasUni);
      _txt(doc, 'TUTAR', W - M - 3, y, { align: 'right' }, hasUni);
      y += 5;

      list.forEach(function(item, idx) {
        if (y > H - 20) { doc.addPage(); y = 20; }
        if (idx % 2 === 0) {
          doc.setFillColor(252, 253, 255);
          doc.rect(M, y - 4, W - 2 * M, 6.5, 'F');
        }
        doc.setFont(FONT, 'normal');
        doc.setFontSize(8.5);
        doc.setTextColor(71, 85, 105);
        _txt(doc, item.tarih || '-', M + 3, y, null, hasUni);
        doc.setTextColor(15, 23, 42);
        _txt(doc, String(item.kategori || '').substring(0, 18), M + 25, y, null, hasUni);
        doc.setTextColor(148, 163, 184);
        _txt(doc, String(item.aciklama || '-').substring(0, 35), M + 65, y, null, hasUni);
        doc.setFont(FONT, 'bold');
        doc.setTextColor(...renk);
        _txt(doc, isaret + Calc.fmt(item.miktar), W - M - 3, y, { align: 'right' }, hasUni);
        y += 6.5;
      });

      y += 6;
    };

    tabloCiz(aGelirler, 'GELİRLER', [5, 150, 105], '+');
    tabloCiz(aGiderler, 'GİDERLER', [220, 38, 38], '-');

    /* FOOTER */
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      _footer(doc, i, totalPages, hasUni, FONT);
    }

    return doc.output('datauristring');
  } catch (e) {
    console.error('[Archive PDF] Üretim hatası:', e);
    return null;
  }
}

/* 🆕 FAZ 3 — PDF için geçici grafik render */
async function _renderChartToBase64(type, data, options) {
  return new Promise((resolve) => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 400;
      canvas.style.position = 'absolute';
      canvas.style.left = '-9999px';
      canvas.style.top = '-9999px';
      document.body.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      const chart = new Chart(ctx, {
        type,
        data,
        options: {
          ...options,
          animation: false,
          responsive: false,
          maintainAspectRatio: false
        },
        devicePixelRatio: 2
      });

      setTimeout(() => {
        try {
          const base64 = chart.toBase64Image('image/png', 1);
          chart.destroy();
          document.body.removeChild(canvas);
          resolve(base64);
        } catch (err) {
          try { chart.destroy(); } catch(e) {}
          try { document.body.removeChild(canvas); } catch(e) {}
          resolve(null);
        }
      }, 500);
    } catch (e) {
      console.warn('[ChartToBase64] Hata:', e);
      resolve(null);
    }
  });
}

/* ───── Kalıcı depolama izni ─────
   iOS ve bazı tarayıcılar persist() çağrısına kullanıcı etkileşimi
   sonrası daha olumlu yanıt verir. İlk tıklamada bir kez tetiklenir. */
let persistRequested = false;
async function requestPersistentStorage() {
  if (persistRequested) return;
  persistRequested = true;
  if (!navigator.storage || !navigator.storage.persist) return;

  // ⏱️ Timeout koruması
  const withTimeout = (p, ms = 2000) => Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);

  try {
    const isPersisted = await withTimeout(navigator.storage.persisted());
    if (isPersisted) return;
    await withTimeout(navigator.storage.persist());
  } catch (e) {
    console.warn('[Storage] Persist isteği:', e.message);
  }
}

          html: `<p style="font-size:13px;">iOS Safari, <strong>7 gün</strong> ziyaret edilmeyen sitelerin verilerini silebilir.</p>
                 <p style="font-size:13px;margin-top:10px;">📲 Ana Ekrana Ekleyin<br>💾 Düzenli JSON Yedeği alın</p>`,
          confirmButtonText: 'Anladım', timer: 12000, timerProgressBar: true
        });
        localStorage.setItem('ios_install_hint_shown', '1');
      }

      // 5) Yedek hatırlatıcı — 30 saniye beklet, modal üst üste binmesin
      await new Promise(r => setTimeout(r, 30000));
      await checkBackupReminder().catch(e => console.warn('[init] reminder:', e));
    } catch (e) { console.warn('[init] Arka plan görevleri:', e); }
  }, 1500);
})();
</script>
</body>
